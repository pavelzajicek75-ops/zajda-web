<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Článek - Moje diagnóza, můj vesmír</title>
  <link rel="stylesheet" href="/style.css?v=1.0">
</head>
<body>

<!-- CITÁTY – hvězdy po celé stránce -->
<div id="floatingQuotesContainer"></div>

<header class="hero">
  <nav class="nav-links">
    <a href="/">Domů</a>
    <a href="/clanky/">Články</a>
    <a href="/admin/editor.html">Admin</a>
  </nav>
</header>

<section class="article-detail" id="articleDetail">
  <div style="text-align: center; color: #ccc;">
    Načítám článek...
  </div>
</section>

<footer>
  <p>© 2026 Moje diagnóza, můj vesmír</p>
</footer>

<script src="/app.js?v=1.0"></script>
<script>
async function loadArticle() {
  try {
    // Get article ID from URL path
    const pathParts = window.location.pathname.split('/').filter(p => p);
    const articleId = pathParts[1];

    if (!articleId) {
      document.getElementById("articleDetail").innerHTML = '<div style="color: #ff6600;">Článek nenalezen</div>';
      return;
    }

    const res = await fetch(`/api/articles/${articleId}`);
    if (!res.ok) {
      if (res.status === 404) {
        document.getElementById("articleDetail").innerHTML = '<div style="color: #ff6600;">Článek nenalezen</div>';
      } else {
        document.getElementById("articleDetail").innerHTML = '<div style="color: #ff6600;">Chyba při načítání</div>';
      }
      return;
    }

    const article = await res.json();

    const container = document.getElementById("articleDetail");
    container.innerHTML = `
      <h1>${article.title}</h1>
      <div class="meta">
        Autor: ${article.author} | ${new Date(article.created).toLocaleDateString('cs-CZ')}
      </div>
      <div class="content">
        ${article.content.replace(/\n/g, '<br>')}
      </div>
    `;

    // Update page title
    document.title = article.title + " - Moje diagnóza, můj vesmír";
  } catch (err) {
    console.error("Error loading article:", err);
    document.getElementById("articleDetail").innerHTML = '<div style="color: #ff6600;">Chyba: ' + err.message + '</div>';
  }
}

document.addEventListener("DOMContentLoaded", loadArticle);
</script>

</body>
</html>
