<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, #050509, #000000 80%),
        radial-gradient(circle at 70% 80%, rgba(40,0,80,0.25), transparent 70%),
        radial-gradient(circle at 20% 70%, rgba(0,40,120,0.20), transparent 70%),
        radial-gradient(circle at 60% 30%, rgba(120,40,0,0.15), transparent 80%);
      background-blend-mode: screen;
      position: relative;
      height: 100vh;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.7;
      animation: twinkle 4s infinite ease-in-out;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { opacity: 0.2; }
    }

    .title-block {
      position: absolute;
      top: 40px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    .cz-title {
      font-size: 48px;
      font-weight: 600;
      color: #ff6600;
      text-shadow: 0 0 25px #ff6600;
      letter-spacing: 2px;
      display: block;
    }

    .en-title {
      font-size: 28px;
      font-weight: 400;
      color: #ffcc66;
      text-shadow: 0 0 20px #ffcc66;
      margin-top: 8px;
      display: block;
    }

    .intro-text {
      position: absolute;
      top: 220px;
      right: 80px;
      width: 380px;
      text-align: left;
      color: #ffb366;
      font-size: 18px;
      line-height: 1.5;
      text-shadow: 0 0 12px rgba(255, 150, 50, 0.4);
      z-index: 9;
    }

    .quote-star {
      position: absolute;
      max-width: 320px;
      white-space: normal;
      color: rgba(255,255,255,0.75);
      font-weight: 300;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
      pointer-events: auto;
      cursor: default;
      z-index: 5;
    }

    .quote-star.visible {
      opacity: 0.75;
    }

    .quote-star:hover {
      opacity: 1;
      text-shadow:
        0 0 25px #ffffff,
        0 0 45px #ff6600,
        0 0 70px #ff6600;
    }

    @keyframes drift {
      from { transform: translate(var(--sx), var(--sy)); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      to { transform: translate(var(--ex), var(--ey)); opacity: 0; }
    }

    .sections {
      position: absolute;
      bottom: 40px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 40px;
      z-index: 10;
    }

    .card {
      position: relative;
      width: 220px;
      height: 140px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 150, 50, 0.3);
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.08);
      box-shadow: 0 0 40px rgba(255, 150, 50, 0.6);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.8);
      transition: filter 0.3s ease;
    }

    .card:hover img {
      filter: brightness(1);
    }

    .card span {
      position: absolute;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #ffcc66;
      font-size: 18px;
      text-shadow: 0 0 10px rgba(255, 200, 100, 0.6);
      pointer-events: none;
    }
  </style>
</head>

<body>

  <script>
    for (let i = 0; i < 180; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.left = Math.random() * window.innerWidth + "px";
      star.style.top = Math.random() * window.innerHeight + "px";
      star.style.animationDelay = (Math.random() * 4) + "s";
      document.body.appendChild(star);
    }
  </script>

  <div class="title-block">
    <span class="cz-title">Moje diagnóza, můj vesmír</span>
    <span class="en-title">My diagnosis, my universe</span>
  </div>

  <div class="intro-text">
    Jsem Zajda. Trochu cvok a občasný zapisovatel vlastního života. Tohle je místo, kam si odkládám vzpomínky z cest, příběhy z míst, kde byl občas pořádný rachot...
  </div>

  <div class="sections">
    <div class="card">
      <a href="/travel">
        <img src="/images/placeholder.jpg" alt="Travel">
        <span>Cestování / Travel</span>
      </a>
    </div>
    <div class="card">
      <a href="/photo">
        <img src="/images/placeholder.jpg" alt="Photo">
        <span>Fotografování / Photo</span>
      </a>
    </div>
    <div class="card">
      <a href="/projects">
        <img src="/images/placeholder.jpg" alt="Projects">
        <span>Projekty / Projects</span>
      </a>
    </div>
    <div class="card">
      <a href="/about">
        <img src="/images/placeholder.jpg" alt="About Zajda">
        <span>Zajda / About</span>
      </a>
    </div>
  </div>

  <script>
    /* ─── NAČÍTÁNÍ CITÁTŮ Z API ─── */
    async function loadQuotes() {
      try {
        const res = await fetch("/api/quotes/list");
        if (!res.ok) throw new Error("API error " + res.status);
        const data = await res.json();
        return Array.isArray(data) ? data : [];
      } catch (e) {
        console.error("Citáty se nepodařilo načíst:", e);
        return [];
      }
    }

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnQuote(q) {
      const el = document.createElement("div");
      el.className = "quote-star";

      const size = Math.floor(random(14, 26));

      el.innerHTML = `
        <div style="text-align:right; font-size:${size}px; word-break:break-word;">
          "<strong>${q.text}</strong>"<br>
          <span style="color:#ffcc66; font-size:${size * 0.55}px; opacity:0.85;">
            ${q.author || ''}
          </span>
        </div>
      `;

      const startX = random(0, window.innerWidth);
      const startY = random(0, window.innerHeight);
      const endX = startX + random(-300, 300);
      const endY = startY + random(-300, 300);

      el.style.left = startX + "px";
      el.style.top = startY + "px";

      el.style.setProperty("--sx", "0px");
      el.style.setProperty("--sy", "0px");
      el.style.setProperty("--ex", (endX - startX) + "px");
      el.style.setProperty("--ey", (endY - startY) + "px");

      el.style.animation = `drift ${random(14, 22)}s linear infinite`;

      setTimeout(() => el.classList.add("visible"), 50);

      el.addEventListener("mouseenter", () => { el.style.animationPlayState = "paused"; });
      el.addEventListener("mouseleave", () => { el.style.animationPlayState = "running"; });

      document.body.appendChild(el);
    }

    async function startSky() {
      const quotes = await loadQuotes();
      if (!quotes.length) {
        console.log("Žádné citáty v databázi");
        return;
      }

      for (let i = 0; i < Math.min(10, quotes.length); i++) {
        spawnQuote(quotes[Math.floor(Math.random() * quotes.length)]);
      }

      setInterval(() => {
        const stars = document.querySelectorAll(".quote-star");
        if (stars.length > 10) stars[0].remove();
        const q = quotes[Math.floor(Math.random() * quotes.length)];
        spawnQuote(q);
      }, 4000);
    }

    /* ═══ NAČÍTÁNÍ COVER FOTEK SEKCÍ Z GALERIE ═══ */
    async function loadSectionCovers() {
      const sections = [
        { id: 'travel', href: '/travel' },
        { id: 'photo', href: '/photo' },
        { id: 'projects', href: '/projects' },
        { id: 'about', href: '/about' }
      ];

      for (const sec of sections) {
        try {
          const res = await fetch('/api/sections/cover?sectionId=' + sec.id);
          if (!res.ok) continue;
          const data = await res.json();
          const url = data.coverUrl || data.url;
          if (!url) continue;

          const link = document.querySelector(`.card a[href="${sec.href}"]`);
          if (link) {
            const img = link.querySelector('img');
            if (img) img.src = url;
          }
        } catch (e) {
          console.error('Chyba načítání coveru sekce', sec.id, e);
        }
      }
    }

    /* Spustit vše po načtení stránky */
    window.addEventListener("load", () => {
      startSky();
      loadSectionCovers();
    });
  </script>

</body>
</html>
