<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #000; color: #fff; overflow-x: hidden; min-height: 100vh; position: relative; }
    .bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(circle at 50% 20%, #0a0a1a, #000 80%), radial-gradient(circle at 80% 80%, rgba(60,20,100,0.3), transparent 60%), radial-gradient(circle at 20% 70%, rgba(0,60,120,0.25), transparent 60%); background-blend-mode: screen; }
    .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0; animation: twinkle var(--dur) ease-in-out infinite; animation-delay: var(--del); }
    @keyframes twinkle { 0%,100% { opacity: 0.1; transform: scale(0.5); } 50% { opacity: 0.9; transform: scale(1); } }
    .title-block { position: relative; z-index: 10; text-align: center; padding-top: 40px; }
    .cz-title { font-size: clamp(28px, 5vw, 52px); font-weight: 700; color: #ff6600; text-shadow: 0 0 30px rgba(255,102,0,0.6); letter-spacing: 2px; }
    .en-title { font-size: clamp(18px, 3vw, 30px); font-weight: 300; color: #ffcc66; text-shadow: 0 0 20px rgba(255,204,102,0.5); margin-top: 6px; }
    .latest-panel { position: absolute; top: 140px; left: 40px; z-index: 10; width: 320px; max-width: 90vw; background: rgba(15,23,42,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,102,0,0.3); border-radius: 14px; padding: 1.2rem; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .latest-panel h3 { color: #ffcc66; font-size: 16px; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 8px; }
    .latest-panel h3::before { content: '◆'; color: #ff6600; }
    .latest-item { display: block; color: #e2e8f0; text-decoration: none; padding: 0.6rem 0; border-bottom: 1px solid rgba(51,65,85,0.5); font-size: 14px; transition: all 0.2s; }
    .latest-item:hover { color: #ff6600; padding-left: 6px; text-shadow: 0 0 12px rgba(255,102,0,0.4); }
    .latest-item:last-child { border-bottom: none; }
    .latest-item small { color: #94a3b8; font-size: 12px; display: block; margin-top: 2px; }
    .latest-empty { color: #64748b; font-size: 13px; padding: 0.5rem 0; }
    .intro-text { position: absolute; top: 200px; right: 60px; z-index: 10; width: 360px; max-width: 90vw; color: #ffb366; font-size: 16px; line-height: 1.6; text-shadow: 0 0 12px rgba(255,150,50,0.3); text-align: left; }
    .sections-container { position: absolute; bottom: 60px; left: 0; width: 100%; z-index: 10; display: flex; justify-content: center; gap: 24px; padding: 0 20px; flex-wrap: wrap; }
    .section-card { position: relative; width: 220px; height: 150px; border-radius: 14px; cursor: pointer; flex-shrink: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .section-card:hover:not(.expanded) { transform: translateY(-8px) scale(1.05); }
    .section-card:hover:not(.expanded) .card-label { text-shadow: 0 0 20px rgba(255,204,102,0.8); }
    .section-card.expanded { width: 460px; height: 340px; z-index: 100; transform: translateY(-40px); }
    .card-glow { position: absolute; inset: -2px; border-radius: 16px; background: linear-gradient(135deg, rgba(255,102,0,0.4), rgba(255,204,102,0.2)); opacity: 0; transition: opacity 0.3s; filter: blur(8px); z-index: -1; }
    .section-card:hover .card-glow, .section-card.expanded .card-glow { opacity: 1; }
    .card-inner { position: relative; width: 100%; height: 100%; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); background: #0f172a; box-shadow: 0 4px 20px rgba(0,0,0,0.6); transition: border-color 0.3s; }
    .section-card.expanded .card-inner { border-color: rgba(255,102,0,0.6); }
    .card-inner img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); transition: filter 0.4s, transform 0.6s; }
    .section-card:hover:not(.expanded) .card-inner img { filter: brightness(1.25) contrast(1.15) saturate(1.1); }
    .section-card.expanded .card-inner img { filter: brightness(0.35) blur(1px); transform: scale(1.1); }
    .card-label { position: absolute; bottom: 0; left: 0; width: 100%; padding: 24px 10px 10px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); color: #ffcc66; font-size: 17px; font-weight: 600; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,0.9); pointer-events: none; transition: opacity 0.3s, text-shadow 0.3s; }
    .section-card.expanded .card-label { opacity: 0; }
    .card-content { position: absolute; inset: 0; z-index: 5; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; overflow-y: auto; background: rgba(15,23,42,0.85); backdrop-filter: blur(6px); border-radius: 14px; }
    .section-card.expanded .card-content { opacity: 1; pointer-events: auto; }
    .card-content::-webkit-scrollbar { width: 4px; }
    .card-content::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .card-content h4 { color: #ffcc66; font-size: 18px; margin-bottom: 12px; text-shadow: 0 2px 8px rgba(0,0,0,0.9); border-bottom: 1px solid rgba(255,102,0,0.3); padding-bottom: 8px; }
    .close-btn { position: absolute; top: 8px; right: 12px; background: rgba(255,255,255,0.1); border: none; color: #ffcc66; font-size: 20px; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s; z-index: 10; }
    .close-btn:hover { background: rgba(255,102,0,0.3); }
    .sub-block { margin-bottom: 8px; }
    .sub-title { color: #ff6600; font-size: 14px; font-weight: 600; padding: 6px 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(51,65,85,0.4); transition: all 0.2s; border-radius: 4px; }
    .sub-title:hover { color: #ffcc66; background: rgba(255,102,0,0.1); text-shadow: 0 0 12px rgba(255,204,102,0.6); padding-left: 12px; }
    .sub-title::after { content: '▼'; font-size: 10px; color: #64748b; transition: transform 0.2s; }
    .sub-block.collapsed .sub-title::after { transform: rotate(-90deg); }
    .sub-articles { max-height: 400px; overflow-y: auto; transition: max-height 0.4s ease; }
    .sub-block.collapsed .sub-articles { max-height: 0; overflow: hidden; }
    .article-link { display: block; padding: 6px 8px 6px 16px; color: #e2e8f0; text-decoration: none; font-size: 13px; border-left: 2px solid #334155; transition: all 0.2s; white-space: normal; line-height: 1.4; margin: 2px 0; border-radius: 0 4px 4px 0; }
    .article-link:hover { color: #fff; border-left-color: #ff6600; padding-left: 20px; background: rgba(255,102,0,0.08); text-shadow: 0 0 10px rgba(255,102,0,0.3); }
    .article-link .art-title { font-weight: 600; }
    .article-link .art-date { font-size: 11px; color: #94a3b8; display: block; margin-top: 1px; }
    .article-link .art-excerpt { font-size: 11px; color: #64748b; display: block; margin-top: 1px; }
    .no-articles { color: #64748b; font-size: 13px; padding: 8px 0; font-style: italic; }
    .share-bar { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; gap: 10px; }
    .share-btn { background: rgba(15,23,42,0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,102,0,0.3); color: #ffcc66; padding: 10px 18px; border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    .share-btn:hover { background: rgba(255,102,0,0.2); border-color: #ff6600; transform: translateY(-2px); }
    .share-btn.wa { color: #25d366; border-color: rgba(37,211,102,0.3); }
    .share-btn.wa:hover { background: rgba(37,211,102,0.15); border-color: #25d366; }
    .quote-star { position: absolute; max-width: 300px; pointer-events: auto; z-index: 5; animation: drift linear infinite; }
    .quote-inner { color: rgba(255,255,255,0.75); font-weight: 300; font-size: 15px; text-shadow: 0 0 10px rgba(255,255,255,0.4); line-height: 1.45; transition: transform 0.35s ease, opacity 0.3s; }
    .quote-star:hover { animation-play-state: paused !important; }
    .quote-star:hover .quote-inner { transform: scale(1.1); opacity: 1; text-shadow: 0 0 25px #fff, 0 0 40px #ff6600; }
    .quote-author { color: #ffcc66; font-size: 0.65em; opacity: 0.85; display: block; margin-top: 4px; }
    @keyframes drift { from { transform: translate(var(--sx), var(--sy)); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } to { transform: translate(var(--ex), var(--ey)); opacity: 0; } }
    .overlay-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.3); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .overlay-backdrop.active { opacity: 1; pointer-events: auto; }
    .lightbox-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; cursor: zoom-out; }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 40px rgba(255,102,0,0.3); }
    @media (max-width: 900px) { .latest-panel { position: relative; top: auto; left: auto; margin: 20px auto; width: 90%; } .intro-text { position: relative; top: auto; right: auto; margin: 20px auto; width: 90%; text-align: center; } .sections-container { position: relative; bottom: auto; margin: 40px 0; flex-direction: column; align-items: center; } .section-card { width: 85%; max-width: 340px; } .section-card.expanded { width: 95%; max-width: 500px; height: 380px; transform: translateY(-20px); } }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="stars" id="stars"></div>
  <div class="overlay-backdrop" id="overlayBackdrop"></div>
  <div class="lightbox-overlay" id="lightboxOverlay" onclick="this.classList.remove('open')"></div>
  <div class="title-block">
    <div class="cz-title">Moje diagnóza, můj vesmír</div>
    <div class="en-title">My diagnosis, my universe</div>
  </div>
  <div class="latest-panel" id="latestPanel">
    <h3>Poslední aktuality</h3>
    <div style="color:#64748b;font-size:13px;padding:0.5rem 0">Načítání...</div>
  </div>
  <div class="intro-text">Jsem Zajda. Trochu cvok a občasný zapisovatel vlastního života. Tohle je místo, kam si odkládám vzpomínky z cest, příběhy z míst, kde byl občas pořádný rachot...</div>
  <div class="sections-container" id="sectionsContainer"></div>
  <div class="share-bar">
    <a class="share-btn wa" id="shareWhatsApp" href="#" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Sdílet aktualizaci
    </a>
  </div>
  <script>
  function openLightbox(src) {
    var overlay = document.getElementById('lightboxOverlay');
    if (!overlay) return;
    overlay.innerHTML = '<img src="' + src + '" alt="">';
    overlay.classList.add('open');
  }

  document.addEventListener('DOMContentLoaded', function() {
    var starsBox = document.getElementById('stars');
    if (starsBox) {
      var frag = document.createDocumentFragment();
      for (var i = 0; i < 200; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.setProperty('--dur', (3 + Math.random() * 4) + 's');
        s.style.setProperty('--del', (Math.random() * 5) + 's');
        frag.appendChild(s);
      }
      starsBox.appendChild(frag);
    }

    function escapeHtml(t) {
      if (t == null) return '';
      return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('cs', { year: 'numeric', month: 'numeric', day: 'numeric' });
      } catch(e) { return ''; }
    }

    async function loadQuotes() {
      try { var r = await fetch('/api/quotes/list'); if (!r.ok) return []; return await r.json(); }
      catch(e) { return []; }
    }
    function spawnQuote(q) {
      var el = document.createElement('div');
      el.className = 'quote-star';
      var sz = 13 + Math.floor(Math.random() * 10);
      el.innerHTML = '<div class="quote-inner" style="font-size:' + sz + 'px">"' + escapeHtml(q.text || '') + '"<span class="quote-author">' + escapeHtml(q.author || '') + '</span></div>';
      var sx = Math.random() * (window.innerWidth - 100);
      var sy = Math.random() * (window.innerHeight - 80);
      el.style.left = sx + 'px';
      el.style.top = sy + 'px';
      var ex = (Math.random() - 0.5) * 400;
      var ey = (Math.random() - 0.5) * 400;
      el.style.setProperty('--sx', '0px');
      el.style.setProperty('--sy', '0px');
      el.style.setProperty('--ex', ex + 'px');
      el.style.setProperty('--ey', ey + 'px');
      el.style.animationDuration = (14 + Math.random() * 10) + 's';
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, 25000);
    }
    async function startQuotes() {
      var quotes = await loadQuotes();
      if (!quotes.length) return;
      for (var i = 0; i < Math.min(8, quotes.length); i++) spawnQuote(quotes[Math.floor(Math.random() * quotes.length)]);
      setInterval(function() {
        if (document.querySelectorAll('.quote-star').length > 12) return;
        spawnQuote(quotes[Math.floor(Math.random() * quotes.length)]);
      }, 5000);
    }

    var cachedArticles = null;
    async function getAllArticles() {
      if (cachedArticles) return cachedArticles;
      try {
        var r = await fetch('/api/articles/list');
        if (!r.ok) return [];
        var data = await r.json();
        cachedArticles = Array.isArray(data) ? data : [];
        return cachedArticles;
      } catch(e) { return []; }
    }

    async function loadLatest() {
      var box = document.getElementById('latestPanel');
      if (!box) return;
      var articles = await getAllArticles();
      var sorted = articles.slice().sort(function(a, b) {
        var da = a.created || a.date || '';
        var db = b.created || b.date || '';
        if (da < db) return 1;
        if (da > db) return -1;
        return 0;
      });
      var latest = sorted.slice(0, 3);
      if (!latest.length) {
        box.innerHTML = '<h3>Poslední aktuality</h3><div class="latest-empty">Zatím žádné články</div>';
        return;
      }
      var html = '<h3>Poslední aktuality</h3>';
      for (var i = 0; i < latest.length; i++) {
        var a = latest[i];
        var artId = a.id || '';
        var title = a.title || 'Bez názvu';
        var date = a.created || a.date || '';
        var dateStr = formatDate(date);
        var meta = dateStr ? '• ' + dateStr : '';
        html += '<a class="latest-item" href="/article.html?id=' + encodeURIComponent(artId) + '">' + escapeHtml(title) + '<small>' + escapeHtml(meta) + '</small></a>';
      }
      box.innerHTML = html;
      var shareText = 'Nové aktuality na Moje diagnóza, můj vesmír! ' + latest.map(function(a){ return a.title; }).join(', ') + ' - ' + window.location.origin;
      var waBtn = document.getElementById('shareWhatsApp');
      if (waBtn) waBtn.href = 'https://wa.me/?text=' + encodeURIComponent(shareText);
    }

    var SECTIONS = [
      { id: 'travel', name: 'Cestování', nameEn: 'Travel' },
      { id: 'photo', name: 'Fotografování', nameEn: 'Photo' },
      { id: 'projects', name: 'Projekty', nameEn: 'Projects' },
      { id: 'about', name: 'O Zajdovi', nameEn: 'About' }
    ];

    async function loadSectionCover(secId) {
      try {
        var r = await fetch('/api/sections/cover?sectionId=' + secId);
        if (!r.ok) return '';
        var d = await r.json();
        return d.url || '';
      } catch(e) { return ''; }
    }

    async function loadSubsections(secId) {
      try {
        var r = await fetch('/api/subsections/by-section?sectionId=' + secId);
        if (!r.ok) return [];
        return await r.json();
      } catch(e) { return []; }
    }

    window.closeAllCardsWrapper = function() {
      document.querySelectorAll('.section-card.expanded').forEach(function(c) { c.classList.remove('expanded'); });
      var backdrop = document.getElementById('overlayBackdrop');
      if (backdrop) backdrop.classList.remove('active');
    };

    function renderArticleList(articles) {
      if (!articles.length) return '<div class="no-articles">Žádné články</div>';
      var sorted = articles.slice().sort(function(a, b) {
        var da = a.created || a.date || '';
        var db = b.created || b.date || '';
        if (da < db) return 1;
        if (da > db) return -1;
        return 0;
      });
      var html = '';
      for (var i = 0; i < sorted.length; i++) {
        var a = sorted[i];
        var artId = a.id || '';
        var title = a.title || 'Bez názvu';
        var date = a.created || a.date || '';
        var dateStr = formatDate(date);
        var excerpt = a.content ? a.content.replace(/<[^>]+>/g, '').substring(0, 60) + '...' : '';
        html += '<a class="article-link" href="/article.html?id=' + encodeURIComponent(artId) + '">' +
          '<span class="art-title">' + escapeHtml(title) + '</span>' +
          (dateStr ? '<span class="art-date">' + escapeHtml(dateStr) + '</span>' : '') +
          (excerpt ? '<span class="art-excerpt">' + escapeHtml(excerpt) + '</span>' : '') +
          '</a>';
      }
      return html;
    }

    async function buildSections() {
      var container = document.getElementById('sectionsContainer');
      if (!container) return;
      container.innerHTML = '';
      for (var s = 0; s < SECTIONS.length; s++) {
        (function(sec) {
          var card = document.createElement('div');
          card.className = 'section-card';
          card.dataset.sectionId = sec.id;
          var imgEl = document.createElement('img');
          imgEl.alt = sec.name;
          imgEl.src = '/images/placeholder.jpg';
          imgEl.onerror = function() { this.src = '/images/placeholder.jpg'; };
          loadSectionCover(sec.id).then(function(coverUrl) {
            if (coverUrl) imgEl.src = coverUrl;
          });
          var cardInner = document.createElement('div');
          cardInner.className = 'card-inner';
          cardInner.appendChild(imgEl);
          var label = document.createElement('div');
          label.className = 'card-label';
          label.textContent = sec.name + ' / ' + sec.nameEn;
          cardInner.appendChild(label);
          var glow = document.createElement('div');
          glow.className = 'card-glow';
          var content = document.createElement('div');
          content.className = 'card-content';
          content.id = 'content-' + sec.id;
          content.innerHTML = '<button class="close-btn" onclick="event.stopPropagation(); window.closeAllCardsWrapper()">×</button><h4>' + escapeHtml(sec.name) + '</h4><div style="color:#64748b;font-size:13px">Načítání...</div>';
          card.appendChild(glow);
          card.appendChild(cardInner);
          card.appendChild(content);
          card.addEventListener('click', async function(e) {
            if (e.target.closest('.close-btn') || e.target.closest('.card-content')) return;
            if (card.classList.contains('expanded')) { window.closeAllCardsWrapper(); return; }
            window.closeAllCardsWrapper();
            card.classList.add('expanded');
            var backdrop = document.getElementById('overlayBackdrop');
            if (backdrop) backdrop.classList.add('active');
            var contentEl = document.getElementById('content-' + sec.id);
            if (!contentEl || contentEl.dataset.loaded) return;
            var subs = await loadSubsections(sec.id);
            var html = '<button class="close-btn" onclick="event.stopPropagation(); window.closeAllCardsWrapper()">×</button><h4>' + escapeHtml(sec.name) + '</h4>';
            if (sec.id === 'about' || !subs.length) {
              var all = await getAllArticles();
              var articles = all.filter(function(a) {
                var secId = a.sectionId;
                if (secId == null) return false;
                return String(secId) === sec.id;
              });
              html += renderArticleList(articles);
            } else {
              for (var i = 0; i < subs.length; i++) {
                var sub = subs[i];
                var subId = sub.id || '';
                var subName = sub.name || '';
                html += '<div class="sub-block collapsed" id="subblock-' + escapeHtml(subId) + '">' +
                  '<div class="sub-title" data-sub-id="' + escapeHtml(subId) + '" data-sec-id="' + escapeHtml(sec.id) + '">' + escapeHtml(subName) + '</div>' +
                  '<div class="sub-articles" id="subarticles-' + escapeHtml(subId) + '"><div style="color:#64748b;font-size:12px;padding:6px 0">Klikni pro načtení článků</div></div>' +
                  '</div>';
              }
            }
            contentEl.innerHTML = html;
            contentEl.querySelectorAll('.sub-title').forEach(function(titleEl) {
              titleEl.addEventListener('click', function(e) {
                e.stopPropagation();
                var sid = this.getAttribute('data-sub-id');
                var scid = this.getAttribute('data-sec-id');
                window.toggleSub(sid, scid);
              });
            });
            contentEl.dataset.loaded = '1';
          });
          container.appendChild(card);
        })(SECTIONS[s]);
      }
    }

    window.toggleSub = async function(subId, secId) {
      var block = document.getElementById('subblock-' + subId);
      var list = document.getElementById('subarticles-' + subId);
      if (!block || !list) return;
      var isCollapsed = block.classList.contains('collapsed');
      document.querySelectorAll('.sub-block').forEach(function(b) {
        if (b !== block) b.classList.add('collapsed');
      });
      if (!isCollapsed) { block.classList.add('collapsed'); return; }
      block.classList.remove('collapsed');
      if (list.dataset.loaded) return;
      list.innerHTML = '<div style="color:#64748b;font-size:12px;padding:6px 0">Načítání...</div>';
      var all = await getAllArticles();
      var articles = all.filter(function(a) {
        var aSec = a.sectionId;
        var aSub = a.subsectionId;
        if (aSec == null || aSub == null) return false;
        return String(aSec) === String(secId) && String(aSub) === String(subId);
      });
      list.innerHTML = renderArticleList(articles);
      list.dataset.loaded = '1';
    };

    var backdrop = document.getElementById('overlayBackdrop');
    if (backdrop) backdrop.addEventListener('click', window.closeAllCardsWrapper);
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') window.closeAllCardsWrapper(); });

    startQuotes();
    loadLatest();
    buildSections();
  });
  </script>
</body>
</html>
