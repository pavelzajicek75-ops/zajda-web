  <script>
    /* === Hvězdy === */
    (function makeStars() {
      const box = document.getElementById('stars');
      if (!box) return;
      for (let i = 0; i < 200; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.setProperty('--dur', (3 + Math.random() * 4) + 's');
        s.style.setProperty('--del', (Math.random() * 5) + 's');
        box.appendChild(s);
      }
    })();

    /* === Citáty === */
    async function loadQuotes() {
      try { const r = await fetch('/api/quotes/list'); if (!r.ok) return []; return await r.json(); }
      catch { return []; }
    }
    function spawnQuote(q) {
      const el = document.createElement('div');
      el.className = 'quote-star';
      const sz = 13 + Math.floor(Math.random() * 10);
      el.innerHTML = `<div style="font-size:${sz}px;line-height:1.4">"${q.text}"<br><span style="color:#ffcc66;font-size:${sz*0.6}px;opacity:0.8">${q.author||''}</span></div>`;
      const sx = Math.random() * window.innerWidth;
      const sy = Math.random() * window.innerHeight;
      el.style.left = sx + 'px'; el.style.top = sy + 'px';
      const ex = sx + (Math.random() - 0.5) * 400;
      const ey = sy + (Math.random() - 0.5) * 400;
      el.style.setProperty('--sx', '0px'); el.style.setProperty('--sy', '0px');
      el.style.setProperty('--ex', (ex-sx)+'px'); el.style.setProperty('--ey', (ey-sy)+'px');
      el.style.animation = `drift ${14 + Math.random()*10}s linear infinite`;
      document.body.appendChild(el);
      setTimeout(() => el.classList.add('visible'), 100);
      setTimeout(() => el.remove(), 25000);
    }
    async function startQuotes() {
      const quotes = await loadQuotes();
      if (!quotes.length) return;
      for (let i = 0; i < Math.min(8, quotes.length); i++) spawnQuote(quotes[Math.floor(Math.random()*quotes.length)]);
      setInterval(() => {
        if (document.querySelectorAll('.quote-star').length > 12) return;
        const q = quotes[Math.floor(Math.random()*quotes.length)];
        spawnQuote(q);
      }, 5000);
    }

    /* === Aktuality === */
    async function loadLatest() {
      const box = document.getElementById('latestPanel');
      try {
        const r = await fetch('/api/articles/list');
        if (!r.ok) throw new Error();
        const data = await r.json();
        const arr = Array.isArray(data) ? data : (data.articles || []);
        const latest = arr.slice(0, 3);
        if (!latest.length) {
          box.innerHTML = '<h3>Poslední aktuality</h3><div class="latest-empty">Zatím žádné články</div>';
          return;
        }
        box.innerHTML = '<h3>Poslední aktuality</h3>' + latest.map(a => `
          <a class="latest-item" href="/article/${a.slug||a.id}">
            ${escapeHtml(a.title)}
            <small>${a.section||''} ${a.subsection||''} • ${new Date(a.date||a.created).toLocaleDateString('cs')}</small>
          </a>
        `).join('');
        const shareText = `Nové aktuality na Moje diagnóza, můj vesmír! ${latest.map(a=>a.title).join(', ')} - ${window.location.origin}`;
        document.getElementById('shareWhatsApp').href = 'https://wa.me/?text=' + encodeURIComponent(shareText);
      } catch {
        box.innerHTML = '<h3>Poslední aktuality</h3><div class="latest-empty">Nepodařilo se načíst</div>';
      }
    }

    /* === Sekce === */
    const SECTIONS = [
      { id: 'travel', name: 'Cestování', nameEn: 'Travel' },
      { id: 'photo', name: 'Fotografování', nameEn: 'Photo' },
      { id: 'projects', name: 'Projekty', nameEn: 'Projects' },
      { id: 'about', name: 'O Zajdovi', nameEn: 'About' }
    ];

    async function loadSectionCover(sec) {
      try {
        const r = await fetch('/api/sections/cover?sectionId=' + sec.id);
        if (!r.ok) return '';
        const d = await r.json();
        return d.coverUrl || d.url || '';
      } catch { return ''; }
    }
    async function loadSubsections(secId) {
      try {
        const r = await fetch('/api/subsections/by-section?sectionId=' + secId);
        if (!r.ok) return [];
        return await r.json();
      } catch { return []; }
    }
    async function loadAllArticles() {
      /* Načte všechny články jednou a uloží do cache */
      try {
        const r = await fetch('/api/articles/list');
        if (!r.ok) return [];
        const data = await r.json();
        return Array.isArray(data) ? data : (data.articles || []);
      } catch { return []; }
    }

    let activeCard = null;
    function closeAllCards() {
      document.querySelectorAll('.section-card.expanded').forEach(c => c.classList.remove('expanded'));
      document.getElementById('overlayBackdrop').classList.remove('active');
      activeCard = null;
    }

    async function buildSections() {
      const container = document.getElementById('sectionsContainer');
      container.innerHTML = '';
      for (const sec of SECTIONS) {
        const cover = await loadSectionCover(sec);
        const card = document.createElement('div');
        card.className = 'section-card';
        card.dataset.sectionId = sec.id;
        card.innerHTML = `
          <div class="card-glow"></div>
          <div class="card-inner">
            <img src="${cover || '/images/placeholder.jpg'}" alt="${sec.name}" onerror="this.src='/images/placeholder.jpg'">
            <div class="card-label">${sec.name} / ${sec.nameEn}</div>
          </div>
          <div class="card-content" id="content-${sec.id}">
            <button class="close-btn" onclick="event.stopPropagation(); closeAllCards()">×</button>
            <h4>${sec.name}</h4>
            <div id="loading-${sec.id}" style="color:#64748b;font-size:13px">Načítání...</div>
          </div>
        `;
        card.addEventListener('click', async (e) => {
          if (e.target.closest('.close-btn') || e.target.closest('.card-content')) return;
          if (card.classList.contains('expanded')) { closeAllCards(); return; }
          closeAllCards(); card.classList.add('expanded'); document.getElementById('overlayBackdrop').classList.add('active'); activeCard = card;
          const contentEl = document.getElementById('content-' + sec.id);
          if (contentEl.dataset.loaded) return;
          const subs = await loadSubsections(sec.id);
          if (sec.id === 'about' || !subs.length) {
            const all = await loadAllArticles();
            const articles = all.filter(a => {
              const s = (a.sectionId || a.section || '').toString().toLowerCase();
              return s === sec.id.toLowerCase();
            });
            renderArticles(contentEl, articles, sec.name);
          } else {
            renderSubsections(contentEl, subs, sec.id);
          }
          contentEl.dataset.loaded = '1';
        });
        container.appendChild(card);
      }
    }

    function renderArticles(container, articles, fallbackTitle) {
      let html = `<button class="close-btn" onclick="event.stopPropagation(); closeAllCards()">×</button>`;
      html += `<h4>${escapeHtml(fallbackTitle)}</h4>`;
      if (!articles.length) {
        html += '<div class="no-articles">Zatím žádné články</div>';
      } else {
        html += '<div class="sub-articles" style="max-height:240px">';
        articles.forEach(a => {
          const excerpt = a.content ? a.content.replace(/<[^>]+>/g, '').substring(0, 80) + '...' : '';
          html += `<a href="/article/${a.slug||a.id}">
            <div style="font-weight:600;">${escapeHtml(a.title)}</div>
            ${excerpt ? `<span style="font-size:12px;color:#94a3b8;display:block;margin-top:2px">${escapeHtml(excerpt)}</span>` : ''}
          </a>`;
        });
        html += '</div>';
      }
      container.innerHTML = html;
    }

    function renderSubsections(container, subs, secId) {
      let html = `<button class="close-btn" onclick="event.stopPropagation(); closeAllCards()">×</button>`;
      html += `<h4>Podsekce</h4>`;
      if (!subs.length) { html += '<div class="no-articles">Žádné podsekce</div>'; container.innerHTML = html; return; }
      subs.forEach(sub => {
        html += `
          <div class="sub-block collapsed" id="subblock-${sub.id}">
            <div class="sub-title" onclick="toggleSub('${sub.id}', '${secId}')">${escapeHtml(sub.name)}</div>
            <div class="sub-articles" id="subarticles-${sub.id}">
              <div style="color:#64748b;font-size:12px;padding:6px 0">Klikni pro načtení článků</div>
            </div>
          </div>`;
      });
      container.innerHTML = html;
    }

    window.toggleSub = async function(subId, secId) {
      const block = document.getElementById('subblock-' + subId);
      const list = document.getElementById('subarticles-' + subId);
      if (!block || !list) return;

      const isCollapsed = block.classList.contains('collapsed');
      document.querySelectorAll('.sub-block').forEach(b => { if (b !== block) b.classList.add('collapsed'); });

      if (!isCollapsed) { block.classList.add('collapsed'); return; }
      block.classList.remove('collapsed');

      if (list.dataset.loaded) return;
      list.innerHTML = '<div style="color:#64748b;font-size:12px;padding:6px 0">Načítání...</div>';

      /* KLÍČOVÁ OPRAVA: Načteme všechny články a porovnáme podle VIACERÝCH polí */
      const all = await loadAllArticles();
      const subNameEl = block.querySelector('.sub-title');
      const subName = subNameEl ? subNameEl.textContent.trim() : '';

      const articles = all.filter(a => {
        const aSec = (a.sectionId || a.section || '').toString().toLowerCase();
        if (aSec !== secId.toLowerCase()) return false;

        const aSubId = (a.subsectionId || '').toString().toLowerCase();
        const aSubName = (a.subsection || '').toString().toLowerCase();
        const searchId = subId.toString().toLowerCase();
        const searchName = subName.toLowerCase();

        /* Hledáme shodu na cokoliv: ID podsekce NEBO název podsekce */
        return aSubId === searchId || aSubName === searchId ||
               aSubId === searchName || aSubName === searchName;
      });

      if (!articles.length) {
        list.innerHTML = '<div class="no-articles" style="padding:6px 0">Žádné články v této podsekci</div>';
      } else {
        list.innerHTML = articles.map(a => {
          const excerpt = a.content ? a.content.replace(/<[^>]+>/g, '').substring(0, 70) + '...' : '';
          return `<a href="/article/${a.slug||a.id}">
            <div style="font-weight:600;">${escapeHtml(a.title)}</div>
            ${excerpt ? `<span style="font-size:12px;color:#94a3b8;display:block;margin-top:2px">${escapeHtml(excerpt)}</span>` : ''}
          </a>`;
        }).join('');
      }
      list.dataset.loaded = '1';
    };

    function escapeHtml(t) {
      if (!t) return '';
      return String(t)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* Fotky sekcí — rozsvítí a zostří */
    (function fixSectionImages(){
      const s = document.createElement('style');
      s.textContent = `
        .section-card:hover:not(.expanded) .card-inner img { filter: brightness(1.25) contrast(1.15) saturate(1.1); }
        .section-card.expanded .card-inner img { filter: brightness(1.1) contrast(1.2) saturate(1.1); transform: scale(1.05); }
        .card-content { background: rgba(15,23,42,0.85); backdrop-filter: blur(6px); border-radius: 14px; }
        .sub-articles a { white-space: normal; overflow: visible; text-overflow: clip; padding: 7px 0 7px 12px; line-height: 1.4; }
      `;
      document.head.appendChild(s);
    })();

    document.getElementById('overlayBackdrop').addEventListener('click', closeAllCards);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllCards(); });

    window.addEventListener('DOMContentLoaded', () => {
      startQuotes();
      loadLatest();
      buildSections();
    });
  </script>
