<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Osobní blog Zajdy — zápisky z cest, fotky a příběhy ze života s diagnózou. Cestování, fotografování a projekty na jednom místě.">
  <link rel="canonical" href="https://zajda-web.pages.dev/">

  <!-- Open Graph (náhled při sdílení na Facebooku, WhatsAppu, Messengeru...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Moje diagnóza, můj vesmír">
  <meta property="og:title" content="Moje diagnóza, můj vesmír">
  <meta property="og:description" content="Osobní blog Zajdy — zápisky z cest, fotky a příběhy ze života s diagnózou.">
  <meta property="og:url" content="https://zajda-web.pages.dev/">
  <meta property="og:image" content="https://zajda-web.pages.dev/images/og-cover.jpg">
  <meta property="og:locale" content="cs_CZ">

  <!-- Twitter/X karta -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Moje diagnóza, můj vesmír">
  <meta name="twitter:description" content="Osobní blog Zajdy — zápisky z cest, fotky a příběhy ze života s diagnózou.">
  <meta name="twitter:image" content="https://zajda-web.pages.dev/images/og-cover.jpg">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="Moje diagnóza, můj vesmír" href="/rss.xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void: #08080f;
      --void-2: #0e0f1c;
      --panel: rgba(20, 21, 38, 0.55);
      --panel-border: rgba(140, 150, 255, 0.18);
      --panel-border-hover: rgba(255, 122, 69, 0.55);
      --aurora: #8f6bff;
      --aurora-dim: rgba(143, 107, 255, 0.4);
      --ember: #ff7a45;
      --ember-dim: rgba(255, 122, 69, 0.4);
      --nova: #2fe6c9;
      --nova-dim: rgba(47, 230, 201, 0.35);
      --parchment: #f8f5ef;
      --mist: #b3b6da;
      --mist-dim: #6a6d90;
      --hairline: linear-gradient(90deg, var(--aurora), var(--ember));
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--void);
      color: var(--parchment);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
      font-weight: 400;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 900px 600px at 50% 10%, rgba(255,122,69,0.16), transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(47,230,201,0.14), transparent 55%),
        radial-gradient(circle at 12% 75%, rgba(143,107,255,0.08), transparent 55%),
        linear-gradient(180deg, #06060c 0%, #0a0a16 45%, #08080f 100%);
    }

    .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .star {
      position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%;
      opacity: 0; animation: twinkle var(--dur) ease-in-out infinite; animation-delay: var(--del);
      box-shadow: 0 0 4px rgba(255,255,255,0.6);
    }
    .star:nth-of-type(7n) { background: var(--ember); box-shadow: 0 0 6px var(--ember-dim); width: 3px; height: 3px; }
    .star:nth-of-type(11n) { background: var(--nova); box-shadow: 0 0 6px var(--nova-dim); }
    .star:nth-of-type(17n) { background: var(--aurora); box-shadow: 0 0 6px var(--aurora-dim); }
    @keyframes twinkle { 0%,100% { opacity: 0.08; transform: scale(0.5); } 50% { opacity: 0.9; transform: scale(1); } }

    .title-block {
      position: relative; z-index: 10; text-align: center; padding-top: 64px;
      pointer-events: none;
    }
    .title-block::before {
      content: ''; position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
      width: 360px; height: 360px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,122,69,0.28), transparent 70%);
      filter: blur(10px); z-index: -1; pointer-events: none;
      animation: nebula-pulse 6s ease-in-out infinite;
    }
    @keyframes nebula-pulse {
      0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.12); }
    }
    .cz-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(30px, 5vw, 54px); font-weight: 700; letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--parchment) 0%, var(--ember) 40%, var(--nova) 70%, var(--aurora) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 0 50px rgba(255,122,69,0.35);
      animation: title-shimmer 8s ease-in-out infinite;
    }
    @keyframes title-shimmer {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 100% center; }
    }
    .en-title {
      font-family: 'Inter', sans-serif; font-size: clamp(13px, 2vw, 16px); font-weight: 500;
      color: var(--mist); margin-top: 10px; letter-spacing: 4px; text-transform: uppercase;
    }

    .latest-panel {
      position: absolute; top: 150px; left: 40px; z-index: 10; width: 320px; max-width: 90vw;
      background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border); border-radius: 16px; padding: 1.3rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }
    .latest-panel h3 {
      font-family: 'Space Grotesk', sans-serif; font-weight: 600;
      color: var(--parchment); font-size: 17px; margin-bottom: 0.9rem;
      display: flex; align-items: center; gap: 8px; letter-spacing: 0.2px;
    }
    .latest-panel h3::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 8px var(--ember-dim); }
    .latest-item {
      display: block; color: #dcdcec; text-decoration: none; padding: 0.7rem 0.5rem;
      border-bottom: 1px solid rgba(140,150,255,0.12); font-size: 14px;
      transition: all 0.25s ease; border-radius: 6px;
    }
    .latest-item:hover, .latest-item:focus-visible {
      color: var(--parchment); padding-left: 12px; background: rgba(140,150,255,0.08);
    }
    .latest-item:last-child { border-bottom: none; }
    .latest-item small { color: var(--mist-dim); font-size: 11.5px; display: block; margin-top: 3px; letter-spacing: 0.2px; }
    .latest-empty { color: var(--mist-dim); font-size: 13px; padding: 0.5rem 0; font-style: italic; }

    .intro-text {
      position: absolute; top: 210px; right: 60px; z-index: 10; width: 360px; max-width: 90vw;
      background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border); border-left: 3px solid var(--ember);
      border-radius: 16px; padding: 1.3rem 1.5rem;
      color: var(--mist); font-size: 15.5px; line-height: 1.7; text-align: left; font-weight: 300;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .intro-highlight {
      display: block; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px;
      letter-spacing: -0.3px; margin-bottom: 8px;
      background: linear-gradient(90deg, var(--ember), var(--nova));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .sections-container {
      position: relative; z-index: 10; display: flex; flex-wrap: wrap; justify-content: center;
      gap: 20px; padding: 320px 20px 110px; max-width: 1200px; margin: 0 auto;
      pointer-events: none;
    }
    .section-panel {
      flex: 1 1 180px; min-width: 160px; max-width: 280px;
      background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border); border-radius: 18px; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45); transition: border-color 0.35s, box-shadow 0.35s, transform 0.35s;
      display: flex; flex-direction: column; position: relative;
      pointer-events: auto;
    }
    .section-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 2;
      background: linear-gradient(90deg, var(--ember), var(--nova), var(--aurora)); opacity: 0.9;
    }
    .section-panel:hover {
      border-color: var(--panel-border-hover); transform: translateY(-4px);
      box-shadow: 0 26px 60px rgba(0,0,0,0.5), 0 0 34px rgba(255,122,69,0.2);
    }
    .panel-cover {
      width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block;
      border-bottom: 1px solid rgba(140,150,255,0.14); flex-shrink: 0;
      filter: saturate(0.95) brightness(0.94); transition: filter 0.4s;
    }
    .section-panel:hover .panel-cover { filter: saturate(1.25) brightness(1.08); }
    .panel-body { padding: 0.9rem 1.1rem 1.1rem; display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .panel-body h3 {
      font-family: 'Space Grotesk', sans-serif; font-weight: 600;
      color: var(--parchment); font-size: 16px; margin-bottom: 0.7rem;
      display: flex; align-items: center; gap: 7px;
      border-bottom: 1px solid rgba(140,150,255,0.14); padding-bottom: 0.6rem; flex-shrink: 0;
    }
    .panel-body h3::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--nova); box-shadow: 0 0 8px var(--nova-dim); }
    .panel-body h3 .en { font-family: 'Inter', sans-serif; color: var(--mist-dim); font-size: 10.5px; font-weight: 500; margin-left: auto; letter-spacing: 1.5px; text-transform: uppercase; }
    .panel-scroll {
      max-height: 260px; overflow-y: auto; scrollbar-width: thin;
      scrollbar-color: var(--nova) rgba(20,21,38,0.3); flex: 1;
    }
    .panel-scroll::-webkit-scrollbar { width: 5px; }
    .panel-scroll::-webkit-scrollbar-track { background: rgba(20,21,38,0.3); border-radius: 3px; }
    .panel-scroll::-webkit-scrollbar-thumb { background: var(--nova); border-radius: 3px; }
    .sub-block { margin-bottom: 4px; }
    .sub-title {
      color: var(--ember); font-size: 12.5px; font-weight: 600; padding: 8px 8px;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(140,150,255,0.1); transition: all 0.25s; border-radius: 5px;
      user-select: none; letter-spacing: 0.2px;
    }
    .sub-title:hover, .sub-title:focus-visible {
      color: var(--parchment); background: rgba(255,154,107,0.1); padding-left: 12px;
    }
    .sub-title::after { content: '▾'; font-size: 10px; color: var(--mist-dim); transition: transform 0.25s; }
    .sub-block.collapsed .sub-title::after { transform: rotate(-90deg); }
    .sub-articles { max-height: 200px; overflow: hidden; transition: max-height 0.4s ease, opacity 0.3s; opacity: 1; }
    .sub-block.collapsed .sub-articles { max-height: 0; opacity: 0; overflow: hidden; }
    .article-link {
      display: block; padding: 6px 8px 6px 14px; color: #d6d7e8; text-decoration: none;
      font-size: 12px; border-left: 2px solid rgba(140,150,255,0.25); transition: all 0.25s;
      white-space: normal; line-height: 1.4; margin: 2px 0; border-radius: 0 6px 6px 0; cursor: pointer;
    }
    .article-link:hover, .article-link:focus-visible {
      color: var(--parchment); border-left-color: var(--ember); padding-left: 18px;
      background: rgba(255,154,107,0.08);
    }
    .article-link .art-title { font-weight: 600; }
    .article-link .art-date { font-size: 10px; color: var(--mist); display: block; margin-top: 1px; }
    .article-link .art-excerpt { font-size: 10px; color: var(--mist-dim); display: block; margin-top: 1px; }
    .no-articles { color: var(--mist-dim); font-size: 12px; padding: 8px 0; font-style: italic; }
    .loading-text { color: var(--mist-dim); font-size: 12px; padding: 0.5rem 0; }

    /* === VYHLEDÁVÁNÍ === */
    .search-panel {
      position: relative; z-index: 10; max-width: 480px; margin: 24px auto 0; padding: 0 20px;
    }
    .search-panel input {
      width: 100%; padding: 0.85rem 1.2rem; border-radius: 30px;
      background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border); color: var(--parchment); font-size: 14.5px;
      font-family: 'Inter', sans-serif; outline: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: border-color 0.25s ease;
    }
    .search-panel input:focus { border-color: var(--panel-border-hover); }
    .search-panel input::placeholder { color: var(--mist-dim); }
    .search-results {
      margin-top: 8px; max-height: 340px; overflow-y: auto;
      background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border); border-radius: 14px; display: none;
    }
    .search-results.open { display: block; }
    .search-results .article-link { border-left: none; padding: 10px 16px; margin: 0; border-radius: 0; border-bottom: 1px solid rgba(140,150,255,0.08); }
    .search-results .article-link:last-child { border-bottom: none; }
    .search-no-results { padding: 14px 18px; color: var(--mist-dim); font-size: 13px; font-style: italic; }

    /* === "ZOBRAZIT VŠE" — modal na procházení celé sekce === */
    .show-all-link {
      display: block; text-align: center; margin-top: 10px; padding: 8px;
      color: var(--nova); font-size: 12px; font-weight: 600; cursor: pointer;
      border-top: 1px solid rgba(140,150,255,0.12); letter-spacing: 0.3px;
      transition: color 0.2s ease, background 0.2s ease; border-radius: 6px;
    }
    .show-all-link:hover, .show-all-link:focus-visible { color: #fff; background: rgba(47,230,201,0.08); }

    .section-modal-overlay {
      position: fixed; inset: 0; z-index: 8000; background: rgba(4,4,10,0.85);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .section-modal-overlay.open { display: flex; }
    .section-modal-box {
      width: 100%; max-width: 640px; max-height: 82vh;
      background: var(--void-2); border: 1px solid var(--panel-border);
      border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .section-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 1.4rem; border-bottom: 1px solid rgba(140,150,255,0.14); flex-shrink: 0;
    }
    .section-modal-header h2 {
      font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600; color: var(--parchment);
    }
    .section-modal-close {
      background: rgba(140,150,255,0.1); border: 1px solid var(--panel-border); color: var(--parchment);
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
    }
    .section-modal-close:hover { border-color: var(--panel-border-hover); background: rgba(255,122,69,0.12); }
    /* Scrollbar VPRAVO je tu záměrně vždycky vidět (ne jen při najetí myší),
       ať je na první pohled jasné, že je čím se posouvat dál ke starším
       záznamům — přesně to uživatel chtěl. */
    .section-modal-scroll {
      flex: 1; overflow-y: scroll; padding: 1rem 0.5rem 1.4rem 1.4rem;
      scrollbar-width: auto; scrollbar-color: var(--nova) rgba(20,21,38,0.4);
    }
    .section-modal-scroll::-webkit-scrollbar { width: 10px; }
    .section-modal-scroll::-webkit-scrollbar-track { background: rgba(20,21,38,0.4); border-radius: 5px; }
    .section-modal-scroll::-webkit-scrollbar-thumb { background: var(--nova); border-radius: 5px; }
    .section-modal-scroll .sub-block { margin-bottom: 0.6rem; }
    .section-modal-scroll .sub-title { font-size: 13.5px; padding: 10px 12px; }
    .section-modal-scroll .article-link { font-size: 13px; padding: 8px 10px 8px 16px; }

    @media (prefers-reduced-motion: reduce) {
      .section-panel, .latest-item, .article-link { transition: none !important; }
      .title-block::before, .cz-title { animation: none !important; }
    }

    @media (max-width: 900px) {
      .latest-panel { position: relative; top: auto; left: auto; margin: 20px auto; width: 90%; }
      .intro-text { position: relative; top: auto; right: auto; margin: 20px auto; width: 90%; text-align: center; }
      .sections-container { padding: 40px 20px 100px; flex-direction: column; align-items: center; }
      .section-panel { width: 90%; max-width: 400px; flex: none; }
      .panel-scroll { max-height: 300px; }
      .search-panel { max-width: none; }
      .section-modal-box { max-height: 88vh; }
    }
  </style>
</head>
<body>
  <a href="#sectionsContainer" class="skip-link">Přeskočit na obsah</a>
  <div class="bg"></div>
  <div class="stars" id="stars"></div>
  <svg class="constellation-layer" id="constellationLayer"></svg>
  <div class="lightbox-overlay" id="lightboxOverlay" onclick="this.classList.remove('open')"></div>
  <div class="title-block">
    <div class="cz-title">Moje diagnóza, můj vesmír</div>
    <div class="en-title">My diagnosis, my universe</div>
  </div>
  <div class="latest-panel" id="latestPanel">
    <h3>Poslední aktuality</h3>
    <div class="loading-text">Načítání...</div>
  </div>
  <div class="intro-text"><span class="intro-highlight">Jsem Zajda.</span> Trochu cvok a občasný zapisovatel vlastního života. Tohle je místo, kam si odkládám vzpomínky z cest, příběhy z míst, kde byl občas pořádný rachot...</div>
  <div class="search-panel">
    <input type="text" id="siteSearchInput" placeholder="🔍 Hledat v článcích…" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
    <div style="text-align:center;margin-top:12px" id="savedLinkWrap"></div>
  </div>
  <div class="sections-container" id="sectionsContainer" tabindex="-1"></div>

  <div class="section-modal-overlay" id="sectionModalOverlay">
    <div class="section-modal-box">
      <div class="section-modal-header">
        <h2 id="sectionModalTitle"></h2>
        <button class="section-modal-close" id="sectionModalClose" aria-label="Zavřít">✕</button>
      </div>
      <div class="section-modal-scroll" id="sectionModalScroll"></div>
    </div>
  </div>
  <script src="/shared.js"></script>
  <script>
  function openLightbox(src) {
    var overlay = document.getElementById('lightboxOverlay');
    if (!overlay) return;
    overlay.innerHTML = '<img src="' + src + '" alt="">';
    overlay.classList.add('open');
  }

  // Escape zavře lightbox — dřív šlo jen kliknout mimo obrázek.
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Escape') return;
    var overlay = document.getElementById('lightboxOverlay');
    if (overlay && overlay.classList.contains('open')) overlay.classList.remove('open');
  });

  document.addEventListener('DOMContentLoaded', function() {
    initStarfield(200);

    var cachedArticles = null;
    async function getAllArticles() {
      if (cachedArticles) return cachedArticles;
      try {
        var r = await fetch('/api/articles/list');
        if (!r.ok) return [];
        var data = await r.json();
        var arr = Array.isArray(data) ? data : [];
        /* Bezpečnostní pojistka NAVÍC (nezávisle na tom, jestli API sama
           filtruje) — veřejný web nikdy nemá ukázat skryté/nepublikované
           koncepty, ani kdyby se z nějakého důvodu objevily v odpovědi
           /api/articles/list. Jen a.published === false znamená skrytý;
           chybějící pole (starší články bez příznaku) se bere jako
           publikováno, ať se nic staršího neschová omylem. */
        cachedArticles = arr.filter(function(a) { return a && a.published !== false; });
        return cachedArticles;
      } catch(e) { return []; }
    }

    async function loadLatest() {
      var box = document.getElementById('latestPanel');
      if (!box) return;
      var articles = await getAllArticles();
      var sorted = articles.slice().sort(function(a, b) {
        var da = a.date || a.created || '';
        var db = b.date || b.created || '';
        if (da < db) return 1;
        if (da > db) return -1;
        return 0;
      });
      var latest = sorted.slice(0, 3);
      if (!latest.length) {
        box.innerHTML = '<h3>Poslední aktuality</h3><div class="latest-empty">Zatím žádné články</div>';
        return;
      }
      var html = '<h3>Poslední aktuality</h3>';
      for (var i = 0; i < latest.length; i++) {
        var a = latest[i];
        var artId = a.id || '';
        var title = a.title || 'Bez názvu';
        var date = a.date || a.created || '';
        var dateStr = formatDate(date);
        var breadcrumb = await getArticleBreadcrumb(a);
        var meta = [breadcrumb, dateStr].filter(Boolean).join(' • ');
        html += '<a class="latest-item" href="/article?id=' + encodeURIComponent(artId) + '">' + escapeHtml(title) + '<small>' + escapeHtml(meta) + '</small></a>';
      }
      box.innerHTML = html;
    }

    var SECTIONS = [
      { id: 'travel', name: 'Cestování', nameEn: 'Travel' },
      { id: 'photo', name: 'Fotografování', nameEn: 'Photo' },
      { id: 'projects', name: 'Projekty', nameEn: 'Projects' },
      { id: 'about', name: 'O Zajdovi', nameEn: 'About' }
    ];

    function getSectionName(id) {
      for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === id) return SECTIONS[i].name;
      return id || '';
    }

    /* Mapa sectionId:subsectionId -> název podsekce, natažená jednou a
       znovupoužitá — kvůli přehlednosti (aby bylo vidět, kam článek patří,
       hlavně ve vyhledávání a v "Poslední aktuality", kde se mísí sekce). */
    var subsectionNameCache = null;
    async function getSubsectionNameMap() {
      if (subsectionNameCache) return subsectionNameCache;
      subsectionNameCache = {};
      for (var i = 0; i < SECTIONS.length; i++) {
        var sec = SECTIONS[i];
        var subs = await loadSubsections(sec.id);
        subs.forEach(function(sub) {
          subsectionNameCache[sec.id + ':' + (sub.id || '')] = sub.name || '';
        });
      }
      return subsectionNameCache;
    }

    async function getArticleBreadcrumb(a) {
      var secName = getSectionName(a.sectionId);
      if (!secName) return '';
      if (!a.subsectionId) return secName;
      var map = await getSubsectionNameMap();
      var subName = map[a.sectionId + ':' + a.subsectionId] || '';
      return subName ? secName + ' › ' + subName : secName;
    }

    async function loadSectionCover(secId) {
      try {
        var r = await fetch('/api/sections/cover?sectionId=' + secId);
        if (!r.ok) return '';
        var d = await r.json();
        return d.url || '';
      } catch(e) { return ''; }
    }

    async function loadSubsections(secId) {
      try {
        var r = await fetch('/api/subsections/by-section?sectionId=' + secId);
        if (!r.ok) return [];
        return await r.json();
      } catch(e) { return []; }
    }

    function renderArticleList(articles) {
      if (!articles.length) return '<div class="no-articles">Žádné články</div>';
      var sorted = articles.slice().sort(function(a, b) {
        var da = a.date || a.created || '';
        var db = b.date || b.created || '';
        if (da < db) return 1;
        if (da > db) return -1;
        return 0;
      });
      var html = '';
      for (var i = 0; i < sorted.length; i++) {
        var a = sorted[i];
        var artId = a.id || '';
        var title = a.title || 'Bez názvu';
        var date = a.date || a.created || '';
        var dateStr = formatDate(date);
        var excerpt = a.excerpt
          ? a.excerpt
          : (a.content ? a.content.replace(/<[^>]+>/g, '').substring(0, 60) + '...' : '');
        html += '<a class="article-link" href="/article?id=' + encodeURIComponent(artId) + '">' +
          '<span class="art-title">' + escapeHtml(title) + '</span>' +
          (dateStr ? '<span class="art-date">' + escapeHtml(dateStr) + '</span>' : '') +
          (excerpt ? '<span class="art-excerpt">' + escapeHtml(excerpt) + '</span>' : '') +
          '</a>';
      }
      return html;
    }

    /* === MODAL "ZOBRAZIT VŠE" — všechny články dané sekce, podsekce
       seřazené a uvnitř nich články od nejnovějšího, s viditelným
       scrollbarem vpravo, aby šlo snadno doscrollovat i ke starým
       záznamům (na rozdíl od malého okénka v kartě sekce). */
    async function openSectionModal(sectionId, sectionName) {
      var overlay = document.getElementById('sectionModalOverlay');
      var titleEl = document.getElementById('sectionModalTitle');
      var scrollEl = document.getElementById('sectionModalScroll');
      if (!overlay || !titleEl || !scrollEl) return;

      titleEl.textContent = sectionName;
      scrollEl.innerHTML = '<div class="loading-text">Načítání...</div>';
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';

      var allArticles = await getAllArticles();
      var subs = await loadSubsections(sectionId);
      var html = '';

      if (!subs.length) {
        var articles = allArticles.filter(function(a) {
          var secId = a.sectionId;
          if (secId == null) return false;
          return String(secId) === sectionId;
        });
        html = renderArticleList(articles);
      } else {
        for (var i = 0; i < subs.length; i++) {
          var sub = subs[i];
          var subId = sub.id || '';
          var subName = sub.name || '';
          var subArticles = allArticles.filter(function(a) {
            var aSec = a.sectionId;
            var aSub = a.subsectionId;
            if (aSec == null || aSub == null) return false;
            return String(aSec) === String(sectionId) && String(aSub) === String(subId);
          });
          if (!subArticles.length) continue;
          html += '<div class="sub-block">' +
            '<div class="sub-title">' + escapeHtml(subName) + ' (' + subArticles.length + ')</div>' +
            '<div class="sub-articles">' + renderArticleList(subArticles) + '</div>' +
            '</div>';
        }
        if (!html) html = '<div class="no-articles">Žádné články</div>';
      }

      scrollEl.innerHTML = html;
      scrollEl.querySelectorAll('.sub-title').forEach(function(titleEl2) {
        titleEl2.addEventListener('click', function() {
          var block = this.parentElement;
          if (block) block.classList.toggle('collapsed');
        });
      });
    }

    function closeSectionModal() {
      var overlay = document.getElementById('sectionModalOverlay');
      if (overlay) overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    function initSectionModal() {
      var overlay = document.getElementById('sectionModalOverlay');
      var closeBtn = document.getElementById('sectionModalClose');
      if (closeBtn) closeBtn.addEventListener('click', closeSectionModal);
      if (overlay) overlay.addEventListener('click', function(e) { if (e.target === overlay) closeSectionModal(); });
      document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeSectionModal(); });
    }

    /* === PANEL "ULOŽENÉ NA POZDĚJI" ===
       Znovu používá stejný section-modal, co slouží pro "Zobrazit vše"
       u sekcí — jen s jiným obsahem (seznam z localStorage, ne fetch). */
    function renderSavedList() {
      var saved = getSavedArticles();
      if (!saved.length) return '<div class="no-articles">Zatím nic uloženého. Otevři článek a klikni na „☆ Uložit na později".</div>';
      return saved.map(function(s) {
        var d = formatDate(s.date);
        return '<a class="article-link" href="' + s.url + '" style="display:flex;align-items:center;gap:8px">' +
          '<span style="flex:1;min-width:0"><span class="art-title">' + escapeHtml(s.title) + '</span>' +
          (d ? '<span class="art-date">' + escapeHtml(d) + '</span>' : '') + '</span>' +
          '<button type="button" class="remove-saved-btn" title="Odebrat z uložených" onclick="event.preventDefault();event.stopPropagation();removeSavedFromModal(\'' + escapeHtml(String(s.id)) + '\')">✕</button>' +
          '</a>';
      }).join('');
    }

    function updateSavedLinkLabel() {
      var el = document.getElementById('savedLinkWrap');
      if (!el) return;
      var n = getSavedArticles().length;
      el.innerHTML = '<span class="saved-link" role="button" tabindex="0">🔖 Uložené' + (n ? ' (' + n + ')' : '') + '</span>';
      var link = el.querySelector('.saved-link');
      if (link) {
        link.addEventListener('click', openSavedModal);
        link.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSavedModal(); } });
      }
    }

    function openSavedModal() {
      var overlay = document.getElementById('sectionModalOverlay');
      var titleEl = document.getElementById('sectionModalTitle');
      var scrollEl = document.getElementById('sectionModalScroll');
      if (!overlay || !titleEl || !scrollEl) return;
      titleEl.textContent = '🔖 Uložené na později';
      scrollEl.innerHTML = renderSavedList();
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    // Volané z tlačítka ✕ v modalu — smaže položku a rovnou překreslí
    // otevřený seznam i číslo v odkazu, ať se to nemusí zavírat/otevírat.
    window.removeSavedFromModal = function(id) {
      removeSavedArticle(id);
      openSavedModal();
      updateSavedLinkLabel();
    };

    /* === VYHLEDÁVÁNÍ NAPŘÍČ VŠEMI ČLÁNKY === */
    function initSiteSearch() {
      var input = document.getElementById('siteSearchInput');
      var results = document.getElementById('searchResults');
      if (!input || !results) return;
      var debounceTimer = null;

      input.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(runSearch, 220);
      });
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-panel')) results.classList.remove('open');
      });

      async function runSearch() {
        var q = input.value.trim().toLowerCase();
        if (!q) { results.classList.remove('open'); results.innerHTML = ''; return; }
        var articles = await getAllArticles();
        var matches = articles.filter(function(a) {
          var title = (a.title || '').toLowerCase();
          var text = (a.content || '').replace(/<[^>]+>/g, '').toLowerCase();
          return title.indexOf(q) !== -1 || text.indexOf(q) !== -1;
        }).sort(function(a, b) {
          var da = a.date || a.created || '', db = b.date || b.created || '';
          return da < db ? 1 : da > db ? -1 : 0;
        }).slice(0, 8);

        if (!matches.length) {
          results.innerHTML = '<div class="search-no-results">Nic jsem nenašel pro „' + escapeHtml(input.value.trim()) + '“</div>';
        } else {
          var rendered = await Promise.all(matches.map(async function(a) {
            var artId = a.id || '';
            var title = a.title || 'Bez názvu';
            var dateStr = formatDate(a.date || a.created || '');
            var breadcrumb = await getArticleBreadcrumb(a);
            var meta = [breadcrumb, dateStr].filter(Boolean).join(' • ');
            return '<a class="article-link" href="/article?id=' + encodeURIComponent(artId) + '">' +
              '<span class="art-title">' + escapeHtml(title) + '</span>' +
              (meta ? '<span class="art-date">' + escapeHtml(meta) + '</span>' : '') +
              '</a>';
          }));
          results.innerHTML = rendered.join('');
        }
        results.classList.add('open');
      }
    }

    async function buildSections() {
      var container = document.getElementById('sectionsContainer');
      if (!container) return;
      container.innerHTML = '';
      var allArticles = await getAllArticles();
      for (var s = 0; s < SECTIONS.length; s++) {
        (function(sec) {
          var panel = document.createElement('div');
          panel.className = 'section-panel';

          if (sec.id === 'about') {
            panel.style.cursor = 'pointer';
            panel.addEventListener('click', function() {
              window.location.href = '/about/';
            });

            var img = document.createElement('img');
            img.className = 'panel-cover';
            img.alt = sec.name;
            img.src = '/images/placeholder.jpg';
            img.onerror = function() { this.src = '/images/placeholder.jpg'; };
            loadSectionCover(sec.id).then(function(url) {
              if (url) img.src = url;
            });

            var body = document.createElement('div');
            body.className = 'panel-body';
            body.innerHTML = '<h3>' + escapeHtml(sec.name) + '<span class="en">' + escapeHtml(sec.nameEn) + '</span></h3>';

            var scroll = document.createElement('div');
            scroll.className = 'panel-scroll';
            scroll.innerHTML = '<div style="color:#cbd5e1;font-size:13px;line-height:1.6;padding:8px 0">Jsem Zajda. Trochu cvok a občasný zapisovatel vlastního života...</div>' +
              '<div style="text-align:center;margin-top:1rem"><span style="color:#ff6600;font-size:13px;font-weight:600;text-shadow:0 0 12px rgba(255,102,0,0.4)">Číst více →</span></div>';

            body.appendChild(scroll);
            panel.appendChild(img);
            panel.appendChild(body);
            container.appendChild(panel);
            return;
          }

          var img = document.createElement('img');
          img.className = 'panel-cover';
          img.alt = sec.name;
          img.src = '/images/placeholder.jpg';
          img.onerror = function() { this.src = '/images/placeholder.jpg'; };
          loadSectionCover(sec.id).then(function(url) {
            if (url) img.src = url;
          });

          var body = document.createElement('div');
          body.className = 'panel-body';
          body.innerHTML = '<h3>' + escapeHtml(sec.name) + '<span class="en">' + escapeHtml(sec.nameEn) + '</span></h3>';

          var scroll = document.createElement('div');
          scroll.className = 'panel-scroll';
          scroll.innerHTML = '<div class="loading-text">Načítání...</div>';

          body.appendChild(scroll);
          panel.appendChild(img);
          panel.appendChild(body);
          container.appendChild(panel);

          (async function() {
            var subs = await loadSubsections(sec.id);
            var html = '';
            var totalCount = 0;

            if (!subs.length) {
              var articles = allArticles.filter(function(a) {
                var secId = a.sectionId;
                if (secId == null) return false;
                return String(secId) === sec.id;
              });
              totalCount = articles.length;
              html += renderArticleList(articles);
            } else {
              for (var i = 0; i < subs.length; i++) {
                var sub = subs[i];
                var subId = sub.id || '';
                var subName = sub.name || '';
                var subArticles = allArticles.filter(function(a) {
                  var aSec = a.sectionId;
                  var aSub = a.subsectionId;
                  if (aSec == null || aSub == null) return false;
                  return String(aSec) === String(sec.id) && String(aSub) === String(subId);
                });
                totalCount += subArticles.length;
                html += '<div class="sub-block">' +
                  '<div class="sub-title">' + escapeHtml(subName) + '</div>' +
                  '<div class="sub-articles">' + renderArticleList(subArticles) + '</div>' +
                  '</div>';
              }
            }

            if (totalCount > 0) {
              html += '<div class="show-all-link" tabindex="0" role="button" data-section-id="' + escapeHtml(sec.id) + '" data-section-name="' + escapeHtml(sec.name) + '">Zobrazit vše (' + totalCount + ') →</div>';
            }

            scroll.innerHTML = html;

            scroll.querySelectorAll('.sub-title').forEach(function(titleEl) {
              titleEl.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                var block = this.parentElement;
                if (block) block.classList.toggle('collapsed');
              });
            });

            var showAllEl = scroll.querySelector('.show-all-link');
            if (showAllEl) {
              var openThisModal = function(e) {
                e.stopPropagation();
                e.preventDefault();
                openSectionModal(sec.id, sec.name);
              };
              showAllEl.addEventListener('click', openThisModal);
              showAllEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') openThisModal(e);
              });
            }
          })();
        })(SECTIONS[s]);
      }
    }

    startQuotes();
    loadLatest();
    buildSections();
    initSiteSearch();
    initSectionModal();
    updateSavedLinkLabel();
  });
  </script>
</body>
</html>
