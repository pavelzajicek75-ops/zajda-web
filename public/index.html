<title>Moje diagnóza, můj vesmír</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">

/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Exo 2', sans-serif;
  background: #0a0a12;
  color: #e0e0e0;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

a { color: #ff6600; text-decoration: none; }
a:hover { color: #ffcc66; }

/* ===== STARS BACKGROUND ===== */
#stars-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ===== FLOATING QUOTES ===== */
.floating-quote {
  position: fixed;
  z-index: 1;
  pointer-events: none;
  font-size: 0.85rem;
  color: rgba(255, 204, 102, 0.15);
  font-style: italic;
  max-width: 260px;
  line-height: 1.4;
  animation: quoteDrift 40s linear infinite;
  white-space: nowrap;
}

@keyframes quoteDrift {
  0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.15; }
  90%  { opacity: 0.15; }
  100% { transform: translateY(-120vh) rotate(3deg); opacity: 0; }
}

/* ===== LAYOUT ===== */
.app-wrapper {
  position: relative;
  z-index: 2;
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px 24px 40px;
}

/* ===== HEADER ===== */
.site-header {
  text-align: center;
  padding: 40px 20px 30px;
  margin-bottom: 32px;
}

.site-header h1 {
  font-size: 2.6rem;
  font-weight: 700;
  background: linear-gradient(135deg, #ff6600, #ffcc66);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px;
  text-shadow: 0 0 40px rgba(255, 102, 0, 0.3);
}

.site-header p {
  font-size: 1.05rem;
  color: #999;
  margin-top: 8px;
  font-weight: 300;
}

/* ===== GLASS PANELS ===== */
.glass {
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 18px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}

/* ===== TOP ROW ===== */
.top-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 32px;
}

@media (max-width: 860px) {
  .top-row { grid-template-columns: 1fr; }
}

/* ===== LATEST NEWS PANEL ===== */
.latest-panel {
  padding: 24px;
}

.latest-panel h2 {
  font-size: 1.3rem;
  color: #ffcc66;
  margin-bottom: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

.latest-panel h2::before {
  content: "✦";
  color: #ff6600;
  font-size: 1.1rem;
}

.latest-item {
  padding: 12px 14px;
  margin-bottom: 6px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  border-left: 3px solid transparent;
}

.latest-item:hover {
  background: rgba(255, 102, 0, 0.10);
  border-left-color: #ff6600;
  text-shadow: 0 0 12px rgba(255, 102, 0, 0.4);
}

.latest-item-title {
  font-weight: 600;
  font-size: 0.98rem;
  color: #f0f0f0;
}

.latest-item-date {
  font-size: 0.75rem;
  color: #888;
  margin-top: 2px;
}

.latest-expanded {
  display: none;
  margin-top: 10px;
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 10px;
  border: 1px solid rgba(255, 102, 0, 0.15);
  font-size: 0.92rem;
  line-height: 1.65;
  color: #ccc;
}

.latest-expanded.open { display: block; }

.latest-expanded .content img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  margin: 10px 0;
}

.latest-expanded .content p {
  margin-bottom: 10px;
}

/* ===== WHATSAPP SHARE ===== */
.whatsapp-share {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 8px 18px;
  background: #25D366;
  color: #fff;
  border: none;
  border-radius: 30px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: 'Exo 2', sans-serif;
}

.whatsapp-share:hover {
  background: #1da851;
  transform: scale(1.04);
}

/* ===== RIGHT SIDE ===== */
.right-panel {
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  min-height: 180px;
}

.right-panel h2 {
  font-size: 1.2rem;
  color: #ffcc66;
  font-weight: 400;
}

.right-panel .subtitle {
  color: #777;
  font-size: 0.9rem;
  margin-top: 6px;
}

/* ===== SECTIONS GRID ===== */
.sections-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-top: 8px;
}

@media (max-width: 1100px) {
  .sections-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
  .sections-grid { grid-template-columns: 1fr; }
}

/* ===== SECTION CARD ===== */
.section-card {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  min-height: 200px;
}

.section-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 48px rgba(255, 102, 0, 0.15);
}

.section-card-cover {
  width: 100%;
  height: 180px;
  object-fit: cover;
  display: block;
  transition: all 0.35s ease;
}

.section-card:hover .section-card-cover {
  filter: brightness(1.25);
}

.section-card-title {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 14px 18px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  font-size: 1.1rem;
  font-weight: 600;
  color: #fff;
  pointer-events: none;
}

.section-card-title .en {
  font-weight: 300;
  font-size: 0.8rem;
  color: #ffcc66;
  display: block;
  margin-top: 2px;
}

/* ===== EXPANDED SECTION ===== */
.section-expanded {
  display: none;
  grid-column: 1 / -1;
  padding: 24px 28px;
  margin-top: -8px;
  margin-bottom: 8px;
  animation: fadeSlideIn 0.4s ease;
}

.section-expanded.open { display: block; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(-12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.section-expanded h3 {
  font-size: 1.2rem;
  color: #ffcc66;
  margin-bottom: 16px;
  font-weight: 600;
}

/* ===== SUBSECTION ===== */
.subsection-item {
  padding: 12px 16px;
  margin-bottom: 6px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  border-left: 3px solid transparent;
  background: rgba(255, 255, 255, 0.02);
}

.subsection-item:hover {
  background: rgba(255, 102, 0, 0.08);
  border-left-color: #ff6600;
  text-shadow: 0 0 10px rgba(255, 102, 0, 0.3);
}

.subsection-name {
  font-weight: 600;
  font-size: 0.95rem;
  color: #e8e8e8;
}

/* ===== SUB-ARTICLES LIST ===== */
.sub-articles-expanded {
  display: none;
  margin-top: 8px;
  padding-left: 12px;
}

.sub-articles-expanded.open { display: block; }

.sub-article-item {
  padding: 10px 14px;
  margin-bottom: 4px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 0.9rem;
  color: #bbb;
}

.sub-article-item:hover {
  background: rgba(255, 102, 0, 0.07);
  color: #fff;
  text-shadow: 0 0 10px rgba(255, 102, 0, 0.3);
}

.sub-article-content {
  display: none;
  margin-top: 8px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.02);
  border-radius: 8px;
  border: 1px solid rgba(255, 102, 0, 0.10);
  font-size: 0.88rem;
  line-height: 1.6;
  color: #ccc;
}

.sub-article-content.open { display: block; }

.sub-article-content .content img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  margin: 8px 0;
}

.sub-article-content .content p {
  margin-bottom: 8px;
}

/* ===== LOADING & ERROR ===== */
.loading-dots::after {
  content: "";
  animation: dots 1.2s steps(4, end) infinite;
}

@keyframes dots {
  0%   { content: ""; }
  25%  { content: "."; }
  50%  { content: ".."; }
  75%  { content: "..."; }
}

.loading-text {
  color: #888;
  font-size: 0.9rem;
  font-style: italic;
}

.error-text {
  color: #ff4444;
  font-size: 0.9rem;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0a0a12; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #555; }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .app-wrapper { padding: 12px 14px 30px; }
  .site-header h1 { font-size: 1.8rem; }
  .site-header { padding: 24px 12px 20px; }
  .latest-panel { padding: 16px; }
  .section-expanded { padding: 16px; }
}
</style>

<canvas id="stars-canvas"></canvas>

<div class="app-wrapper">

  </header>

  <div class="top-row">

    <!-- LATEST NEWS PANEL -->
    <div class="glass latest-panel" id="latest-panel">

        <div class="loading-text loading-dots">Načítám</div>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>

      </button>
    </div>

    </div>

  </div>

  <!-- ===== SECTIONS GRID ===== -->
  <div class="sections-grid" id="sections-grid">

    <!-- Cestování -->
    <div class="section-card" data-section-id="travel">
      <img class="section-card-cover" src="" alt="Cestování" loading="lazy">
      <div class="section-card-title">
        Cestování
        <span class="en">travel</span>
      </div>
    </div>

        Fotografování

      </div>
    </div>

    <!-- Projekty -->
    <div class="section-card" data-section-id="projects">

        Projekty
        <span class="en">projects</span>
      </div>
    </div>

    <!-- O Zajdova -->

        O Zajdova
        <span class="en">about</span>
      </div>
    </div>

    <!-- Expanded section containers (inserted dynamically) -->
  </div>

</div>
