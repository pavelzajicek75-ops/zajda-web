<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void: #08080f;
      --void-2: #0e0f1c;
      --panel: rgba(20, 21, 38, 0.55);
      --panel-border: rgba(140, 150, 255, 0.18);
      --panel-border-hover: rgba(255, 122, 69, 0.55);
      --aurora: #8f6bff;
      --aurora-dim: rgba(143, 107, 255, 0.4);
      --ember: #ff7a45;
      --ember-dim: rgba(255, 122, 69, 0.4);
      --nova: #2fe6c9;
      --nova-dim: rgba(47, 230, 201, 0.35);
      --parchment: #f8f5ef;
      --mist: #b3b6da;
      --mist-dim: #6a6d90;
      --hairline: linear-gradient(90deg, var(--aurora), var(--ember));
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--void);
      color: var(--parchment);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
      font-weight: 400;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 900px 600px at 50% 10%, rgba(255,122,69,0.16), transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(47,230,201,0.14), transparent 55%),
        radial-gradient(circle at 12% 75%, rgba(143,107,255,0.08), transparent 55%),
        linear-gradient(180deg, #06060c 0%, #0a0a16 45%, #08080f 100%);
    }

    .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .star {
      position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%;
      opacity: 0; animation: twinkle var(--dur) ease-in-out infinite; animation-delay: var(--del);
      box-shadow: 0 0 4px rgba(255,255,255,0.6);
    }
    .star:nth-of-type(7n) { background: var(--ember); box-shadow: 0 0 6px var(--ember-dim); width: 3px; height: 3px; }
    .star:nth-of-type(11n) { background: var(--nova); box-shadow: 0 0 6px var(--nova-dim); }
    .star:nth-of-type(17n) { background: var(--aurora); box-shadow: 0 0 6px var(--aurora-dim); }
    @keyframes twinkle { 0%,100% { opacity: 0.08; transform: scale(0.5); } 50% { opacity: 0.9; transform: scale(1); } }

    .title-block {
      position: relative; z-index: 10; text-align: center; padding-top: 64px;
      pointer-events: none;
    }
    .title-block::before {
      content: ''; position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
      width: 360px; height: 360px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,122,69,0.28), transparent 70%);
      filter: blur(10px); z-index: -1; pointer-events: none;
      animation: nebula-pulse 6s ease-in-out infinite;
    }
    @keyframes nebula-pulse {
      0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.12); }
    }
    .cz-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(30px, 5vw, 54px); font-weight: 700; letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--parchment) 0%, var(--ember) 40%, var(--nova) 70%, var(--aurora) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 0 50px rgba(255,122,69,0.35);
      animation: title-shimmer 8s ease-in-out infinite;
    }
    @keyframes title-shimmer {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 100% center; }
    }
    .en-title {
      font-family: 'Inter', sans-serif; font-size: clamp(13px, 2vw, 16px); font-weight: 500;
      color: var(--mist); margin-top: 10px; letter-spacing: 4px; text-transform: uppercase;
    }

    .latest-panel {
      position: absolute; top: 150px; left: 40px; z-index: 10; width: 320px; max-width: 90vw;
      background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border); border-radius: 16px; padding: 1.3rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }
    .latest-panel h3 {
      font-family: 'Space Grotesk', sans-serif; font-weight: 600;
      color: var(--parchment); font-size: 17px; margin-bottom: 0.9rem;
      display: flex; align-items: center; gap: 8px; letter-spacing: 0.2px;
    }
    .latest-panel h3::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 8px var(--ember-dim); }
    .latest-item {
      display: block; color: #dcdcec; text-decoration: none; padding: 0.7rem 0.5rem;
      border-bottom: 1px solid rgba(140,150,255,0.12); font-size: 14px;
      transition: all 0.25s ease; border-radius: 6px;
    }
    .latest-item:hover, .latest-item:focus-visible {
      color: var(--parchment); padding-left: 12px; background: rgba(140,150,255,0.08);
    }
    .latest-item:last-child { border-bottom: none; }
    .latest-item small { color: var(--mist-dim); font-size: 11.5px; display: block; margin-top: 3px; letter-spacing: 0.2px; }
    .latest-empty { color: var(--mist-dim); font-size: 13px; padding: 0.5rem 0; font-style: italic; }

    .intro-text {
      position: absolute; top: 210px; right: 60px; z-index: 10; width: 360px; max-width: 90vw;
      background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border); border-left: 3px solid var(--ember);
      border-radius: 16px; padding: 1.3rem 1.5rem;
      color: var(--mist); font-size: 15.5px; line-height: 1.7; text-align: left; font-weight: 300;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .intro-highlight {
      display: block; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px;
      letter-spacing: -0.3px; margin-bottom: 8px;
      background: linear-gradient(90deg, var(--ember), var(--nova));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .sections-container {
      position: relative; z-index: 10; display: flex; flex-wrap: wrap; justify-content: center;
      gap: 20px; padding: 320px 20px 110px; max-width: 1200px; margin: 0 auto;
      pointer-events: none;
    }
    .section-panel {
      flex: 1 1 180px; min-width: 160px; max-width: 280px;
      background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border); border-radius: 18px; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45); transition: border-color 0.35s, box-shadow 0.35s, transform 0.35s;
      display: flex; flex-direction: column; position: relative;
      pointer-events: auto;
    }
    .section-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 2;
      background: linear-gradient(90deg, var(--ember), var(--nova), var(--aurora)); opacity: 0.9;
    }
    .section-panel:hover {
      border-color: var(--panel-border-hover); transform: translateY(-4px);
      box-shadow: 0 26px 60px rgba(0,0,0,0.5), 0 0 34px rgba(255,122,69,0.2);
    }
    .panel-cover {
      width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block;
      border-bottom: 1px solid rgba(140,150,255,0.14); flex-shrink: 0;
      filter: saturate(0.95) brightness(0.94); transition: filter 0.4s;
    }
    .section-panel:hover .panel-cover { filter: saturate(1.25) brightness(1.08); }
    .panel-body { padding: 0.9rem 1.1rem 1.1rem; display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .panel-body h3 {
      font-family: 'Space Grotesk', sans-serif; font-weight: 600;
      color: var(--parchment); font-size: 16px; margin-bottom: 0.7rem;
      display: flex; align-items: center; gap: 7px;
      border-bottom: 1px solid rgba(140,150,255,0.14); padding-bottom: 0.6rem; flex-shrink: 0;
    }
    .panel-body h3::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--nova); box-shadow: 0 0 8px var(--nova-dim); }
    .panel-body h3 .en { font-family: 'Inter', sans-serif; color: var(--mist-dim); font-size: 10.5px; font-weight: 500; margin-left: auto; letter-spacing: 1.5px; text-transform: uppercase; }
    .panel-scroll {
      max-height: 260px; overflow-y: auto; scrollbar-width: thin;
      scrollbar-color: var(--nova) rgba(20,21,38,0.3); flex: 1;
    }
    .panel-scroll::-webkit-scrollbar { width: 5px; }
    .panel-scroll::-webkit-scrollbar-track { background: rgba(20,21,38,0.3); border-radius: 3px; }
    .panel-scroll::-webkit-scrollbar-thumb { background: var(--nova); border-radius: 3px; }
    .sub-block { margin-bottom: 4px; }
    .sub-title {
      color: var(--ember); font-size: 12.5px; font-weight: 600; padding: 8px 8px;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(140,150,255,0.1); transition: all 0.25s; border-radius: 5px;
      user-select: none; letter-spacing: 0.2px;
    }
    .sub-title:hover, .sub-title:focus-visible {
      color: var(--parchment); background: rgba(255,154,107,0.1); padding-left: 12px;
    }
    .sub-title::after { content: '▾'; font-size: 10px; color: var(--mist-dim); transition: transform 0.25s; }
    .sub-block.collapsed .sub-title::after { transform: rotate(-90deg); }
    .sub-articles { max-height: 200px; overflow: hidden; transition: max-height 0.4s ease, opacity 0.3s; opacity: 1; }
    .sub-block.collapsed .sub-articles { max-height: 0; opacity: 0; overflow: hidden; }
    .article-link {
      display: block; padding: 6px 8px 6px 14px; color: #d6d7e8; text-decoration: none;
      font-size: 12px; border-left: 2px solid rgba(140,150,255,0.25); transition: all 0.25s;
      white-space: normal; line-height: 1.4; margin: 2px 0; border-radius: 0 6px 6px 0; cursor: pointer;
    }
    .article-link:hover, .article-link:focus-visible {
      color: var(--parchment); border-left-color: var(--ember); padding-left: 18px;
      background: rgba(255,154,107,0.08);
    }
    .article-link .art-title { font-weight: 600; }
    .article-link .art-date { font-size: 10px; color: var(--mist); display: block; margin-top: 1px; }
    .article-link .art-excerpt { font-size: 10px; color: var(--mist-dim); display: block; margin-top: 1px; }
    .no-articles { color: var(--mist-dim); font-size: 12px; padding: 8px 0; font-style: italic; }
    .loading-text { color: var(--mist-dim); font-size: 12px; padding: 0.5rem 0; }

    .share-bar { position: fixed; bottom: 22px; right: 22px; z-index: 100; display: flex; gap: 10px; }
    .share-btn {
      background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border); color: var(--parchment); padding: 11px 20px;
      border-radius: 30px; cursor: pointer; font-size: 13.5px; font-weight: 500;
      transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center;
      gap: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .share-btn:hover, .share-btn:focus-visible { border-color: var(--panel-border-hover); transform: translateY(-2px); }
    .share-btn.wa { color: #4fe0a3; border-color: rgba(79,224,163,0.25); }
    .share-btn.wa:hover { background: rgba(79,224,163,0.1); border-color: #4fe0a3; }
    .share-btn.msg { color: #7fb3ff; border-color: rgba(127,179,255,0.25); }
    .share-btn.msg:hover { background: rgba(127,179,255,0.1); border-color: #7fb3ff; }

    .constellation-layer { position: fixed; inset: 0; z-index: 4; pointer-events: none; width: 100%; height: 100%; }
    .constellation-line { stroke: var(--nova); stroke-width: 1; transition: stroke-opacity 0.3s ease; }
    .constellation-line.active { stroke: #fff; }

    .quote-star { position: absolute; max-width: 300px; pointer-events: auto; z-index: 5; animation: drift linear infinite; }
    .quote-star:hover, .quote-star.hover-active { animation-play-state: paused !important; z-index: 6; }

    .signal-dot {
      position: absolute; top: 8px; left: -12px; width: 6px; height: 6px; border-radius: 50%;
      background: var(--nova); box-shadow: 0 0 10px var(--nova), 0 0 22px var(--nova-dim);
      animation: signal-pulse 1.15s ease-in-out infinite;
    }
    .quote-star.revealed .signal-dot { opacity: 0; transition: opacity 0.4s ease; }
    @keyframes signal-pulse { 0%,100% { opacity: 0.3; transform: scale(0.75); } 50% { opacity: 1; transform: scale(1.35); } }

    .comet-tail {
      position: absolute; top: 8px; left: -12px; width: 100px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--nova-dim) 65%, transparent);
      transform-origin: left center;
      transform: translateY(-50%) rotate(var(--tail-angle));
      filter: blur(2px); opacity: 0.5; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .quote-star:hover .comet-tail, .quote-star.hover-active .comet-tail { opacity: 0; }

    .quote-star::after {
      content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
      transform: translate(-50%, -50%) scale(0); border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, var(--ember) 35%, transparent 72%);
      box-shadow: 0 0 0 rgba(255,255,255,0);
      opacity: 0; pointer-events: none; z-index: -1;
      transition: transform 0.55s cubic-bezier(.22,1,.36,1), opacity 0.4s ease, box-shadow 0.55s ease;
    }
    .quote-star:hover::after, .quote-star.hover-active::after {
      transform: translate(-50%, -50%) scale(46);
      opacity: 0.16;
      box-shadow: 0 0 60px 20px rgba(255,255,255,0.25);
    }

    .quote-inner {
      font-family: 'Space Grotesk', sans-serif; font-weight: 300;
      color: rgba(244,241,234,0.7); font-size: 15px;
      text-shadow: 0 0 12px rgba(255,255,255,0.15); line-height: 1.5;
      opacity: 0; transform: translateY(6px) scale(0.94);
      transition: transform 0.45s cubic-bezier(.34,1.56,.64,1), opacity 0.6s ease, text-shadow 0.4s ease, color 0.3s ease;
    }
    .quote-star.revealed .quote-inner { opacity: 1; transform: translateY(0) scale(1); }
    .quote-text { font-variant-ligatures: none; }
    .quote-star:hover .quote-inner,
    .quote-star.hover-active .quote-inner {
      transform: scale(1.3); color: #fff; font-weight: 400;
      text-shadow: 0 0 16px #fff, 0 0 34px #fff, 0 0 60px var(--ember), 0 0 90px var(--nova-dim);
    }
    .quote-author {
      font-family: 'Inter', sans-serif; color: var(--ember); font-size: 0.62em;
      opacity: 0; display: block; margin-top: 5px; font-style: normal; letter-spacing: 0.3px;
      transition: opacity 0.5s ease, color 0.3s ease;
    }
    .quote-author.shown { opacity: 0.85; }
    .quote-star:hover .quote-author, .quote-star.hover-active .quote-author { color: var(--nova); opacity: 1; }
    @keyframes drift { from { transform: translate(var(--sx), var(--sy)); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } to { transform: translate(var(--ex), var(--ey)); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .signal-dot, .comet-tail { display: none; }
      .quote-inner { opacity: 1 !important; transform: none !important; }
      .constellation-layer { display: none; }
      .quote-star::after { display: none; }
    }

    .lightbox-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(4,4,10,0.92); display: none; align-items: center; justify-content: center; cursor: zoom-out; }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img { max-width: 90vw; max-height: 90vh; border-radius: 10px; box-shadow: 0 0 50px rgba(140,150,255,0.25); }

    :focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .star, .quote-star { animation: none !important; opacity: 0.5; }
      .section-panel, .share-btn, .latest-item, .article-link { transition: none !important; }
      .title-block::before, .cz-title { animation: none !important; }
    }

    @media (max-width: 900px) {
      .latest-panel { position: relative; top: auto; left: auto; margin: 20px auto; width: 90%; }
      .intro-text { position: relative; top: auto; right: auto; margin: 20px auto; width: 90%; text-align: center; }
      .sections-container { padding: 40px 20px 100px; flex-direction: column; align-items: center; }
      .section-panel { width: 90%; max-width: 400px; flex: none; }
      .panel-scroll { max-height: 300px; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="stars" id="stars"></div>
  <svg class="constellation-layer" id="constellationLayer"></svg>
  <div class="lightbox-overlay" id="lightboxOverlay" onclick="this.classList.remove('open')"></div>
  <div class="title-block">
    <div class="cz-title">Moje diagnóza, můj vesmír</div>
    <div class="en-title">My diagnosis, my universe</div>
  </div>
  <div class="latest-panel" id="latestPanel">
    <h3>Poslední aktuality</h3>
    <div class="loading-text">Načítání...</div>
  </div>
  <div class="intro-text"><span class="intro-highlight">Jsem Zajda.</span> Trochu cvok a občasný zapisovatel vlastního života. Tohle je místo, kam si odkládám vzpomínky z cest, příběhy z míst, kde byl občas pořádný rachot...</div>
  <div class="sections-container" id="sectionsContainer"></div>
  <div class="share-bar">
    <a class="share-btn wa" id="shareWhatsApp" href="#" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      WhatsApp
    </a>
    <a class="share-btn msg" id="shareMessenger" href="#" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 4.975 0 11.111c0 3.497 1.745 6.616 4.472 8.652V24l4.086-2.242c1.09.301 2.246.464 3.442.464 6.627 0 12-4.974 12-11.111C24 4.975 18.627 0 12 0zm1.193 14.963l-3.056-3.259-5.963 3.259L10.732 8.2l3.131 3.259L19.752 8.2l-6.559 6.763z"/></svg>
      Messenger
    </a>
  </div>
  <script>
  function openLightbox(src) {
    var overlay = document.getElementById('lightboxOverlay');
    if (!overlay) return;
    overlay.innerHTML = '<img src="' + src + '" alt="">';
    overlay.classList.add('open');
  }

  document.addEventListener('DOMContentLoaded', function() {
    var starsBox = document.getElementById('stars');
    if (starsBox) {
      var frag = document.createDocumentFragment();
      for (var i = 0; i < 200; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.setProperty('--dur', (3 + Math.random() * 4) + 's');
        s.style.setProperty('--del', (Math.random() * 5) + 's');
        frag.appendChild(s);
      }
      starsBox.appendChild(frag);
    }

    function escapeHtml(t) {
      if (t == null) return '';
      return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('cs', { year: 'numeric', month: 'numeric', day: 'numeric' });
      } catch(e) { return ''; }
    }

    async function loadQuotes() {
      try { var r = await fetch('/api/quotes/list'); if (!r.ok) return []; return await r.json(); }
      catch(e) { return []; }
    }

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var activeQuotes = []; // { el }
    var constellationSvg = document.getElementById('constellationLayer');
    var constellationRunning = false;
    var DECODE_CHARS = '#*+·˚✦✧⋆°ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzáčďéěíňóřšťúůýž';

    function decodeText(el, finalText, duration) {
      if (reduceMotion || !finalText) { el.textContent = finalText || ''; return; }
      var len = finalText.length;
      var start = null;
      function frame(ts) {
        if (!start) start = ts;
        var progress = Math.min(1, (ts - start) / duration);
        var revealCount = Math.floor(progress * len);
        var out = '';
        for (var i = 0; i < len; i++) {
          var ch = finalText[i];
          if (i < revealCount || ch === ' ') out += ch;
          else out += DECODE_CHARS[Math.floor(Math.random() * DECODE_CHARS.length)];
        }
        el.textContent = out;
        if (progress < 1) requestAnimationFrame(frame);
        else el.textContent = finalText;
      }
      requestAnimationFrame(frame);
    }

    function updateConstellation(ts) {
      if (!constellationSvg) return;
      var w = window.innerWidth, h = window.innerHeight;
      constellationSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      var centers = activeQuotes.map(function(entry) {
        var r = entry.el.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2, hover: entry.el.classList.contains('hover-active') };
      });
      var svgns = 'http://www.w3.org/2000/svg';
      var frag = document.createDocumentFragment();
      var maxDist = 380;
      for (var i = 0; i < centers.length; i++) {
        for (var j = i + 1; j < centers.length; j++) {
          var a = centers[i], b = centers[j];
          var dx = a.x - b.x, dy = a.y - b.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < maxDist) {
            var line = document.createElementNS(svgns, 'line');
            line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
            line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
            var highlight = a.hover || b.hover;
            var baseOpacity = (1 - dist / maxDist) * 0.3;
            line.setAttribute('class', 'constellation-line' + (highlight ? ' active' : ''));
            line.setAttribute('stroke-opacity', String(highlight ? Math.min(0.9, baseOpacity + 0.5) : baseOpacity));
            frag.appendChild(line);
          }
        }
      }
      constellationSvg.innerHTML = '';
      constellationSvg.appendChild(frag);
      if (activeQuotes.length > 0) requestAnimationFrame(updateConstellation);
      else constellationRunning = false;
    }

    function ensureConstellationLoop() {
      if (!constellationRunning && !reduceMotion) {
        constellationRunning = true;
        requestAnimationFrame(updateConstellation);
      }
    }

    function spawnQuote(q) {
      var el = document.createElement('div');
      el.className = 'quote-star';
      var sz = 13 + Math.floor(Math.random() * 10);

      var sx = Math.random() * (window.innerWidth - 100);
      var sy = Math.random() * (window.innerHeight - 80);
      el.style.left = sx + 'px';
      el.style.top = sy + 'px';
      var ex = (Math.random() - 0.5) * 400;
      var ey = (Math.random() - 0.5) * 400;
      el.style.setProperty('--sx', '0px');
      el.style.setProperty('--sy', '0px');
      el.style.setProperty('--ex', ex + 'px');
      el.style.setProperty('--ey', ey + 'px');
      el.style.animationDuration = (14 + Math.random() * 10) + 's';
      var tailAngle = (Math.atan2(ey, ex) * 180 / Math.PI) + 180;
      el.style.setProperty('--tail-angle', tailAngle + 'deg');

      el.innerHTML =
        '<span class="comet-tail"></span>' +
        '<span class="signal-dot"></span>' +
        '<div class="quote-inner" style="font-size:' + sz + 'px">"<span class="quote-text"></span>"' +
        '<span class="quote-author"></span></div>';

      document.body.appendChild(el);

      var entry = { el: el };
      activeQuotes.push(entry);
      ensureConstellationLoop();

      el.addEventListener('mouseenter', function() { el.classList.add('hover-active'); });
      el.addEventListener('mouseleave', function() { el.classList.remove('hover-active'); });

      var textEl = el.querySelector('.quote-text');
      var authorEl = el.querySelector('.quote-author');
      var revealDelay = reduceMotion ? 0 : 400 + Math.random() * 500;
      setTimeout(function() {
        el.classList.add('revealed');
        decodeText(textEl, q.text || '', reduceMotion ? 0 : 650);
        setTimeout(function() {
          authorEl.textContent = q.author || '';
          authorEl.classList.add('shown');
        }, reduceMotion ? 0 : 700);
      }, revealDelay);

      setTimeout(function() {
        el.remove();
        var idx = activeQuotes.indexOf(entry);
        if (idx > -1) activeQuotes.splice(idx, 1);
      }, 25000);
    }
    async function startQuotes() {
      var quotes = await loadQuotes();
      if (!quotes.length) return;
      for (var i = 0; i < Math.min(8, quotes.length); i++) spawnQuote(quotes[Math.floor(Math.random() * quotes.length)]);
      setInterval(function() {
        if (document.querySelectorAll('.quote-star').length > 12) return;
        spawnQuote(quotes[Math.floor(Math.random() * quotes.length)]);
      }, 5000);
    }

    var cachedArticles = null;
    async function getAllArticles() {
      if (cachedArticles) return cachedArticles;
      try {
        var r = await fetch('/api/articles/list');
        if (!r.ok) return [];
        var data = await r.json();
        cachedArticles = Array.isArray(data) ? data : [];
        return cachedArticles;
      } catch(e) { return []; }
    }

    async function loadLatest() {
      var box = document.getElementById('latestPanel');
      if (!box) return;
      var articles = await getAllArticles();
      var sorted = articles.slice().sort(function(a, b) {
        var da = a.date || a.created || '';
        var db = b.date || b.created || '';
        if (da < db) return 1;
        if (da > db) return -1;
        return 0;
      });
      var latest = sorted.slice(0, 3);
      if (!latest.length) {
        box.innerHTML = '<h3>Poslední aktuality</h3><div class="latest-empty">Zatím žádné články</div>';
        return;
      }
      var html = '<h3>Poslední aktuality</h3>';
      for (var i = 0; i < latest.length; i++) {
        var a = latest[i];
        var artId = a.id || '';
        var title = a.title || 'Bez názvu';
        var date = a.date || a.created || '';
        var dateStr = formatDate(date);
        var meta = dateStr ? '• ' + dateStr : '';
        html += '<a class="latest-item" href="/article.html?id=' + encodeURIComponent(artId) + '">' + escapeHtml(title) + '<small>' + escapeHtml(meta) + '</small></a>';
      }
      box.innerHTML = html;
      var shareText = 'Nové aktuality na Moje diagnóza, můj vesmír! ' + latest.map(function(a){ return a.title; }).join(', ') + ' - ' + window.location.origin;
      var waBtn = document.getElementById('shareWhatsApp');
      if (waBtn) waBtn.href = 'https://wa.me/?text=' + encodeURIComponent(shareText);
      var msgBtn = document.getElementById('shareMessenger');
      if (msgBtn) msgBtn.href = 'https://www.facebook.com/dialog/send?app_id=YOUR_APP_ID&link=' + encodeURIComponent(window.location.href) + '&redirect_uri=' + encodeURIComponent(window.location.href);
    }

    var SECTIONS = [
      { id: 'travel', name: 'Cestování', nameEn: 'Travel' },
      { id: 'photo', name: 'Fotografování', nameEn: 'Photo' },
      { id: 'projects', name: 'Projekty', nameEn: 'Projects' },
      { id: 'about', name: 'O Zajdovi', nameEn: 'About' }
    ];

    async function loadSectionCover(secId) {
      try {
        var r = await fetch('/api/sections/cover?sectionId=' + secId);
        if (!r.ok) return '';
        var d = await r.json();
        return d.url || '';
      } catch(e) { return ''; }
    }

    async function loadSubsections(secId) {
      try {
        var r = await fetch('/api/subsections/by-section?sectionId=' + secId);
        if (!r.ok) return [];
        return await r.json();
      } catch(e) { return []; }
    }

    function renderArticleList(articles) {
      if (!articles.length) return '<div class="no-articles">Žádné články</div>';
      var sorted = articles.slice().sort(function(a, b) {
        var da = a.date || a.created || '';
        var db = b.date || b.created || '';
        if (da < db) return 1;
        if (da > db) return -1;
        return 0;
      });
      var html = '';
      for (var i = 0; i < sorted.length; i++) {
        var a = sorted[i];
        var artId = a.id || '';
        var title = a.title || 'Bez názvu';
        var date = a.date || a.created || '';
        var dateStr = formatDate(date);
        var excerpt = a.content ? a.content.replace(/<[^>]+>/g, '').substring(0, 60) + '...' : '';
        html += '<a class="article-link" href="/article.html?id=' + encodeURIComponent(artId) + '">' +
          '<span class="art-title">' + escapeHtml(title) + '</span>' +
          (dateStr ? '<span class="art-date">' + escapeHtml(dateStr) + '</span>' : '') +
          (excerpt ? '<span class="art-excerpt">' + escapeHtml(excerpt) + '</span>' : '') +
          '</a>';
      }
      return html;
    }

    async function buildSections() {
      var container = document.getElementById('sectionsContainer');
      if (!container) return;
      container.innerHTML = '';
      var allArticles = await getAllArticles();
      for (var s = 0; s < SECTIONS.length; s++) {
        (function(sec) {
          var panel = document.createElement('div');
          panel.className = 'section-panel';

          if (sec.id === 'about') {
            panel.style.cursor = 'pointer';
            panel.addEventListener('click', function() {
              window.location.href = '/about/';
            });

            var img = document.createElement('img');
            img.className = 'panel-cover';
            img.alt = sec.name;
            img.src = '/images/placeholder.jpg';
            img.onerror = function() { this.src = '/images/placeholder.jpg'; };
            loadSectionCover(sec.id).then(function(url) {
              if (url) img.src = url;
            });

            var body = document.createElement('div');
            body.className = 'panel-body';
            body.innerHTML = '<h3>' + escapeHtml(sec.name) + '<span class="en">' + escapeHtml(sec.nameEn) + '</span></h3>';

            var scroll = document.createElement('div');
            scroll.className = 'panel-scroll';
            scroll.innerHTML = '<div style="color:#cbd5e1;font-size:13px;line-height:1.6;padding:8px 0">Jsem Zajda. Trochu cvok a občasný zapisovatel vlastního života...</div>' +
              '<div style="text-align:center;margin-top:1rem"><span style="color:#ff6600;font-size:13px;font-weight:600;text-shadow:0 0 12px rgba(255,102,0,0.4)">Číst více →</span></div>';

            body.appendChild(scroll);
            panel.appendChild(img);
            panel.appendChild(body);
            container.appendChild(panel);
            return;
          }

          var img = document.createElement('img');
          img.className = 'panel-cover';
          img.alt = sec.name;
          img.src = '/images/placeholder.jpg';
          img.onerror = function() { this.src = '/images/placeholder.jpg'; };
          loadSectionCover(sec.id).then(function(url) {
            if (url) img.src = url;
          });

          var body = document.createElement('div');
          body.className = 'panel-body';
          body.innerHTML = '<h3>' + escapeHtml(sec.name) + '<span class="en">' + escapeHtml(sec.nameEn) + '</span></h3>';

          var scroll = document.createElement('div');
          scroll.className = 'panel-scroll';
          scroll.innerHTML = '<div class="loading-text">Načítání...</div>';

          body.appendChild(scroll);
          panel.appendChild(img);
          panel.appendChild(body);
          container.appendChild(panel);

          (async function() {
            var subs = await loadSubsections(sec.id);
            var html = '';

            if (!subs.length) {
              var articles = allArticles.filter(function(a) {
                var secId = a.sectionId;
                if (secId == null) return false;
                return String(secId) === sec.id;
              });
              html += renderArticleList(articles);
            } else {
              for (var i = 0; i < subs.length; i++) {
                var sub = subs[i];
                var subId = sub.id || '';
                var subName = sub.name || '';
                var subArticles = allArticles.filter(function(a) {
                  var aSec = a.sectionId;
                  var aSub = a.subsectionId;
                  if (aSec == null || aSub == null) return false;
                  return String(aSec) === String(sec.id) && String(aSub) === String(subId);
                });
                html += '<div class="sub-block">' +
                  '<div class="sub-title">' + escapeHtml(subName) + '</div>' +
                  '<div class="sub-articles">' + renderArticleList(subArticles) + '</div>' +
                  '</div>';
              }
            }

            scroll.innerHTML = html;

            scroll.querySelectorAll('.sub-title').forEach(function(titleEl) {
              titleEl.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                var block = this.parentElement;
                if (block) block.classList.toggle('collapsed');
              });
            });
          })();
        })(SECTIONS[s]);
      }
    }

    startQuotes();
    loadLatest();
    buildSections();
  });
  </script>
</body>
