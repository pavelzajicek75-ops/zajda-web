<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }

    /* NADPISY */
    .title-block {
      position: absolute;
      top: 40px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    .cz-title {
      font-size: 48px;
      font-weight: 600;
      color: #ff6600;
      text-shadow: 0 0 25px #ff6600;
      letter-spacing: 2px;
      display: block;
    }

    .en-title {
      font-size: 28px;
      font-weight: 400;
      color: #ffcc66;
      text-shadow: 0 0 20px #ffcc66;
      margin-top: 8px;
      display: block;
    }

    /* LÉTAJÍCÍ CITÁTY */
    .quote-star {
      position: absolute;
      max-width: 320px;
      white-space: normal; /* ZALAMOVÁNÍ */
      color: rgba(255,255,255,0.7);
      font-weight: 300;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
      transition: all 0.6s ease;
      pointer-events: auto;
      cursor: default;
      opacity: 0.85;
    }

    /* ZVÝRAZNĚNÍ PŘI HOVERU */
    .quote-star:hover {
      color: #fff;
      text-shadow:
        0 0 25px #ffffff,
        0 0 45px #ff6600,
        0 0 70px #ff6600;
      transform: scale(1.25);
      transition: all 0.3s ease;
    }

    /* POMALÉ ZHASÍNÁNÍ PO ODJEZDU MYŠI */
    .fade-out {
      transition: all 3s ease;
      color: rgba(255,255,255,0.6) !important;
      text-shadow: 0 0 5px rgba(255,255,255,0.3) !important;
      transform: scale(1) !important;
    }

    @keyframes drift {
      from { transform: translate(var(--sx), var(--sy)); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      to { transform: translate(var(--ex), var(--ey)); opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="title-block">
    <span class="cz-title">Moje diagnóza, můj vesmír</span>
    <span class="en-title">My diagnosis, my universe</span>
  </div>

  <script>
    async function loadQuotes() {
      const res = await fetch("/api/quotes");
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    }

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnQuote(q) {
      const el = document.createElement("div");
      el.className = "quote-star";

      el.innerHTML = `
        "<strong>${q.text}</strong>"<br>
        <span style="color:#ffcc66; font-size:14px;">– ${q.author}</span>
      `;

      const startX = random(0, window.innerWidth);
      const startY = random(0, window.innerHeight);
      const endX = startX + random(-300, 300);
      const endY = startY + random(-300, 300);

      el.style.left = startX + "px";
      el.style.top = startY + "px";

      el.style.setProperty("--sx", "0px");
      el.style.setProperty("--sy", "0px");
      el.style.setProperty("--ex", (endX - startX) + "px");
      el.style.setProperty("--ey", (endY - startY) + "px");

      el.style.animation = `drift ${random(14, 22)}s linear infinite`;

      /* ZHASÍNÁNÍ PO ODJEZDU MYŠI */
      el.addEventListener("mouseleave", () => {
        el.classList.add("fade-out");
        setTimeout(() => el.classList.remove("fade-out"), 3000);
      });

      document.body.appendChild(el);
    }

    async function startSky() {
      const quotes = await loadQuotes();
      if (!quotes.length) return;

      /* MAX 10 CITÁTŮ NA PLOŠE */
      for (let i = 0; i < 10; i++) {
        const q = quotes[Math.floor(Math.random() * quotes.length)];
        spawnQuote(q);
      }

      /* každé 4 sekundy přidáme nový a odstraníme nejstarší */
      setInterval(() => {
        const q = quotes[Math.floor(Math.random() * quotes.length)];
        spawnQuote(q);

        const stars = document.querySelectorAll(".quote-star");
        if (stars.length > 10) stars[0].remove();
      }, 4000);
    }

    startSky();
  </script>
</body>
</html>
