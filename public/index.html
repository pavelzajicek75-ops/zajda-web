<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }

    /* NADPISY */
    .title-block {
      position: absolute;
      top: 40px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    .cz-title {
      font-size: 48px;
      font-weight: 600;
      color: #ff6600;
      text-shadow: 0 0 25px #ff6600;
      letter-spacing: 2px;
      display: block;
    }

    .en-title {
      font-size: 28px;
      font-weight: 400;
      color: #ffcc66;
      text-shadow: 0 0 20px #ffcc66;
      margin-top: 8px;
      display: block;
    }

    /* LÉTAJÍCÍ CITÁTY */
    .quote-star {
      position: absolute;
      white-space: nowrap;
      color: rgba(255,255,255,0.7);
      font-weight: 300;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
      transition: all 0.6s ease;
      pointer-events: auto;
      cursor: default;
    }

    .quote-star:hover {
      color: #fff;
      text-shadow: 0 0 20px #ffffff, 0 0 40px #ffcc66;
      transform: scale(1.15);
    }

    @keyframes drift {
      from { transform: translate(var(--sx), var(--sy)); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      to { transform: translate(var(--ex), var(--ey)); opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="title-block">
    <span class="cz-title">Moje diagnóza, můj vesmír</span>
    <span class="en-title">My diagnosis, my universe</span>
  </div>

  <script>
    async function loadQuotes() {
      const res = await fetch("/api/quotes");
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    }

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnQuote(q) {
      const el = document.createElement("div");
      el.className = "quote-star";
      el.textContent = q.text; // bez uvozovek

      const startX = random(0, window.innerWidth);
      const startY = random(0, window.innerHeight);
      const endX = startX + random(-300, 300);
      const endY = startY + random(-300, 300);

      el.style.left = startX + "px";
      el.style.top = startY + "px";

      el.style.setProperty("--sx", "0px");
      el.style.setProperty("--sy", "0px");
      el.style.setProperty("--ex", (endX - startX) + "px");
      el.style.setProperty("--ey", (endY - startY) + "px");

      el.style.animation = `drift ${random(12, 22)}s linear infinite`;

      document.body.appendChild(el);
    }

    async function startSky() {
      const quotes = await loadQuotes();
      if (!quotes.length) return;

      // 20 hvězd najednou
      for (let i = 0; i < 20; i++) {
        const q = quotes[Math.floor(Math.random() * quotes.length)];
        spawnQuote(q);
      }

      // každé 3 sekundy přidáme novou hvězdu
      setInterval(() => {
        const q = quotes[Math.floor(Math.random() * quotes.length)];
        spawnQuote(q);
      }, 3000);
    }

    startSky();
  </script>
</body>
</html>
