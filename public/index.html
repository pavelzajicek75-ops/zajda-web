<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* VESMÍRNÉ POZADÍ – HLUBOKÝ GRADIENT + MLHOVINY */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at 50% 20%, #0d0d1a, #000000 70%),
                  radial-gradient(circle at 80% 80%, rgba(80,0,120,0.35), transparent 60%),
                  radial-gradient(circle at 20% 70%, rgba(0,80,160,0.25), transparent 60%),
                  radial-gradient(circle at 60% 30%, rgba(255,120,0,0.18), transparent 70%);
      background-blend-mode: screen;
      position: relative;
      height: 100vh;
    }

    /* PULZUJÍCÍ HVĚZDY – JEMNÉ, NERUŠIVÉ */
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.7;
      animation: twinkle 4s infinite ease-in-out;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { opacity: 0.2; }
    }

    /* NADPISY */
    .title-block {
      position: absolute;
      top: 40px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    .cz-title {
      font-size: 48px;
      font-weight: 600;
      color: #ff6600;
      text-shadow: 0 0 25px #ff6600;
      letter-spacing: 2px;
      display: block;
    }

    .en-title {
      font-size: 28px;
      font-weight: 400;
      color: #ffcc66;
      text-shadow: 0 0 20px #ffcc66;
      margin-top: 8px;
      display: block;
    }

    /* TVŮJ TEXT NAPRAVO POD NADPISEM */
    .intro-text {
      position: absolute;
      top: 220px;
      right: 80px;
      width: 380px;
      text-align: left;
      color: #ffb366;
      font-size: 18px;
      line-height: 1.5;
      text-shadow: 0 0 12px rgba(255, 150, 50, 0.4);
      z-index: 9;
    }

    /* LÉTAJÍCÍ CITÁTY */
    .quote-star {
      position: absolute;
      max-width: 320px;
      white-space: normal;
      color: rgba(255,255,255,0.75);
      font-weight: 300;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
      transition: all 0.6s ease;
      pointer-events: auto;
      cursor: default;
      opacity: 0.85;
      z-index: 5;
    }

    .quote-star:hover {
      color: #fff;
      text-shadow:
        0 0 25px #ffffff,
        0 0 45px #ff6600,
        0 0 70px #ff6600;
      transform: scale(1.25);
      transition: all 0.3s ease;
    }

    .fade-out {
      transition: all 3s ease;
      color: rgba(255,255,255,0.6) !important;
      text-shadow: 0 0 5px rgba(255,255,255,0.3) !important;
      transform: scale(1) !important;
    }

    @keyframes drift {
      from { transform: translate(var(--sx), var(--sy)); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      to { transform: translate(var(--ex), var(--ey)); opacity: 0; }
    }

    /* DOLNÍ SEKCE */
    .sections {
      position: absolute;
      bottom: 40px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 60px;
      z-index: 10;
    }

    .section-link {
      color: #ffcc66;
      font-size: 20px;
      text-decoration: none;
      text-shadow: 0 0 15px rgba(255, 200, 100, 0.6);
      transition: all 0.3s ease;
    }

    .section-link:hover {
      color: #fff;
      text-shadow: 0 0 25px #ff6600, 0 0 45px #ff6600;
      transform: scale(1.15);
    }
  </style>
</head>

<body>

  <!-- GENERÁTOR HVĚZD -->
  <script>
    for (let i = 0; i < 180; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.left = Math.random() * window.innerWidth + "px";
      star.style.top = Math.random() * window.innerHeight + "px";
      star.style.animationDelay = (Math.random() * 4) + "s";
      document.body.appendChild(star);
    }
  </script>

  <div class="title-block">
    <span class="cz-title">Moje diagnóza, můj vesmír</span>
    <span class="en-title">My diagnosis, my universe</span>
  </div>

  <div class="intro-text">
    Jsem Zajda. Trochu cvok a občasný zapisovatel vlastního života. Tohle je místo, kam si odkládám vzpomínky z cest, příběhy z míst, kde byl občas pořádný rachot...
  </div>

  <div class="sections">
    <a href="/travel" class="section-link">Cestování / Travel</a>
    <a href="/photo" class="section-link">Fotografování / Photo</a>
    <a href="/projects" class="section-link">Projekty / Projects</a>
    <a href="/about" class="section-link">Zajda / About</a>
  </div>

  <script>
    async function loadQuotes() {
      const res = await fetch("/api/quotes");
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    }

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnQuote(q) {
      const el = document.createElement("div");
      el.className = "quote-star";

      el.innerHTML = `
        "<strong>${q.text}</strong>"<br>
        <span style="color:#ffcc66; font-size:14px;">– ${q.author}</span>
      `;

      const startX = random(0, window.innerWidth);
      const startY = random(0, window.innerHeight);
      const endX = startX + random(-300, 300);
      const endY = startY + random(-300, 300);

      el.style.left = startX + "px";
      el.style.top = startY + "px";

      el.style.setProperty("--sx", "0px");
      el.style.setProperty("--sy", "0px");
      el.style.setProperty("--ex", (endX - startX) + "px");
      el.style.setProperty("--ey", (endY - startY) + "px");

      el.style.animation = `drift ${random(14, 22)}s linear infinite`;

      el.addEventListener("mouseleave", () => {
        el.classList.add("fade-out");
        setTimeout(() => el.classList.remove("fade-out"), 3000);
      });

      document.body.appendChild(el);
    }

    async function startSky() {
      const quotes = await loadQuotes();
      if (!quotes.length) return;

      for (let i = 0; i < 10; i++) {
        const q = quotes[Math.floor(Math.random() * quotes.length)];
        spawnQuote(q);
      }

      setInterval(() => {
        const q = quotes[Math.floor(Math.random() * quotes.length)];
        spawnQuote(q);

        const stars = document.querySelectorAll(".quote-star");
        if (stars.length > 10) stars[0].remove();
      }, 4000);
    }

    startSky();
  </script>
</body>
</html>
