<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000; color: #fff;
      overflow-x: hidden; min-height: 100vh; position: relative;
    }
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(circle at 50% 20%, #0a0a1a, #000 80%),
        radial-gradient(circle at 80% 80%, rgba(60,20,100,0.3), transparent 60%),
        radial-gradient(circle at 20% 70%, rgba(0,60,120,0.25), transparent 60%);
      background-blend-mode: screen;
    }
    .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .star {
      position: absolute; width: 2px; height: 2px;
      background: white; border-radius: 50%; opacity: 0;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--del);
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(0.5); }
      50% { opacity: 0.9; transform: scale(1); }
    }

    .title-block {
      position: relative; z-index: 10; text-align: center; padding-top: 40px;
    }
    .cz-title { font-size: clamp(28px, 5vw, 52px); font-weight: 700; color: #ff6600; text-shadow: 0 0 30px rgba(255,102,0,0.6); letter-spacing: 2px; }
    .en-title { font-size: clamp(18px, 3vw, 30px); font-weight: 300; color: #ffcc66; text-shadow: 0 0 20px rgba(255,204,102,0.5); margin-top: 6px; }

    /* Aktuality */
    .latest-panel {
      position: absolute; top: 140px; left: 40px; z-index: 10;
      width: 320px; max-width: 90vw;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 102, 0, 0.3);
      border-radius: 14px;
      padding: 1.2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .latest-panel h3 { color: #ffcc66; font-size: 16px; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 8px; }
    .latest-panel h3::before { content: '◆'; color: #ff6600; }
    .latest-item { display: block; color: #e2e8f0; text-decoration: none; padding: 0.6rem 0; border-bottom: 1px solid rgba(51,65,85,0.5); font-size: 14px; transition: all 0.2s; }
    .latest-item:hover { color: #ff6600; padding-left: 6px; }
    .latest-item:last-child { border-bottom: none; }
    .latest-item small { color: #94a3b8; font-size: 12px; display: block; margin-top: 2px; }
    .latest-empty { color: #64748b; font-size: 13px; padding: 0.5rem 0; }

    /* Intro text */
    .intro-text {
      position: absolute; top: 200px; right: 60px; z-index: 10;
      width: 360px; max-width: 90vw;
      color: #ffb366; font-size: 16px; line-height: 1.6;
      text-shadow: 0 0 12px rgba(255,150,50,0.3); text-align: left;
    }

    /* Sekce - normální stav */
    .sections-container {
      position: absolute; bottom: 60px; left: 0; width: 100%; z-index: 10;
      display: flex; justify-content: center; gap: 24px; padding: 0 20px;
      flex-wrap: wrap;
    }
    .section-card {
      position: relative; width: 220px; height: 150px;
      border-radius: 14px; cursor: pointer; flex-shrink: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .section-card:hover:not(.expanded) { transform: translateY(-8px) scale(1.05); }
    
    /* Rozšířená karta (po kliknutí) */
    .section-card.expanded {
      width: 460px; height: 340px;
      z-index: 100;
      transform: translateY(-40px);
    }
    
    .card-glow {
      position: absolute; inset: -2px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,102,0,0.4), rgba(255,204,102,0.2));
      opacity: 0; transition: opacity 0.3s; filter: blur(8px); z-index: -1;
    }
    .section-card:hover .card-glow, .section-card.expanded .card-glow { opacity: 1; }
    
    .card-inner {
      position: relative; width: 100%; height: 100%; border-radius: 14px;
      overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
      background: #0f172a; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: border-color 0.3s;
    }
    .section-card.expanded .card-inner { border-color: rgba(255,102,0,0.6); }
    
    .card-inner img {
      width: 100%; height: 100%; object-fit: cover;
      filter: brightness(0.7); transition: filter 0.4s, transform 0.6s;
    }
    .section-card.expanded .card-inner img { filter: brightness(0.4) blur(1px); transform: scale(1.1); }
    
    .card-label {
      position: absolute; bottom: 0; left: 0; width: 100%;
      padding: 24px 10px 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      color: #ffcc66; font-size: 17px; font-weight: 600; text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9); pointer-events: none;
      transition: opacity 0.3s;
    }
    .section-card.expanded .card-label { opacity: 0; }

    /* Obsah rozbalené karty */
    .card-content {
      position: absolute; inset: 0; z-index: 5;
      padding: 16px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
      overflow-y: auto;
    }
    .section-card.expanded .card-content {
      opacity: 1; pointer-events: auto;
    }
    .card-content::-webkit-scrollbar { width: 4px; }
    .card-content::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    
    .card-content h4 {
      color: #ffcc66; font-size: 18px; margin-bottom: 12px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      border-bottom: 1px solid rgba(255,102,0,0.3); padding-bottom: 8px;
    }
    
    .close-btn {
      position: absolute; top: 8px; right: 12px;
      background: rgba(255,255,255,0.1); border: none;
      color: #ffcc66; font-size: 20px; cursor: pointer;
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; z-index: 10;
    }
    .close-btn:hover { background: rgba(255,102,0,0.3); }

    .sub-block { margin-bottom: 12px; }
    .sub-title {
      color: #ff6600; font-size: 14px; font-weight: 600;
      padding: 6px 0; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .sub-title::after { content: '▼'; font-size: 10px; color: #64748b; transition: transform 0.2s; }
    .sub-block.collapsed .sub-title::after { transform: rotate(-90deg); }
    
    .sub-articles {
      max-height: 200px; overflow-y: auto;
      transition: max-height 0.3s ease;
    }
    .sub-block.collapsed .sub-articles { max-height: 0; overflow: hidden; }
    
    .sub-articles a {
      display: block; padding: 5px 0 5px 12px;
      color: #e2e8f0; text-decoration: none; font-size: 13px;
      border-left: 2px solid #334155;
      transition: all 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sub-articles a:hover { color: #fff; border-left-color: #ff6600; padding-left: 16px; }
    
    .no-articles { color: #64748b; font-size: 13px; padding: 8px 0; font-style: italic; }

    /* WhatsApp */
    .share-bar {
      position: fixed; bottom: 20px; right: 20px; z-index: 100;
      display: flex; gap: 10px;
    }
    .share-btn {
      background: rgba(15,23,42,0.8); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,102,0,0.3); color: #ffcc66;
      padding: 10px 18px; border-radius: 30px; cursor: pointer;
      font-size: 14px; font-weight: 500;
      transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .share-btn:hover { background: rgba(255,102,0,0.2); border-color: #ff6600; transform: translateY(-2px); }
    .share-btn.wa { color: #25d366; border-color: rgba(37,211,102,0.3); }
    .share-btn.wa:hover { background: rgba(37,211,102,0.15); border-color: #25d366; }

    /* Citáty */
    .quote-star {
      position: absolute; max-width: 300px; pointer-events: auto;
      color: rgba(255,255,255,0.7); font-weight: 300; font-size: 15px;
      text-shadow: 0 0 10px rgba(255,255,255,0.4);
      opacity: 0; transition: opacity 1.5s;
      z-index: 5; cursor: default;
    }
    .quote-star.visible { opacity: 0.8; }
    .quote-star:hover { opacity: 1; text-shadow: 0 0 25px #fff, 0 0 40px #ff6600; }
    @keyframes drift {
      from { transform: translate(var(--sx), var(--sy)); opacity: 0; }
      10% { opacity: 0.8; } 90% { opacity: 0.8; }
      to { transform: translate(var(--ex), var(--ey)); opacity: 0; }
    }

    /* Overlay pro zavření kliknutím mimo */
    .overlay-backdrop {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.3);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .overlay-backdrop.active { opacity: 1; pointer-events: auto; }

    @media (max-width: 900px) {
      .latest-panel { position: relative; top: auto; left: auto; margin: 20px auto; width: 90%; }
      .intro-text { position: relative; top: auto; right: auto; margin: 20px auto; width: 90%; text-align: center; }
      .sections-container { position: relative; bottom: auto; margin: 40px 0; flex-direction: column; align-items: center; }
      .section-card { width: 85%; max-width: 340px; }
      .section-card.expanded { width: 95%; max-width: 500px; height: 380px; transform: translateY(-20px); }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="stars" id="stars"></div>
  <div class="overlay-backdrop" id="overlayBackdrop"></div>

  <div class="title-block">
    <div class="cz-title">Moje diagnóza, můj vesmír</div>
    <div class="en-title">My diagnosis, my universe</div>
  </div>

  <div class="latest-panel" id="latestPanel">
    <h3>Poslední aktuality</h3>
    <div style="color:#64748b;font
