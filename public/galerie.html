<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Fotogalerie podle výletů — Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#08080f">
  <link rel="icon" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="description" content="Všechny fotky z článků pohromadě — seřazené podle výletů a míst.">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css?v=20261010">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .nav-bar { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--panel-solid); border: 1px solid rgba(255,122,69,0.35); color: var(--parchment); padding: 10px 22px; border-radius: 30px; font-size: 14px; font-weight: 600; text-decoration: none; transition: all .3s; }
    .back-btn:hover { border-color: var(--ember); background: rgba(255,122,69,0.18); }
    .nav-title { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: var(--ember); text-decoration: none; }
    .page-header { position: relative; z-index: 10; text-align: center; padding: 0 20px 14px; }
    .page-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 4vw, 38px); font-weight: 700; color: var(--parchment); }
    .page-subtitle { color: var(--mist); font-size: 14.5px; margin-top: 8px; font-weight: 300; }
    .wrap { position: relative; z-index: 10; max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 4px 0 22px; }
    .chip { font: 600 13.5px 'Space Grotesk', sans-serif; color: var(--parchment); background: var(--panel-solid); border: 1px solid var(--panel-border); border-radius: 20px; padding: 7px 15px; cursor: pointer; }
    .chip:hover { border-color: var(--ember); }
    .chip[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); color: #08080f; }
    #albumSearch { background: var(--panel-solid); border: 1px solid var(--panel-border); color: var(--parchment); border-radius: 20px; padding: 8px 16px; font-size: 14px; min-width: 200px; }
    .album { margin-bottom: 30px; }
    .album-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 10px; }
    .album-title { font: 700 18px 'Space Grotesk', sans-serif; }
    .album-title a { color: var(--parchment); text-decoration: none; }
    .album-title a:hover { color: var(--ember); }
    .album-meta { font-size: 12.5px; color: var(--mist); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
    .grid button { padding: 0; border: 0; background: #1a1a2e; border-radius: 8px; overflow: hidden; aspect-ratio: 1; cursor: zoom-in; }
    .grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
    .grid button:hover img, .grid button:focus-visible img { transform: scale(1.06); }
    .empty { text-align: center; color: var(--mist); padding: 40px 10px; }
    .lb { position: fixed; inset: 0; background: rgba(4,4,10,.94); z-index: 5000; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 16px; }
    .lb.open { display: flex; }
    .lb img { max-width: 100%; max-height: 80vh; border-radius: 6px; }
    .lb-cap { color: var(--mist); font-size: 13.5px; margin-top: 10px; text-align: center; }
    .lb-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.12); color: #fff; border: 0; font-size: 28px; width: 46px; height: 60px; border-radius: 10px; cursor: pointer; }
    .lb-prev { left: 10px; } .lb-next { right: 10px; }
    .lb-close { position: absolute; top: 12px; right: 14px; background: rgba(255,255,255,.12); color: #fff; border: 0; font-size: 22px; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; }
    @media (max-width: 640px) { .nav-bar { padding: 14px 16px; } .wrap { padding: 0 12px 50px; } .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); } }
  </style>
</head>
<body>
  <a href="#galMain" class="skip-link">Přeskočit na obsah</a>
  <div class="bg"></div>
  <div class="stars" id="stars"></div>
  <div class="nav-bar">
    <a href="/" class="back-btn">← Zpět na vesmír</a>
    <a href="/" class="nav-title">Moje diagnóza, můj vesmír</a>
  </div>
  <div class="page-header">
    <h1 class="page-title">🖼️ Fotogalerie podle výletů</h1>
    <p class="page-subtitle" id="galSub">Fotky z článků pohromadě</p>
  </div>
  <main class="wrap" id="galMain" tabindex="-1">
    <div class="filters">
      <div id="sectionChips" role="group" aria-label="Sekce" style="display:contents"></div>
      <input type="search" id="albumSearch" placeholder="🔍 Hledat výlet nebo místo…" aria-label="Hledat výlet nebo místo">
    </div>
    <div id="albums"></div>
    <div class="empty" id="galEmpty" hidden>Nic tu neodpovídá.</div>
  </main>
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Prohlížeč fotek">
    <button class="lb-close" id="lbClose" aria-label="Zavřít">✕</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Předchozí">‹</button>
    <img id="lbImg" alt="">
    <button class="lb-btn lb-next" id="lbNext" aria-label="Další">›</button>
    <div class="lb-cap" id="lbCap"></div>
  </div>

  <script src="/shared.js?v=20261010"></script>
  <script src="/photo-stops.js?v=1"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async function () {
    if (typeof initStarfield === 'function') initStarfield(100);

    var all = [], sectionNames = {};
    try {
      var rs = await Promise.all([fetch('/api/articles/list'), fetch('/api/sections/list').catch(function () { return null; })]);
      var data = await rs[0].json();
      all = (Array.isArray(data) ? data : []).filter(function (a) { return a && a.published !== false; });
      if (rs[1] && rs[1].ok) { (await rs[1].json() || []).forEach(function (s) { if (s && s.id) sectionNames[s.id] = s.name; }); }
    } catch (e) { console.error(e); }
    var FALLBACK = { travel: 'Cestování', photo: 'Fotografování', projects: 'Projekty' };

    // Alba = články, které mají aspoň jednu fotku; nejnovější nahoře.
    var albums = all.map(function (a) { return { a: a, imgs: PhotoStops.allImages(a) }; })
      .filter(function (x) { return x.imgs.length; })
      .sort(function (x, y) { return String(y.a.date || y.a.created).localeCompare(String(x.a.date || x.a.created)); });

    var activeSection = '', query = '';
    var flat = []; // pořadí fotek pro prohlížeč

    function secName(id) { return sectionNames[id] || FALLBACK[id] || id; }
    function renderChips() {
      var ids = []; albums.forEach(function (x) { if (x.a.sectionId && ids.indexOf(x.a.sectionId) === -1) ids.push(x.a.sectionId); });
      var chips = [{ id: '', label: 'Vše' }].concat(ids.map(function (id) { return { id: id, label: secName(id) }; }));
      var box = document.getElementById('sectionChips');
      box.innerHTML = chips.map(function (c, i) { return '<button type="button" class="chip" data-i="' + i + '" aria-pressed="' + (c.id === activeSection) + '">' + escapeHtml(c.label) + '</button>'; }).join('');
      box.querySelectorAll('button').forEach(function (b) { b.onclick = function () { activeSection = chips[+b.dataset.i].id; renderChips(); renderAlbums(); }; });
    }

    function renderAlbums() {
      var q = PhotoStops.norm(query);
      var list = albums.filter(function (x) {
        if (activeSection && x.a.sectionId !== activeSection) return false;
        if (!q) return true;
        return PhotoStops.norm((x.a.title || '') + ' ' + (x.a.place || '')).indexOf(q) !== -1;
      });
      flat = [];
      var total = 0;
      document.getElementById('albums').innerHTML = list.map(function (x) {
        var a = x.a;
        total += x.imgs.length;
        var thumbs = x.imgs.map(function (u) {
          var idx = flat.length; flat.push({ url: u, cap: (a.title || '') + (a.place ? ' · ' + a.place : '') });
          return '<button type="button" data-i="' + idx + '" aria-label="Otevřít fotku z článku ' + escapeHtml(a.title || '') + '"><img loading="lazy" alt="" ' + thumbImgAttrs(u) + '></button>';
        }).join('');
        return '<section class="album"><div class="album-head"><h2 class="album-title"><a href="/article?id=' + encodeURIComponent(a.id) + '">' + escapeHtml(a.title || 'Bez názvu') + '</a></h2>' +
          '<span class="album-meta">' + escapeHtml([a.place, formatDate(a.date || a.created), x.imgs.length + ' fotek'].filter(Boolean).join(' · ')) + '</span></div>' +
          '<div class="grid">' + thumbs + '</div></section>';
      }).join('');
      document.getElementById('galEmpty').hidden = list.length > 0;
      document.getElementById('galSub').textContent = list.length ? (total + ' fotek ve ' + list.length + ' albech') : 'Fotky z článků pohromadě';
      document.querySelectorAll('#albums .grid button').forEach(function (b) { b.onclick = function () { openLb(+b.dataset.i); }; });
    }

    // Jednoduchý prohlížeč fotek (šipky, Esc, tlačítka).
    var lb = document.getElementById('lb'), cur = 0;
    function show(i) {
      if (!flat.length) return;
      cur = (i + flat.length) % flat.length;
      document.getElementById('lbImg').src = flat[cur].url;
      document.getElementById('lbCap').textContent = flat[cur].cap + '  (' + (cur + 1) + '/' + flat.length + ')';
    }
    function openLb(i) { lb.classList.add('open'); document.body.style.overflow = 'hidden'; show(i); document.getElementById('lbClose').focus(); }
    function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; document.getElementById('lbImg').src = ''; }
    document.getElementById('lbClose').onclick = closeLb;
    document.getElementById('lbPrev').onclick = function () { show(cur - 1); };
    document.getElementById('lbNext').onclick = function () { show(cur + 1); };
    lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', function (e) {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === 'ArrowRight') show(cur + 1);
    });

    document.getElementById('albumSearch').addEventListener('input', function (e) { query = e.target.value; renderAlbums(); });

    if (!albums.length) { document.getElementById('galEmpty').hidden = false; document.getElementById('galEmpty').textContent = 'Zatím tu nejsou žádné fotky.'; return; }
    renderChips();
    renderAlbums();
  });
  </script>
</body>
</html>
