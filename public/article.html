<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Článek | Moje diagnóza, můj vesmír</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000;
      color: #e2e8f0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      line-height: 1.7;
    }
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(circle at 50% 20%, #0a0a1a, #000 80%),
        radial-gradient(circle at 80% 80%, rgba(60,20,100,0.3), transparent 60%),
        radial-gradient(circle at 20% 70%, rgba(0,60,120,0.25), transparent 60%);
      background-blend-mode: screen;
    }
    .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0; animation: twinkle 4s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: 0.1; transform: scale(0.5); } 50% { opacity: 0.9; transform: scale(1); } }
    
    .wrap { position: relative; z-index: 10; max-width: 860px; margin: 0 auto; padding: 40px 20px 60px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: #ffcc66; text-decoration: none; font-size: 14px; font-weight: 500;
      margin-bottom: 24px; padding: 10px 20px;
      background: rgba(15,23,42,0.7); border: 1px solid rgba(255,102,0,0.3);
      border-radius: 30px; backdrop-filter: blur(10px); transition: all 0.3s;
    }
    .back-btn:hover { background: rgba(255,102,0,0.2); border-color: #ff6600; transform: translateX(-4px); }
    
    article {
      background: rgba(15,23,42,0.9); backdrop-filter: blur(16px);
      border: 1px solid #334155; border-radius: 16px; padding: 48px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .loading, .error { text-align: center; padding: 80px 20px; color: #94a3b8; font-size: 16px; }
    .error { color: #ef4444; }
    
    .breadcrumb { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 12px; color: #64748b; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 1px; }
    .breadcrumb a { color: #ffcc66; text-decoration: none; }
    .breadcrumb a:hover { color: #ff6600; }
    .breadcrumb span { color: #475569; }
    
    .article-title { font-size: clamp(28px, 5vw, 44px); font-weight: 800; color: #ffcc66; line-height: 1.15; margin-bottom: 20px; text-shadow: 0 2px 16px rgba(0,0,0,0.8); }
    .article-meta { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; color: #94a3b8; font-size: 14px; margin-bottom: 40px; padding-bottom: 28px; border-bottom: 1px solid #334155; }
    
    .article-content { font-size: 17px; line-height: 1.9; color: #e2e8f0; }
    .article-content p { margin-bottom: 1.3em; }
    .article-content h2, .article-content h3 { color: #ffcc66; margin: 1.8em 0 0.6em; line-height: 1.3; }
    .article-content h2 { font-size: 26px; border-bottom: 1px solid rgba(255,102,0,0.25); padding-bottom: 10px; }
    .article-content h3 { font-size: 21px; color: #ffb366; }
    .article-content a { color: #60a5fa; text-decoration: underline; }
    .article-content blockquote { border-left: 4px solid #ff6600; margin: 1.6em 0; padding: 1.2em 1.6em; background: rgba(255,102,0,0.06); border-radius: 0 10px 10px 0; font-style: italic; color: #cbd5e1; }
    .article-content img { max-width: 100%; height: auto; border-radius: 12px; margin: 1.8em auto; display: block; cursor: zoom-in; border: 1px solid #334155; transition: transform 0.3s, box-shadow 0.3s; }
    .article-content img:hover { transform: scale(1.015); box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
    
    .article-footer { margin-top: 50px; padding-top: 30px; border-top: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .share-row { display: flex; gap: 10px; align-items: center; }
    .share-row span { color: #64748b; font-size: 13px; }
    .share-btn-small { padding: 6px 14px; border-radius: 20px; font-size: 13px; text-decoration: none; color: #ffcc66; background: rgba(255,102,0,0.1); border: 1px solid rgba(255,102,0,0.3); }
    .share-btn-small:hover { background: rgba(255,102,0,0.25); }
    .share-btn-small.wa { color: #25d366; border-color: rgba(37,211,102,0.3); }
    
    .lightbox { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; cursor: zoom-out; padding: 20px; }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 8px; cursor: default; }
    .lightbox-close { position: absolute; top: 20px; right: 30px; color: #ffcc66; font-size: 36px; cursor: pointer; background: none; border: none; }
    
    @media (max-width: 640px) {
      article { padding: 28px 20px; }
      .article-content { font-size: 16px; }
      .article-footer { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="stars" id="stars"></div>

  <div class="wrap">
    <a href="/" class="back-btn">← Zpět na hlavní stránku</a>
    <article id="articleContainer">
      <div class="loading">Načítání článku...</div>
    </article>
  </div>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="event.stopPropagation(); closeLightbox()">×</button>
    <img id="lightboxImg" src="" alt="" onclick="event.stopPropagation()">
  </div>

  <script>
    /* Hvězdy — až PO načtení DOM */
    document.addEventListener('DOMContentLoaded', () => {
      const box = document.getElementById('stars');
      if (box) {
        for (let i = 0; i < 150; i++) {
          const s = document.createElement('div');
          s.className = 'star';
          s.style.left = Math.random() * 100 + '%';
          s.style.top = Math.random() * 100 + '%';
          s.style.animationDelay = (Math.random() * 5) + 's';
          s.style.animationDuration = (3 + Math.random() * 4) + 's';
          box.appendChild(s);
        }
      }
      loadArticle();
    });

    function escapeHtml(t) {
      if (!t) return '';
      return String(t)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadArticle() {
      const path = window.location.pathname.replace('/article/', '').replace(/\/$/, '');
      const container = document.getElementById('articleContainer');
      if (!path) { container.innerHTML = '<div class="error">Chybí článek.</div>'; return; }

      try {
        let r = await fetch('/api/articles/get?slug=' + encodeURIComponent(path));
        if (!r.ok) r = await fetch('/api/articles/get?id=' + encodeURIComponent(path));
        if (!r.ok) throw new Error('Nenalezeno');
        const a = await r.json();

        document.title = (a.title ? a.title + ' | ' : '') + 'Moje diagnóza, můj vesmír';

        const dateStr = a.date ? new Date(a.date).toLocaleDateString('cs', {day:'numeric', month:'long', year:'numeric'}) : '';

        container.innerHTML = `
          <div class="breadcrumb">
            <a href="/">Domů</a>
            <span>/</span>
            <span style="color:#ffcc66">${escapeHtml(a.section || a.sectionId || '')}</span>
            ${a.subsection ? `<span>/</span><span>${escapeHtml(a.subsection)}</span>` : ''}
          </div>
          <h1 class="article-title">${escapeHtml(a.title)}</h1>
          <div class="article-meta">
            ${dateStr ? `<span>📅 ${dateStr}</span>` : ''}
            ${a.place ? `<span>📍 ${escapeHtml(a.place)}</span>` : ''}
          </div>
          <div class="article-content" id="articleContent">${a.content || '<p><em>Prázdný obsah</em></p>'}</div>
          <div class="article-footer">
            <a href="/" class="back-btn" style="margin:0">← Zpět</a>
            <div class="share-row">
              <span>Sdílet:</span>
              <a class="share-btn-small wa" href="https://wa.me/?text=${encodeURIComponent(a.title + ' - ' + window.location.href)}" target="_blank" rel="noopener">WhatsApp</a>
            </div>
          </div>
        `;

        document.querySelectorAll('.article-content img').forEach(img => {
          img.addEventListener('click', () => openLightbox(img.src));
        });
      } catch (e) {
        container.innerHTML = '<div class="error">Článek se nepodařilo načíst.<br><a href="/" class="back-btn" style="margin-top:16px">← Zpět na hlavní stránku</a></div>';
      }
    }

    function openLightbox(src) {
      const lb = document.getElementById('lightbox');
      document.getElementById('lightboxImg').src = src;
      lb.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  </script>
</body>
</html>
