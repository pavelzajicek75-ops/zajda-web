<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Článek — Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .nav-bar { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--panel-solid); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,122,69,0.35); color: var(--parchment); padding: 10px 22px;
      border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none;
      transition: all 0.3s; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .back-btn:hover { border-color: var(--ember); transform: translateX(-3px); background: rgba(255,122,69,0.18); }
    .nav-title {
      font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.3px;
      background: linear-gradient(90deg, var(--ember), var(--nova));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-decoration: none;
      filter: drop-shadow(0 0 12px rgba(255,122,69,0.25));
    }
    .nav-title:hover { filter: drop-shadow(0 0 18px rgba(47,230,201,0.4)) brightness(1.15); }

    .article-container { position: relative; z-index: 10; max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px 40px 80px; }
    .article-loading { text-align: center; padding: 80px 20px; color: var(--mist-dim); font-size: 18px; }
    .article-loading .spinner {
      display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(255,122,69,0.2);
      border-top-color: var(--ember); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .article-notfound { text-align: center; padding: 80px 20px; }
    .article-notfound h2 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; color: var(--ember); margin-bottom: 12px; }
    .article-notfound p { color: var(--mist); font-size: 16px; }

    .article-header { text-align: center; margin-bottom: 32px; }
    .article-title {
      font-family: 'Space Grotesk', sans-serif; font-size: clamp(26px, 4vw, 42px); font-weight: 700;
      color: var(--parchment); text-shadow: 0 0 30px rgba(255,122,69,0.3); line-height: 1.3; margin-bottom: 12px;
    }
    .article-meta { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
    .article-meta .meta-item { display: inline-flex; align-items: center; gap: 6px; color: var(--mist); font-size: 14px; }
    .article-meta .meta-item::before { content: '◆'; color: var(--ember); font-size: 10px; }
    .article-meta .meta-item:first-child::before { display: none; }
    .article-meta .meta-badge {
      background: rgba(47,230,201,0.12); border: 1px solid rgba(47,230,201,0.3); color: var(--nova);
      padding: 3px 12px; border-radius: 20px; font-size: 13px; font-weight: 500;
    }
    .article-divider { width: 60%; max-width: 300px; height: 1px; margin: 0 auto 32px; background: linear-gradient(to right, transparent, var(--ember-dim), transparent); }

    .article-body { color: #dcdce8; font-size: 17px; line-height: 1.8; }
    .article-body p { margin-bottom: 18px; }
    .article-body h2 {
      font-family: 'Space Grotesk', sans-serif; color: var(--parchment); font-size: 24px; font-weight: 600;
      margin: 28px 0 14px; text-shadow: 0 0 15px rgba(255,122,69,0.25);
    }
    .article-body h3 { font-family: 'Space Grotesk', sans-serif; color: var(--nova); font-size: 20px; font-weight: 600; margin: 24px 0 12px; }
    .article-body img {
      max-width: 100%; height: auto; border-radius: 12px; margin: 20px 0; cursor: zoom-in;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6); transition: transform 0.3s, box-shadow 0.3s;
    }
    .article-body img:hover { transform: scale(1.02); box-shadow: 0 6px 30px rgba(255,122,69,0.3); }

    .photo-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
      margin: 24px 0;
    }
    .photo-grid img {
      margin: 0; width: 100%; height: 240px; object-fit: cover;
    }
    @media (max-width: 900px) { .photo-grid { grid-template-columns: repeat(2, 1fr); } .photo-grid img { height: 200px; } }
    @media (max-width: 520px) { .photo-grid { grid-template-columns: 1fr; } .photo-grid img { height: auto; } }

    .article-body a { color: var(--ember); text-decoration: none; border-bottom: 1px solid var(--ember-dim); transition: all 0.2s; }
    .article-body a:hover { color: var(--nova); border-bottom-color: var(--nova); text-shadow: 0 0 10px rgba(47,230,201,0.4); }
    .article-body ul, .article-body ol { margin: 14px 0 18px 24px; }
    .article-body li { margin-bottom: 8px; }
    .article-body blockquote {
      border-left: 3px solid var(--ember); padding: 12px 20px; margin: 20px 0;
      background: rgba(255,122,69,0.05); border-radius: 0 8px 8px 0; color: var(--mist); font-style: italic;
    }
    .article-body code { background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 4px; font-size: 15px; color: var(--nova); }
    .article-body pre {
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,122,69,0.2); border-radius: 8px;
      padding: 16px; overflow-x: auto; margin: 16px 0;
    }
    .article-body pre code { background: none; padding: 0; }
    .article-body hr { border: none; height: 1px; background: linear-gradient(to right, transparent, rgba(255,122,69,0.3), transparent); margin: 28px 0; }
    .article-body table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    .article-body th, .article-body td { border: 1px solid rgba(255,122,69,0.2); padding: 10px 14px; text-align: left; }
    .article-body th { background: rgba(255,122,69,0.1); color: var(--parchment); }

    .article-footer {
      margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(140,150,255,0.14);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }
    .share-bar-inline { display: flex; gap: 10px; flex-wrap: wrap; }
    .share-btn {
      background: var(--panel-solid); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,122,69,0.3); color: var(--parchment); padding: 9px 18px;
      border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.3s;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    }
    .share-btn:hover { border-color: var(--ember); background: rgba(255,122,69,0.18); transform: translateY(-2px); }
    .share-btn.wa { color: #4fe0a3; border-color: rgba(79,224,163,0.4); }
    .share-btn.wa:hover { background: rgba(79,224,163,0.18); border-color: #4fe0a3; }

    /* Lightbox s listováním */
    .lightbox-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(4,4,10,0.94); display: none; align-items: center; justify-content: center; cursor: zoom-out; }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img { max-width: 88vw; max-height: 88vh; border-radius: 8px; box-shadow: 0 0 50px rgba(255,122,69,0.25); cursor: default; user-select: none; }
    .lightbox-overlay:fullscreen { background: #000; }
    .lightbox-overlay:fullscreen img { max-width: 100vw; max-height: 100vh; border-radius: 0; }
    .lightbox-overlay:-webkit-full-screen { background: #000; }
    .lightbox-overlay:-webkit-full-screen img { max-width: 100vw; max-height: 100vh; border-radius: 0; }
    .lightbox-close {
      position: absolute; top: 18px; right: 24px; color: #fff; font-size: 34px; line-height: 1; cursor: pointer;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); border-radius: 50%; width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .lightbox-close:hover { background: rgba(255,122,69,0.35); border-color: var(--ember); }
    .lightbox-fullscreen {
      position: absolute; top: 18px; right: 76px; color: #fff; font-size: 20px; line-height: 1; cursor: pointer;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); border-radius: 50%; width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .lightbox-fullscreen:hover { background: rgba(47,230,201,0.3); border-color: var(--nova); }
    .lightbox-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 28px; cursor: pointer;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); border-radius: 50%; width: 54px; height: 54px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s; user-select: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .lightbox-arrow:hover { background: rgba(255,122,69,0.35); border-color: var(--ember); transform: translateY(-50%) scale(1.08); }
    .lightbox-arrow.prev { left: 22px; }
    .lightbox-arrow.next { right: 22px; }
    .lightbox-counter {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 14px; font-weight: 500;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3); padding: 7px 18px; border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    @media (prefers-reduced-motion: reduce) {
      .back-btn, .share-btn, .article-body img { transition: none !important; }
    }

    @media (max-width: 700px) {
      .nav-bar { padding: 16px 20px; } .article-container { padding: 16px 16px 60px; } .article-body { font-size: 16px; } .article-footer { flex-direction: column; align-items: stretch; } .share-bar-inline { justify-content: center; }
      .lightbox-arrow { width: 42px; height: 42px; font-size: 22px; }
      .lightbox-arrow.prev { left: 6px; } .lightbox-arrow.next { right: 6px; }
      .lightbox-close { width: 38px; height: 38px; font-size: 26px; top: 10px; right: 10px; }
      .lightbox-fullscreen { width: 36px; height: 36px; font-size: 17px; top: 10px; right: 56px; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="stars" id="stars"></div>

  <div class="lightbox-overlay" id="lightboxOverlay">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <span class="lightbox-fullscreen" id="lightboxFullscreen" title="Celá obrazovka">⛶</span>
    <span class="lightbox-arrow prev" id="lightboxPrev">&#10094;</span>
    <img id="lightboxImg" src="" alt="">
    <span class="lightbox-arrow next" id="lightboxNext">&#10095;</span>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>

  <div class="nav-bar">
    <a href="/" class="back-btn">← Zpět na vesmír</a>
    <a href="/" class="nav-title">Moje diagnóza, můj vesmír</a>
  </div>
  <div class="article-container" id="articleContainer">
    <div class="article-loading" id="articleLoading">
      <div class="spinner"></div>
      <div>Načítání článku…</div>
    </div>
  </div>
  <script src="/shared.js"></script>
  <script>
  // --- Lightbox s galerií ---
  var galleryImages = [];
  var galleryIndex = 0;

  function isImageOnlyNode(node) {
    if (!node) return false;
    if (node.nodeType === 3) return node.textContent.trim() === '';
    if (node.nodeType !== 1) return false;
    if (node.tagName === 'IMG') return true;
    if (node.tagName === 'P' || node.tagName === 'DIV') {
      var kids = Array.prototype.slice.call(node.childNodes).filter(function(n) {
        return !(n.nodeType === 3 && n.textContent.trim() === '');
      });
      return kids.length === 1 && kids[0].nodeType === 1 && kids[0].tagName === 'IMG';
    }
    return false;
  }

  function extractImg(node) {
    if (node.tagName === 'IMG') return node;
    return node.querySelector('img');
  }

  function groupImages() {
    var body = document.getElementById('articleBody');
    if (!body) return;
    var children = Array.prototype.slice.call(body.childNodes);
    var run = [];

    function flushRun() {
      if (run.length >= 2) {
        var grid = document.createElement('div');
        grid.className = 'photo-grid';
        var refNode = run[0];
        refNode.parentNode.insertBefore(grid, refNode);
        run.forEach(function(node) {
          var img = extractImg(node);
          if (img) grid.appendChild(img);
          if (node !== img && node.parentNode) node.parentNode.removeChild(node);
        });
      }
      run = [];
    }

    for (var i = 0; i < children.length; i++) {
      var node = children[i];
      if (isImageOnlyNode(node)) {
        if (node.nodeType === 1) run.push(node);
      } else {
        flushRun();
      }
    }
    flushRun();
  }

  function buildGallery() {
    try { groupImages(); } catch (e) { console.error('groupImages selhalo:', e); }
    var body = document.getElementById('articleBody');
    galleryImages = body ? Array.prototype.slice.call(body.querySelectorAll('img')) : [];
    galleryImages.forEach(function(img, i) {
      img.addEventListener('click', function() { openLightbox(i); });
    });
  }

  function updateLightboxImage() {
    var img = galleryImages[galleryIndex];
    if (!img) return;
    var lbImg = document.getElementById('lightboxImg');
    lbImg.src = img.getAttribute('src');
    lbImg.alt = img.getAttribute('alt') || '';
    var counter = document.getElementById('lightboxCounter');
    var multi = galleryImages.length > 1;
    document.getElementById('lightboxPrev').style.display = multi ? 'flex' : 'none';
    document.getElementById('lightboxNext').style.display = multi ? 'flex' : 'none';
    counter.style.display = multi ? 'block' : 'none';
    counter.textContent = (galleryIndex + 1) + ' / ' + galleryImages.length;
  }

  function openLightbox(index) {
    if (!galleryImages.length) return;
    galleryIndex = ((index % galleryImages.length) + galleryImages.length) % galleryImages.length;
    updateLightboxImage();
    document.getElementById('lightboxOverlay').classList.add('open');
  }

  function closeLightbox() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
    document.getElementById('lightboxOverlay').classList.remove('open');
  }

  function toggleFullscreen() {
    var overlay = document.getElementById('lightboxOverlay');
    var isFull = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFull) {
      if (overlay.requestFullscreen) overlay.requestFullscreen();
      else if (overlay.webkitRequestFullscreen) overlay.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  function updateFullscreenIcon() {
    var btn = document.getElementById('lightboxFullscreen');
    if (!btn) return;
    var isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
    btn.innerHTML = isFull ? '⤫' : '⛶';
    btn.title = isFull ? 'Ukončit celou obrazovku' : 'Celá obrazovka';
  }

  function showPrevImage() {
    if (!galleryImages.length) return;
    galleryIndex = (galleryIndex - 1 + galleryImages.length) % galleryImages.length;
    updateLightboxImage();
  }

  function showNextImage() {
    if (!galleryImages.length) return;
    galleryIndex = (galleryIndex + 1) % galleryImages.length;
    updateLightboxImage();
  }

  document.addEventListener('DOMContentLoaded', function() {
    var overlay = document.getElementById('lightboxOverlay');
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeLightbox();
    });
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrev').addEventListener('click', function(e) { e.stopPropagation(); showPrevImage(); });
    document.getElementById('lightboxNext').addEventListener('click', function(e) { e.stopPropagation(); showNextImage(); });
    document.getElementById('lightboxFullscreen').addEventListener('click', function(e) { e.stopPropagation(); toggleFullscreen(); });
    document.getElementById('lightboxImg').addEventListener('dblclick', function(e) { e.stopPropagation(); toggleFullscreen(); });
    document.addEventListener('fullscreenchange', updateFullscreenIcon);
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

    document.addEventListener('keydown', function(e) {
      if (!overlay.classList.contains('open')) return;
      if (e.key === 'Escape') {
        if (document.fullscreenElement || document.webkitFullscreenElement) return;
        closeLightbox();
      }
      else if (e.key === 'ArrowLeft') showPrevImage();
      else if (e.key === 'ArrowRight') showNextImage();
      else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    });
  });

  function getArticleId() {
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    if (id) return decodeURIComponent(id);
    var parts = window.location.pathname.split('/').filter(Boolean);
    if (parts.length >= 2 && parts[0] === 'article') return decodeURIComponent(parts[1]);
    return null;
  }

  var SECTION_NAMES = {
    'travel': 'Cestování',
    'photo': 'Fotografování',
    'projects': 'Projekty',
    'about': 'O Zajdovi'
  };

  document.addEventListener('DOMContentLoaded', async function() {
    initStarfield(150);

    var container = document.getElementById('articleContainer');
    var articleId = getArticleId();

    if (!articleId) {
      container.innerHTML = '<div class="article-notfound"><h2>Chybí ID článku</h2><p>Zkus se vrátit na <a href="/" style="color:var(--ember)">hlavní stránku</a>.</p></div>';
      return;
    }

    try {
      var r = await fetch('/api/articles/list');
      if (!r.ok) throw new Error('API chyba');
      var allArticles = await r.json();
      if (!Array.isArray(allArticles)) throw new Error('Neplatná data');
      var article = allArticles.find(function(a) {
        // Bezpečnostní pojistka NAVÍC (nezávisle na API) — skrytý/
        // nepublikovaný koncept (a.published === false) se nemá dát
        // otevřít ani přímým odkazem, natožpak se objevit v seznamu.
        return a.id != null && String(a.id) === String(articleId) && a.published !== false;
      });
      if (!article) {
        container.innerHTML = '<div class="article-notfound"><h2>Článek nenalezen</h2><p>Tento článek neexistuje nebo byl smazán.</p></div>';
        return;
      }
      try {
        renderArticle(article);
      } catch (renderErr) {
        console.error('Chyba renderování článku:', renderErr);
        container.innerHTML = '<div class="article-notfound"><h2>Chyba zobrazení</h2><p>Článek se podařilo načíst, ale nastala chyba při jeho zobrazení.</p></div>';
      }
    } catch(e) {
      container.innerHTML = '<div class="article-notfound"><h2>Chyba načítání</h2><p>Nepodařilo se načíst článek. Zkus to prosím později.</p></div>';
    }
  });

  function renderArticle(article) {
    var container = document.getElementById('articleContainer');
    var title = article.title || 'Bez názvu';
    var content = article.content || '';
    var date = article.date || article.created || '';
    var dateStr = '';
    if (date) { try { dateStr = new Date(date).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' }); } catch(e) {} }
    var sectionName = SECTION_NAMES[article.sectionId] || article.sectionId || '';

    // Titulek karty prohlížeče (dřív zůstával navždy jen generický
    // "Článek — Moje diagnóza, můj vesmír" bez ohledu na obsah). Pro
    // scrapery sociálních sítí (WhatsApp/FB/X) tohle nestačí — ty JS
    // nespouští, viz functions/article.js, který vkládá meta tagy
    // ještě před odesláním HTML.
    document.title = title + ' — Moje diagnóza, můj vesmír';

    var html = '';
    html += '<div class="article-header">';
    html += '<h1 class="article-title">' + escapeHtml(title) + '</h1>';
    html += '<div class="article-meta">';
    if (sectionName) html += '<span class="meta-badge">' + escapeHtml(sectionName) + '</span>';
    if (dateStr) html += '<span class="meta-item">' + escapeHtml(dateStr) + '</span>';
    html += '</div></div>';
    html += '<div class="article-divider"></div>';
    html += '<div class="article-body" id="articleBody">' + content + '</div>';

    var shareUrl = window.location.href;
    var shareText = title + ' — Moje diagnóza, můj vesmír';
    html += '<div class="article-footer">';
    html += '<div class="share-bar-inline">';
    html += '<a class="share-btn wa" href="https://wa.me/?text=' + encodeURIComponent(shareText + ' ' + shareUrl) + '" target="_blank" rel="noopener">WhatsApp</a>';
    html += '<a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl) + '" target="_blank" rel="noopener">Facebook</a>';
    html += '<a class="share-btn" href="https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText) + '&url=' + encodeURIComponent(shareUrl) + '" target="_blank" rel="noopener">X / Twitter</a>';
    html += '</div>';
    html += '</div>';

    container.innerHTML = html;

    buildGallery();
  }
  </script>
</body>
</html>
