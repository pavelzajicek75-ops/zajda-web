<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Článek — Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ★ ZMĚNA: self-hosted fonty místo Google Fonts CDN — viz /fonts.css -->
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="/vendor/leaflet.markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="/vendor/leaflet.markercluster/MarkerCluster.Default.css">
  <script src="/vendor/leaflet.markercluster/leaflet.markercluster.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .nav-bar { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; }

    /* === PROGRESS BAR ČTENÍ === */
    .reading-progress {
      position: fixed; top: 0; left: 0; height: 3px; width: 0%; z-index: 10001;
      background: linear-gradient(90deg, var(--ember), var(--nova));
      box-shadow: 0 0 10px rgba(255,122,69,0.5);
      transition: width 0.1s ease-out;
    }
    @media (prefers-reduced-motion: reduce) { .reading-progress { transition: none; } }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--panel-solid); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,122,69,0.35); color: var(--parchment); padding: 10px 22px;
      border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none;
      transition: all 0.3s; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .back-btn:hover { border-color: var(--ember); transform: translateX(-3px); background: rgba(255,122,69,0.18); }
    .nav-title {
      font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.3px;
      background: linear-gradient(90deg, var(--ember), var(--nova));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-decoration: none;
      filter: drop-shadow(0 0 12px rgba(255,122,69,0.25));
    }
    .nav-title:hover { filter: drop-shadow(0 0 18px rgba(47,230,201,0.4)) brightness(1.15); }

    .article-container { position: relative; z-index: 10; max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px 40px 80px; }
    .article-loading { text-align: center; padding: 80px 20px; color: var(--mist-dim); font-size: 15px; }
    .loading-constellation { width: 120px; height: 60px; margin: 0 auto 18px; position: relative; }
    .loading-constellation .lc-dot {
      position: absolute; width: 8px; height: 8px; border-radius: 50%;
      background: var(--ember); box-shadow: 0 0 10px var(--ember-dim);
      animation: lc-pulse 1.6s ease-in-out infinite;
    }
    .loading-constellation .lc-dot:nth-child(1) { left: 4px; top: 26px; animation-delay: 0s; background: var(--ember); box-shadow: 0 0 10px var(--ember-dim); }
    .loading-constellation .lc-dot:nth-child(2) { left: 56px; top: 4px; animation-delay: 0.3s; background: var(--nova); box-shadow: 0 0 10px var(--nova-dim); }
    .loading-constellation .lc-dot:nth-child(3) { left: 108px; top: 26px; animation-delay: 0.6s; background: var(--aurora); box-shadow: 0 0 10px var(--aurora-dim); }
    .loading-constellation svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .loading-constellation line {
      stroke: var(--panel-border-hover); stroke-width: 1; stroke-dasharray: 4 3;
      animation: lc-line 1.6s ease-in-out infinite;
    }
    @keyframes lc-pulse { 0%, 100% { opacity: 0.35; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes lc-line { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.6; } }
    @media (prefers-reduced-motion: reduce) {
      .loading-constellation .lc-dot, .loading-constellation line { animation: none; opacity: 0.7; }
    }
    .article-notfound { text-align: center; padding: 80px 20px; }
    .article-notfound h2 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; color: var(--ember); margin-bottom: 12px; }
    .article-notfound p { color: var(--mist); font-size: 16px; }

    .article-hero {
      width: 100%; max-height: 440px; object-fit: cover; border-radius: 18px;
      margin: 0 0 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: block;
    }
    @media (max-width: 700px) { .article-hero { max-height: 260px; border-radius: 12px; } }

    .article-header { text-align: center; margin-bottom: 32px; }
    .article-title {
      font-family: 'Space Grotesk', sans-serif; font-size: clamp(26px, 4vw, 42px); font-weight: 700;
      color: var(--parchment); text-shadow: 0 0 30px rgba(255,122,69,0.3); line-height: 1.3; margin-bottom: 12px;
    }
    .article-meta { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
    .article-meta .meta-item { display: inline-flex; align-items: center; gap: 6px; color: var(--mist); font-size: 14px; }
    .article-meta .meta-item::before { content: '◆'; color: var(--ember); font-size: 10px; }
    .article-meta .meta-item:first-child::before { display: none; }
    .article-meta .meta-badge {
      background: rgba(47,230,201,0.12); border: 1px solid rgba(47,230,201,0.3); color: var(--nova);
      padding: 3px 12px; border-radius: 20px; font-size: 13px; font-weight: 500;
    }
    .article-divider { width: 60%; max-width: 300px; height: 1px; margin: 0 auto 32px; background: linear-gradient(to right, transparent, var(--ember-dim), transparent); }

    /* === MINIATURA MAPY (jen u článků s vyplněnými souřadnicemi) === */
    .article-mini-map-wrap {
      max-width: 480px; margin: 0 auto 32px; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--panel-border); box-shadow: 0 14px 34px rgba(0,0,0,0.4);
      position: relative;
    }
    .article-mini-map {
      width: 100%; height: 180px; background: #0a0a16; cursor: pointer;
    }
    .article-mini-map-label {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px; background: var(--panel-solid); font-size: 13px;
    }
    .article-mini-map-label span { color: var(--mist); }
    .article-mini-map-label a {
      color: var(--nova); text-decoration: none; font-weight: 600; font-size: 12.5px;
      white-space: nowrap; border-bottom: 1px solid transparent;
    }
    .article-mini-map-label a:hover { border-bottom-color: var(--nova); }
    .article-mini-map .star-pin {
      width: 16px; height: 16px; border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, var(--ember) 45%, transparent 75%);
      box-shadow: 0 0 10px var(--ember), 0 0 22px var(--ember-dim);
      border: 2px solid rgba(255,255,255,0.85);
    }
    .article-mini-map .leaflet-control-zoom,
    .article-mini-map .leaflet-control-attribution { display: none; }

    /* === PLNÝ MAPOVÝ MODAL (otevře se z miniatury, beze změny stránky) ===
       Stejný vzhled/chování jako modal na homepage (index.html) — jen
       zkopírovaný sem, aby se dal otevřít i z článku bez navigace pryč. */
    .travel-map-modal-overlay {
      position: fixed; inset: 0; z-index: 8000; background: rgba(4,4,10,0.85);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .travel-map-modal-overlay.open { display: flex; }
    .travel-map-modal-box {
      position: relative;
      width: 100%; max-width: 960px; max-height: 88vh;
      background: var(--void-2); border: 1px solid var(--panel-border);
      border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .travel-map-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 1.4rem; border-bottom: 1px solid rgba(140,150,255,0.14); flex-shrink: 0;
    }
    .travel-map-modal-header h2 {
      font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600; color: var(--parchment);
    }
    .travel-map-modal-close {
      background: rgba(140,150,255,0.1); border: 1px solid var(--panel-border); color: var(--parchment);
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
    }
    .travel-map-modal-close:hover { border-color: var(--panel-border-hover); background: rgba(255,122,69,0.12); }
    #travelMapModalMap { width: 100%; height: 60vh; min-height: 380px; background: #0a0a16; flex-shrink: 0; }
    .travel-map-modal-theme-toggle {
      position: absolute; top: 66px; right: 26px; z-index: 900;
      background: var(--panel-solid); border: 1px solid var(--panel-border);
      color: var(--parchment); width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 17px; box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: border-color 0.2s, background 0.2s;
    }
    .travel-map-modal-theme-toggle:hover, .travel-map-modal-theme-toggle:focus-visible {
      border-color: var(--panel-border-hover); background: rgba(255,122,69,0.18);
    }
    .travel-map-modal-legend {
      display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap;
      padding: 12px 16px; font-size: 12px; color: var(--mist-dim);
      border-top: 1px solid rgba(140,150,255,0.12); flex-shrink: 0;
    }
    .travel-map-modal-legend span.legend-item {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      padding: 3px 8px; border-radius: 20px; transition: background 0.2s, opacity 0.2s;
      user-select: none;
    }
    .travel-map-modal-legend span.legend-item:hover, .travel-map-modal-legend span.legend-item:focus-visible {
      background: rgba(140,150,255,0.1);
    }
    .travel-map-modal-legend span.legend-item.legend-off { opacity: 0.4; }
    .travel-map-modal-legend .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .travel-map-modal-stats {
      display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap;
      padding: 10px 16px; font-size: 12.5px; color: var(--parchment);
      border-bottom: 1px solid rgba(140,150,255,0.12); flex-shrink: 0;
    }
    .travel-map-modal-stats strong { color: var(--nova); font-weight: 700; }
    .travel-map-modal-play-btn {
      position: absolute; bottom: 14px; left: 14px; z-index: 900;
      background: var(--panel-solid); border: 1px solid var(--panel-border);
      color: var(--parchment); padding: 8px 14px; border-radius: 30px; cursor: pointer;
      font-size: 12.5px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: border-color 0.2s, background 0.2s; font-family: 'Inter', sans-serif;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .travel-map-modal-play-btn:hover, .travel-map-modal-play-btn:focus-visible {
      border-color: var(--panel-border-hover); background: rgba(255,122,69,0.18);
    }
    .travel-map-modal-play-btn:disabled { opacity: 0.6; cursor: default; }
    .travel-map-modal-empty {
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
      height: 60vh; min-height: 380px; text-align: center; padding: 20px; color: var(--mist);
    }
    .travel-map-modal-empty h3 { font-family: 'Space Grotesk', sans-serif; color: var(--parchment); font-size: 18px; }
    .travel-map-modal-empty p { max-width: 380px; font-size: 13.5px; line-height: 1.6; color: var(--mist-dim); }
    .travel-map-modal-box .leaflet-control-zoom a {
      background: var(--panel-solid) !important; color: var(--parchment) !important;
      border-color: var(--panel-border) !important;
    }
    .travel-map-modal-box .leaflet-control-zoom a:hover { background: rgba(255,122,69,0.25) !important; }
    .travel-map-modal-box .leaflet-control-attribution {
      background: rgba(8,8,15,0.75) !important; color: var(--mist-dim) !important;
    }
    .travel-map-modal-box .map-point-label {
      background: #14152a !important; border: 1px solid rgba(255,122,69,0.5) !important;
      border-radius: 8px !important; padding: 5px 10px !important;
      box-shadow: 0 6px 20px rgba(0,0,0,0.55); font-family: 'Inter', sans-serif; line-height: 1.35;
      pointer-events: none;
    }
    .travel-map-modal-box .map-point-label::before { display: none !important; }
    .travel-map-modal-box .map-label-title { display: block; font-size: 12.5px; font-weight: 700; color: #ffffff; white-space: nowrap; margin-bottom: 2px; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
    .travel-map-modal-box .map-label-meta { display: block; font-size: 10.5px; color: #d7d9ec; font-weight: 500; white-space: nowrap; }
    .travel-map-modal-box .map-cluster-icon {
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; color: #08080f; font-weight: 700; font-family: 'Space Grotesk', sans-serif;
      border: 2px solid rgba(255,255,255,0.85);
    }
    .travel-map-modal-box .star-pin {
      width: 16px; height: 16px; border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, var(--ember) 45%, transparent 75%);
      box-shadow: 0 0 10px var(--ember), 0 0 22px var(--ember-dim);
      border: 2px solid rgba(255,255,255,0.85);
      animation: pin-pulse 2.2s ease-in-out infinite;
      cursor: pointer;
    }
    @keyframes pin-pulse { 0%,100% { transform: scale(0.9); } 50% { transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { .travel-map-modal-box .star-pin { animation: none; } }
    @media (max-width: 700px) {
      #travelMapModalMap, .travel-map-modal-empty { height: 52vh; }
    }

    .article-body { color: #dcdce8; font-size: 17px; line-height: 1.8; }
    .article-body p { margin-bottom: 18px; }
    .article-body h2 {
      font-family: 'Space Grotesk', sans-serif; color: var(--parchment); font-size: 24px; font-weight: 600;
      margin: 28px 0 14px; text-shadow: 0 0 15px rgba(255,122,69,0.25);
    }
    .article-body h3 { font-family: 'Space Grotesk', sans-serif; color: var(--nova); font-size: 20px; font-weight: 600; margin: 24px 0 12px; }
    .article-body img {
      max-width: 100%; height: auto; border-radius: 12px; margin: 20px 0; cursor: zoom-in;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6); transition: transform 0.3s, box-shadow 0.3s;
    }
    .article-body img:hover { transform: scale(1.02); box-shadow: 0 6px 30px rgba(255,122,69,0.3); }

    .photo-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
      margin: 24px 0;
    }
    .photo-grid img {
      margin: 0; width: 100%; height: 240px; object-fit: cover;
    }
    @media (max-width: 900px) { .photo-grid { grid-template-columns: repeat(2, 1fr); } .photo-grid img { height: 200px; } }
    @media (max-width: 520px) { .photo-grid { grid-template-columns: 1fr; } .photo-grid img { height: auto; } }

    .article-body a { color: var(--ember); text-decoration: none; border-bottom: 1px solid var(--ember-dim); transition: all 0.2s; }
    .article-body a:hover { color: var(--nova); border-bottom-color: var(--nova); text-shadow: 0 0 10px rgba(47,230,201,0.4); }
    .article-body ul, .article-body ol { margin: 14px 0 18px 24px; }
    .article-body li { margin-bottom: 8px; }
    .article-body blockquote {
      border-left: 3px solid var(--ember); padding: 12px 20px; margin: 20px 0;
      background: rgba(255,122,69,0.05); border-radius: 0 8px 8px 0; color: var(--mist); font-style: italic;
    }
    .article-body code { background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 4px; font-size: 15px; color: var(--nova); }
    .article-body pre {
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,122,69,0.2); border-radius: 8px;
      padding: 16px; overflow-x: auto; margin: 16px 0;
    }
    .article-body pre code { background: none; padding: 0; }
    .article-body hr { border: none; height: 1px; background: linear-gradient(to right, transparent, rgba(255,122,69,0.3), transparent); margin: 28px 0; }
    .article-body table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    .article-body th, .article-body td { border: 1px solid rgba(255,122,69,0.2); padding: 10px 14px; text-align: left; }
    .article-body th { background: rgba(255,122,69,0.1); color: var(--parchment); }

    .article-footer {
      margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(140,150,255,0.14);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }
    .share-bar-inline { display: flex; gap: 10px; flex-wrap: wrap; }
    .share-btn {
      background: var(--panel-solid); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,122,69,0.3); color: var(--parchment); padding: 9px 18px;
      border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.3s;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    }
    .share-btn:hover { border-color: var(--ember); background: rgba(255,122,69,0.18); transform: translateY(-2px); }
    .share-btn.wa { color: #4fe0a3; border-color: rgba(79,224,163,0.4); }
    .share-btn.wa:hover { background: rgba(79,224,163,0.18); border-color: #4fe0a3; }
    .share-btn.copied { color: var(--nova); border-color: var(--nova); background: rgba(47,230,201,0.14); }

    .article-nav-links {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
      margin-top: 32px;
    }
    .article-nav-links.single { grid-template-columns: 1fr; }
    .article-nav-link {
      background: var(--panel-solid); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border); border-radius: 14px; padding: 16px 20px;
      text-decoration: none; color: var(--parchment); transition: all 0.25s;
      display: flex; flex-direction: column; gap: 4px;
    }
    .article-nav-link:hover { border-color: var(--panel-border-hover); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .article-nav-link.next { text-align: right; align-items: flex-end; }
    .article-nav-link .nav-hint { font-size: 11.5px; color: var(--mist-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .article-nav-link .nav-title-text { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; }
    @media (max-width: 640px) { .article-nav-links { grid-template-columns: 1fr; } }

    .related-section { margin-top: 40px; }
    .related-section h2 {
      font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600; color: var(--parchment);
      margin-bottom: 16px;
    }
    .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .related-card {
      background: var(--panel-solid); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border); border-radius: 14px; overflow: hidden;
      text-decoration: none; color: inherit; transition: all 0.25s; display: block;
    }
    .related-card:hover { border-color: var(--panel-border-hover); transform: translateY(-3px); box-shadow: 0 14px 34px rgba(0,0,0,0.4); }
    .related-card img { width: 100%; height: 130px; object-fit: cover; display: block; filter: saturate(0.95) brightness(0.94); transition: filter 0.3s; }
    .related-card:hover img { filter: saturate(1.15) brightness(1.05); }
    .related-card .related-body { padding: 12px 14px; }
    .related-card h3 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .related-card .related-date { font-size: 11.5px; color: var(--mist-dim); }

    /* Lightbox s listováním */
    .lightbox-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(4,4,10,0.94); display: none; align-items: center; justify-content: center; cursor: zoom-out; }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img { max-width: 88vw; max-height: 88vh; border-radius: 8px; box-shadow: 0 0 50px rgba(255,122,69,0.25); cursor: default; user-select: none; }
    .lightbox-overlay:fullscreen { background: #000; }
    .lightbox-overlay:fullscreen img { max-width: 100vw; max-height: 100vh; border-radius: 0; }
    .lightbox-overlay:-webkit-full-screen { background: #000; }
    .lightbox-overlay:-webkit-full-screen img { max-width: 100vw; max-height: 100vh; border-radius: 0; }
    .lightbox-close {
      position: absolute; top: 18px; right: 24px; color: #fff; font-size: 34px; line-height: 1; cursor: pointer;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); border-radius: 50%; width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .lightbox-close:hover { background: rgba(255,122,69,0.35); border-color: var(--ember); }
    .lightbox-fullscreen {
      position: absolute; top: 18px; right: 76px; color: #fff; font-size: 20px; line-height: 1; cursor: pointer;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); border-radius: 50%; width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .lightbox-fullscreen:hover { background: rgba(47,230,201,0.3); border-color: var(--nova); }
    .lightbox-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 28px; cursor: pointer;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); border-radius: 50%; width: 54px; height: 54px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s; user-select: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .lightbox-arrow:hover { background: rgba(255,122,69,0.35); border-color: var(--ember); transform: translateY(-50%) scale(1.08); }
    .lightbox-arrow.prev { left: 22px; }
    .lightbox-arrow.next { right: 22px; }
    .lightbox-counter {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 14px; font-weight: 500;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3); padding: 7px 18px; border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    @media (prefers-reduced-motion: reduce) {
      .back-btn, .share-btn, .article-body img { transition: none !important; }
    }

    @media (max-width: 700px) {
      .nav-bar { padding: 16px 20px; } .article-container { padding: 16px 16px 60px; } .article-body { font-size: 16px; } .article-footer { flex-direction: column; align-items: stretch; } .share-bar-inline { justify-content: center; }
      .lightbox-arrow { width: 42px; height: 42px; font-size: 22px; }
      .lightbox-arrow.prev { left: 6px; } .lightbox-arrow.next { right: 6px; }
      .lightbox-close { width: 38px; height: 38px; font-size: 26px; top: 10px; right: 10px; }
      .lightbox-fullscreen { width: 36px; height: 36px; font-size: 17px; top: 10px; right: 56px; }
    }

    /* === TISKOVÉ STYLY (nové) ===
       Bez hvězdiček, animací a panelů — čistý text a nadpisy na bílém
       podkladu, ať jde článek smysluplně vytisknout / uložit jako PDF. */
    @media print {
      .bg, .stars, .constellation-layer, .lightbox-overlay,
      .nav-bar, .reading-progress, .article-footer,
      .article-nav-links, .related-section, .toc-box,
      .article-mini-map-wrap,
      .skip-link { display: none !important; }
      body { background: #fff !important; color: #111 !important; }
      .article-container { max-width: 100%; padding: 0; }
      .article-title { color: #111 !important; text-shadow: none !important; }
      .article-body { color: #222 !important; }
      .article-body h2, .article-body h3 { color: #111 !important; text-shadow: none !important; }
      .article-hero { box-shadow: none; }
    }
  </style>
</head>
<body>
  <a href="#articleContainer" class="skip-link">Přeskočit na obsah</a>
  <div class="reading-progress" id="readingProgress"></div>
  <div class="bg"></div>
  <div class="stars" id="stars"></div>

  <div class="lightbox-overlay" id="lightboxOverlay">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <span class="lightbox-fullscreen" id="lightboxFullscreen" title="Celá obrazovka">⛶</span>
    <span class="lightbox-arrow prev" id="lightboxPrev">&#10094;</span>
    <img id="lightboxImg" src="" alt="">
    <span class="lightbox-arrow next" id="lightboxNext">&#10095;</span>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>

  <div class="travel-map-modal-overlay" id="travelMapModalOverlay">
    <div class="travel-map-modal-box">
      <div class="travel-map-modal-header">
        <h2>🗺️ Mapa cest</h2>
        <button class="travel-map-modal-close" id="travelMapModalClose" aria-label="Zavřít">✕</button>
      </div>
      <div class="travel-map-modal-stats" id="travelMapModalStats" hidden></div>
      <div id="travelMapModalMap"></div>
      <button type="button" class="travel-map-modal-theme-toggle" id="travelMapModalThemeToggle" title="Přepnout denní/noční mapu" aria-label="Přepnout denní/noční mapu">☀️</button>
      <button type="button" class="travel-map-modal-play-btn" id="travelMapModalPlayBtn" hidden>▶️ Přehrát trasu</button>
      <div class="travel-map-modal-legend" id="travelMapModalLegend" hidden></div>
    </div>
  </div>

  <div class="nav-bar">
    <a href="/" class="back-btn">← Zpět na vesmír</a>
    <a href="/" class="nav-title">Moje diagnóza, můj vesmír</a>
  </div>
  <div class="article-container" id="articleContainer" tabindex="-1">
    <div class="article-loading" id="articleLoading">
      <div class="loading-constellation">
        <svg viewBox="0 0 120 60"><line x1="8" y1="30" x2="60" y2="8"/><line x1="60" y1="8" x2="112" y2="30"/></svg>
        <span class="lc-dot"></span><span class="lc-dot"></span><span class="lc-dot"></span>
      </div>
      <div>Načítání článku…</div>
    </div>
  </div>
  <script src="/shared.js"></script>
  <script>
  // --- Lightbox s galerií ---
  var galleryImages = [];
  var galleryIndex = 0;

  function isImageOnlyNode(node) {
    if (!node) return false;
    if (node.nodeType === 3) return node.textContent.trim() === '';
    if (node.nodeType !== 1) return false;
    if (node.tagName === 'IMG') return true;
    if (node.tagName === 'P' || node.tagName === 'DIV') {
      var kids = Array.prototype.slice.call(node.childNodes).filter(function(n) {
        return !(n.nodeType === 3 && n.textContent.trim() === '');
      });
      return kids.length === 1 && kids[0].nodeType === 1 && kids[0].tagName === 'IMG';
    }
    return false;
  }

  function extractImg(node) {
    if (node.tagName === 'IMG') return node;
    return node.querySelector('img');
  }

  function groupImages() {
    var body = document.getElementById('articleBody');
    if (!body) return;
    var children = Array.prototype.slice.call(body.childNodes);
    var run = [];

    function flushRun() {
      if (run.length >= 2) {
        var grid = document.createElement('div');
        grid.className = 'photo-grid';
        var refNode = run[0];
        refNode.parentNode.insertBefore(grid, refNode);
        run.forEach(function(node) {
          var img = extractImg(node);
          if (img) grid.appendChild(img);
          if (node !== img && node.parentNode) node.parentNode.removeChild(node);
        });
      }
      run = [];
    }

    for (var i = 0; i < children.length; i++) {
      var node = children[i];
      if (isImageOnlyNode(node)) {
        if (node.nodeType === 1) run.push(node);
      } else {
        flushRun();
      }
    }
    flushRun();
  }

  function buildGallery() {
    try { groupImages(); } catch (e) { console.error('groupImages selhalo:', e); }
    var body = document.getElementById('articleBody');
    galleryImages = body ? Array.prototype.slice.call(body.querySelectorAll('img')) : [];
    galleryImages.forEach(function(img, i) {
      img.addEventListener('click', function() { openLightbox(i); });
    });
  }

  function updateLightboxImage() {
    var img = galleryImages[galleryIndex];
    if (!img) return;
    var lbImg = document.getElementById('lightboxImg');
    lbImg.src = img.getAttribute('src');
    lbImg.alt = img.getAttribute('alt') || '';
    var counter = document.getElementById('lightboxCounter');
    var multi = galleryImages.length > 1;
    document.getElementById('lightboxPrev').style.display = multi ? 'flex' : 'none';
    document.getElementById('lightboxNext').style.display = multi ? 'flex' : 'none';
    counter.style.display = multi ? 'block' : 'none';
    counter.textContent = (galleryIndex + 1) + ' / ' + galleryImages.length;
  }

  function openLightbox(index) {
    if (!galleryImages.length) return;
    galleryIndex = ((index % galleryImages.length) + galleryImages.length) % galleryImages.length;
    updateLightboxImage();
    document.getElementById('lightboxOverlay').classList.add('open');
  }

  function closeLightbox() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
    document.getElementById('lightboxOverlay').classList.remove('open');
  }

  function toggleFullscreen() {
    var overlay = document.getElementById('lightboxOverlay');
    var isFull = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFull) {
      if (overlay.requestFullscreen) overlay.requestFullscreen();
      else if (overlay.webkitRequestFullscreen) overlay.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  function updateFullscreenIcon() {
    var btn = document.getElementById('lightboxFullscreen');
    if (!btn) return;
    var isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
    btn.innerHTML = isFull ? '⤫' : '⛶';
    btn.title = isFull ? 'Ukončit celou obrazovku' : 'Celá obrazovka';
  }

  function showPrevImage() {
    if (!galleryImages.length) return;
    galleryIndex = (galleryIndex - 1 + galleryImages.length) % galleryImages.length;
    updateLightboxImage();
  }

  function showNextImage() {
    if (!galleryImages.length) return;
    galleryIndex = (galleryIndex + 1) % galleryImages.length;
    updateLightboxImage();
  }

  document.addEventListener('DOMContentLoaded', function() {
    var overlay = document.getElementById('lightboxOverlay');
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeLightbox();
    });
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrev').addEventListener('click', function(e) { e.stopPropagation(); showPrevImage(); });
    document.getElementById('lightboxNext').addEventListener('click', function(e) { e.stopPropagation(); showNextImage(); });
    document.getElementById('lightboxFullscreen').addEventListener('click', function(e) { e.stopPropagation(); toggleFullscreen(); });
    document.getElementById('lightboxImg').addEventListener('dblclick', function(e) { e.stopPropagation(); toggleFullscreen(); });
    document.addEventListener('fullscreenchange', updateFullscreenIcon);
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

    document.addEventListener('keydown', function(e) {
      if (!overlay.classList.contains('open')) return;
      if (e.key === 'Escape') {
        if (document.fullscreenElement || document.webkitFullscreenElement) return;
        closeLightbox();
      }
      else if (e.key === 'ArrowLeft') showPrevImage();
      else if (e.key === 'ArrowRight') showNextImage();
      else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    });
  });

  function getArticleId() {
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    if (id) return decodeURIComponent(id);
    var parts = window.location.pathname.split('/').filter(Boolean);
    if (parts.length >= 2 && parts[0] === 'article') return decodeURIComponent(parts[1]);
    return null;
  }

  var SECTION_NAMES = {
    'travel': 'Cestování',
    'photo': 'Fotografování',
    'projects': 'Projekty',
    'about': 'O Zajdovi'
  };

  document.addEventListener('DOMContentLoaded', async function() {
    var starCount = window.innerWidth <= 640 ? 90 : 150;
    initStarfield(starCount);
    initStarfieldParallax();
    initTravelMapModal();

    var container = document.getElementById('articleContainer');
    var articleId = getArticleId();

    if (!articleId) {
      container.innerHTML = '<div class="article-notfound"><h2>Chybí ID článku</h2><p>Zkus se vrátit na <a href="/" style="color:var(--ember)">hlavní stránku</a>.</p></div>';
      return;
    }

    try {
      var r = await fetch('/api/articles/list');
      if (!r.ok) throw new Error('API chyba');
      var allArticles = await r.json();
      if (!Array.isArray(allArticles)) throw new Error('Neplatná data');
      var article = allArticles.find(function(a) {
        return a.id != null && String(a.id) === String(articleId) && a.published !== false;
      });
      if (!article) {
        container.innerHTML = '<div class="article-notfound"><h2>Článek nenalezen</h2><p>Tento článek neexistuje nebo byl smazán.</p></div>';
        return;
      }
      try {
        var publishedArticles = allArticles.filter(function(a) { return a && a.published !== false; });
        renderArticle(article, publishedArticles);
      } catch (renderErr) {
        console.error('Chyba renderování článku:', renderErr);
        container.innerHTML = '<div class="article-notfound"><h2>Chyba zobrazení</h2><p>Článek se podařilo načíst, ale nastala chyba při jeho zobrazení.</p></div>';
      }
    } catch(e) {
      container.innerHTML = '<div class="article-notfound"><h2>Chyba načítání</h2><p>Nepodařilo se načíst článek. Zkus to prosím později.</p></div>';
    }
  });

  function stripHtmlToText(html) {
    return String(html || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function buildTOC(bodyEl) {
    if (!bodyEl) return '';
    var headings = bodyEl.querySelectorAll('h2, h3');
    if (headings.length < 2) return '';
    var usedIds = {};
    var items = [];
    headings.forEach(function (h, i) {
      var text = h.textContent.trim();
      if (!text) return;
      var id = h.id;
      if (!id) {
        id = text.toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || ('sekce-' + i);
        var base = id, n = 1;
        while (usedIds[id]) { id = base + '-' + (++n); }
        h.id = id;
      }
      usedIds[id] = true;
      var sub = h.tagName === 'H3' ? ' style="padding-left:16px;font-size:13px"' : '';
      items.push('<a href="#' + id + '"' + sub + '>' + escapeHtml(text) + '</a>');
    });
    if (!items.length) return '';
    return '<details class="toc-box"><summary>📑 Obsah</summary><div class="toc-list">' + items.join('') + '</div></details>';
  }

  function estimateReadingTime(html) {
    var words = (stripHtmlToText(html).match(/\S+/g) || []).length;
    return Math.max(1, Math.round(words / 200));
  }

  function initReadingProgress() {
    var bar = document.getElementById('readingProgress');
    var body = document.getElementById('articleBody');
    if (!bar || !body) return;
    function update() {
      var rect = body.getBoundingClientRect();
      var total = rect.height - window.innerHeight;
      if (total <= 0) { bar.style.width = '100%'; return; }
      var scrolled = -rect.top;
      var pct = Math.max(0, Math.min(100, (scrolled / total) * 100));
      bar.style.width = pct + '%';
    }
    document.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  }

  function copyArticleLink(btn) {
    var url = window.location.href;
    var done = function () {
      var original = btn.textContent;
      btn.textContent = '✅ Zkopírováno';
      btn.classList.add('copied');
      setTimeout(function () { btn.textContent = original; btn.classList.remove('copied'); }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(function () { prompt('Zkopíruj odkaz ručně:', url); });
    } else {
      prompt('Zkopíruj odkaz ručně:', url);
    }
  }

  function findPrevNext(article, allArticles) {
    var sameSection = allArticles
      .filter(function (a) { return String(a.sectionId) === String(article.sectionId); })
      .sort(function (a, b) {
        var da = a.date || a.created || '', db = b.date || b.created || '';
        return da < db ? 1 : da > db ? -1 : 0;
      });
    var idx = sameSection.findIndex(function (a) { return String(a.id) === String(article.id); });
    if (idx === -1) return { prev: null, next: null };
    return {
      newer: idx > 0 ? sameSection[idx - 1] : null,
      older: idx < sameSection.length - 1 ? sameSection[idx + 1] : null
    };
  }

  function findRelated(article, allArticles, excludeIds) {
    return allArticles
      .filter(function (a) { return String(a.sectionId) === String(article.sectionId) && String(a.id) !== String(article.id) && excludeIds.indexOf(String(a.id)) === -1; })
      .sort(function (a, b) {
        var da = a.date || a.created || '', db = b.date || b.created || '';
        return da < db ? 1 : da > db ? -1 : 0;
      })
      .slice(0, 3);
  }

  function injectArticleJsonLd(article, title, description) {
    var old = document.getElementById('articleJsonLd');
    if (old) old.remove();
    var script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = 'articleJsonLd';
    var data = {
      '@context': 'https://schema.org',
      '@type': 'Article',
      headline: title,
      description: description,
      image: article.coverUrl ? [article.coverUrl] : undefined,
      datePublished: article.date || article.created || undefined,
      dateModified: article.updated || article.date || article.created || undefined,
      author: { '@type': 'Person', name: 'Zajda' },
      publisher: { '@type': 'Organization', name: 'Moje diagnóza, můj vesmír' },
      mainEntityOfPage: window.location.href
    };
    script.textContent = JSON.stringify(data);
    document.head.appendChild(script);
  }

  /* =========================================================
     MAPA CEST — modal otevíratelný z miniatury v článku
     =========================================================
     Stejná logika jako modal na homepage (index.html) — zkopírováno
     sem, aby šla mapa otevřít i z článku BEZ opuštění stránky (viz
     miniMapEl click handler výš). Zavření modalu = zpátky v článku,
     žádná navigace pryč a zpátky. */
  function formatDateCz(d) {
    if (!d) return '';
    try { return new Date(d).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' }); }
    catch (e) { return ''; }
  }

  var travelMapArticlesCache = null;
  async function getAllArticlesForMap() {
    // Pokud stránka články už jednou natáhla (renderArticle je uložil do
    // window._allArticlesCache), použije se to — bez dalšího requestu.
    if (window._allArticlesCache) return window._allArticlesCache;
    if (travelMapArticlesCache) return travelMapArticlesCache;
    try {
      var r = await fetch('/api/articles/list');
      if (!r.ok) return [];
      var data = await r.json();
      var arr = Array.isArray(data) ? data : [];
      travelMapArticlesCache = arr.filter(function (a) { return a && a.published !== false; });
      return travelMapArticlesCache;
    } catch (e) { return []; }
  }

  var mapSubsectionNameCache = {};
  async function getMapSubsectionName(sectionId, subsectionId) {
    if (!subsectionId) return '';
    var cacheKey = sectionId + ':' + subsectionId;
    if (cacheKey in mapSubsectionNameCache) return mapSubsectionNameCache[cacheKey];
    try {
      var res = await fetch('/api/subsections/by-section?sectionId=' + encodeURIComponent(sectionId));
      var subs = res.ok ? await res.json() : [];
      (subs || []).forEach(function (s) { mapSubsectionNameCache[sectionId + ':' + (s.id || '')] = s.name || ''; });
    } catch (e) {}
    return mapSubsectionNameCache[cacheKey] || '';
  }

  var travelMapInitialized = false;

  async function openTravelMapModal() {
    var overlay = document.getElementById('travelMapModalOverlay');
    if (!overlay) return;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (!travelMapInitialized) {
      travelMapInitialized = true;
      await buildTravelMapModalContent();
    } else if (window._travelMapInstance) {
      setTimeout(function () { window._travelMapInstance.invalidateSize(); }, 50);
    }
  }

  function closeTravelMapModal() {
    var overlay = document.getElementById('travelMapModalOverlay');
    if (overlay) overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  function initTravelMapModal() {
    var overlay = document.getElementById('travelMapModalOverlay');
    var closeBtn = document.getElementById('travelMapModalClose');
    if (closeBtn) closeBtn.addEventListener('click', closeTravelMapModal);
    if (overlay) overlay.addEventListener('click', function (e) { if (e.target === overlay) closeTravelMapModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeTravelMapModal(); });
  }

  async function buildTravelMapModalContent() {
    var mapEl = document.getElementById('travelMapModalMap');
    var legend = document.getElementById('travelMapModalLegend');
    if (!mapEl) return;

    var articles = await getAllArticlesForMap();
    var withCoords = articles.filter(function (a) {
      return a && typeof a.lat === 'number' && isFinite(a.lat) &&
        typeof a.lng === 'number' && isFinite(a.lng);
    });

    if (!withCoords.length) {
      mapEl.outerHTML = '<div class="travel-map-modal-empty" id="travelMapModalMap"><h3>Zatím tu nejsou žádná místa</h3><p>Jakmile u některého článku vyplníš souřadnice místa, objeví se tu jako bod na mapě.</p></div>';
      if (legend) legend.hidden = true;
      return;
    }

    withCoords.sort(function (a, b) {
      var da = a.date || a.created || '', db = b.date || b.created || '';
      return da < db ? -1 : da > db ? 1 : 0;
    });

    var groupsMap = {};
    var groupOrder = [];
    withCoords.forEach(function (a) {
      var key = (a.sectionId || '?') + ':' + (a.subsectionId || '');
      if (!groupsMap[key]) {
        groupsMap[key] = { key: key, sectionId: a.sectionId, subsectionId: a.subsectionId, points: [] };
        groupOrder.push(key);
      }
      groupsMap[key].points.push(a);
    });
    for (var gi = 0; gi < groupOrder.length; gi++) {
      var g0 = groupsMap[groupOrder[gi]];
      var secName = SECTION_NAMES[g0.sectionId] || g0.sectionId || 'Ostatní';
      var subName = await getMapSubsectionName(g0.sectionId, g0.subsectionId);
      g0.label = subName ? secName + ' — ' + subName : secName;
    }

    var THEME_COLORS = ['#ff7a45', '#2fe6c9', '#8f6bff'];
    function colorForIndex(i) {
      if (i < THEME_COLORS.length) return THEME_COLORS[i];
      return 'hsl(' + ((i * 47) % 360) + ', 70%, 62%)';
    }
    groupOrder.forEach(function (key, i) { groupsMap[key].color = colorForIndex(i); });

    function haversineKm(lat1, lon1, lat2, lon2) {
      var R = 6371;
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLon = (lon2 - lon1) * Math.PI / 180;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    var map = L.map('travelMapModalMap', { scrollWheelZoom: false });
    window._travelMapInstance = map;

    var TILE_THEMES = {
      day: { url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', icon: '☀️' },
      night: { url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', icon: '🌙' }
    };
    var currentTileTheme = localStorage.getItem('mapTileTheme') === 'night' ? 'night' : 'day';
    var tileLayer = L.tileLayer(TILE_THEMES[currentTileTheme].url, {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 19
    }).addTo(map);
    var themeToggleBtn = document.getElementById('travelMapModalThemeToggle');
    if (themeToggleBtn) {
      themeToggleBtn.textContent = TILE_THEMES[currentTileTheme].icon;
      themeToggleBtn.onclick = function () {
        currentTileTheme = currentTileTheme === 'day' ? 'night' : 'day';
        map.removeLayer(tileLayer);
        tileLayer = L.tileLayer(TILE_THEMES[currentTileTheme].url, {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
          maxZoom: 19
        }).addTo(map);
        themeToggleBtn.textContent = TILE_THEMES[currentTileTheme].icon;
        localStorage.setItem('mapTileTheme', currentTileTheme);
      };
    }

    map.on('focus', function () { map.scrollWheelZoom.enable(); });
    map.on('blur', function () { map.scrollWheelZoom.disable(); });

    var isTouchDevice = window.matchMedia && window.matchMedia('(hover: none)').matches;

    function starIconForColor(color) {
      return L.divIcon({
        className: '',
        html: '<div class="star-pin" style="background:radial-gradient(circle,#fff 0%,' + color + ' 45%,transparent 75%);box-shadow:0 0 10px ' + color + ',0 0 22px ' + color + '99;"></div>',
        iconSize: [16, 16], iconAnchor: [8, 8], popupAnchor: [0, -10]
      });
    }

    function clusterIconForColor(color) {
      return function (cluster) {
        var count = cluster.getChildCount();
        var size = count < 10 ? 32 : count < 50 ? 38 : 44;
        return L.divIcon({
          html: '<div class="map-cluster-icon" style="width:' + size + 'px;height:' + size + 'px;font-size:' + (count < 10 ? 13 : 14) + 'px;background:' + color + ';box-shadow:0 0 12px ' + color + 'aa;">' + count + '</div>',
          className: '', iconSize: [size, size]
        });
      };
    }

    var allLatLngs = [];
    var legendHtml = '';
    var markerById = {};
    var totalDistanceKm = 0;

    groupOrder.forEach(function (key) {
      var g = groupsMap[key];
      var icon = starIconForColor(g.color);
      var groupLatLngs = [];
      var clusterGroup = L.markerClusterGroup({
        iconCreateFunction: clusterIconForColor(g.color),
        maxClusterRadius: 45,
        disableClusteringAtZoom: 13,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false
      });

      g.points.forEach(function (a) {
        var ll = [a.lat, a.lng];
        groupLatLngs.push(ll);
        allLatLngs.push(ll);
        var marker = L.marker(ll, { icon: icon });
        markerById[a.id] = marker;
        var mTitle = escapeHtml(a.title || 'Bez názvu');
        var mPlace = escapeHtml(a.place || '');
        var mDateStr = escapeHtml(formatDateCz(a.date || a.created));
        var articleUrl = '/article?id=' + encodeURIComponent(a.id);

        marker.bindTooltip(
          '<span class="map-label-title">' + mTitle + '</span>' +
          (mPlace ? '<span class="map-label-meta">' + mPlace + '</span>' : '') +
          (mDateStr ? '<span class="map-label-meta">' + mDateStr + '</span>' : ''),
          { direction: 'top', offset: [0, -10], className: 'map-point-label', opacity: 1 }
        );
        var tooltipOpenedByTap = false;
        marker.on('click', function () {
          if (isTouchDevice && !tooltipOpenedByTap) {
            tooltipOpenedByTap = true;
            this.openTooltip();
            return;
          }
          if (String(a.id) === String((window._currentArticle || {}).id)) {
            // Klik na bod TOHOTO článku, který zrovna čteš — nemá smysl
            // ho "navigovat na sebe", stačí modal zavřít.
            closeTravelMapModal();
            return;
          }
          window.location.href = articleUrl;
        });
        marker.on('add', function () {
          var el = marker.getElement();
          if (el) el.setAttribute('tabindex', '0');
        });
        clusterGroup.addLayer(marker);
      });

      var polyline = null;
      if (groupLatLngs.length > 1) {
        polyline = L.polyline(groupLatLngs, { color: g.color, weight: 2.5, opacity: 0.65, dashArray: '5 8' }).addTo(map);
        for (var pi = 1; pi < groupLatLngs.length; pi++) {
          totalDistanceKm += haversineKm(groupLatLngs[pi - 1][0], groupLatLngs[pi - 1][1], groupLatLngs[pi][0], groupLatLngs[pi][1]);
        }
      }
      g.polyline = polyline;
      g.clusterGroup = clusterGroup;
      g.visible = true;
      clusterGroup.addTo(map);

      legendHtml += '<span class="legend-item" tabindex="0" role="button" data-group-key="' + escapeHtml(key) + '"><span class="legend-dot" style="background:' + g.color + ';box-shadow:0 0 8px ' + g.color + '99"></span> ' + escapeHtml(g.label) + (groupLatLngs.length > 1 ? '' : ' (1 místo)') + '</span>';
    });

    if (allLatLngs.length === 1) map.setView(allLatLngs[0], 8);
    else map.fitBounds(L.latLngBounds(allLatLngs), { padding: [30, 30] });

    if (legend) { legend.innerHTML = legendHtml; legend.hidden = false; }

    legend.querySelectorAll('.legend-item').forEach(function (item) {
      function toggle() {
        var key = item.getAttribute('data-group-key');
        var g = groupsMap[key];
        if (!g) return;
        g.visible = !g.visible;
        item.classList.toggle('legend-off', !g.visible);
        if (g.visible) {
          g.clusterGroup.addTo(map);
          if (g.polyline) g.polyline.addTo(map);
        } else {
          map.removeLayer(g.clusterGroup);
          if (g.polyline) map.removeLayer(g.polyline);
        }
      }
      item.addEventListener('click', toggle);
      item.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    });

    var statsEl = document.getElementById('travelMapModalStats');
    if (statsEl) {
      var tripWord = groupOrder.length === 1 ? 'cesta' : (groupOrder.length >= 2 && groupOrder.length <= 4 ? 'cesty' : 'cest');
      var placeWord = withCoords.length === 1 ? 'místo' : (withCoords.length >= 2 && withCoords.length <= 4 ? 'místa' : 'míst');
      var distancePart = totalDistanceKm > 0 ? '<span>~<strong>' + Math.round(totalDistanceKm).toLocaleString('cs-CZ') + '</strong> km vzdušnou čarou</span>' : '';
      statsEl.innerHTML = '<span><strong>' + groupOrder.length + '</strong> ' + tripWord + '</span><span><strong>' + withCoords.length + '</strong> ' + placeWord + '</span>' + distancePart;
      statsEl.hidden = false;
    }

    var playBtn = document.getElementById('travelMapModalPlayBtn');
    if (playBtn) {
      playBtn.hidden = withCoords.length <= 1;
      if (withCoords.length > 1 && !playBtn.dataset.wired) {
        playBtn.dataset.wired = '1';
        var isPlaying = false;
        function sleep(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
        playBtn.onclick = async function () {
          if (isPlaying) return;
          isPlaying = true;
          playBtn.disabled = true;
          playBtn.textContent = '⏸ Přehrávám…';
          for (var i = 0; i < withCoords.length; i++) {
            var a = withCoords[i];
            var m = markerById[a.id];
            map.flyTo([a.lat, a.lng], 9, { duration: 1 });
            await sleep(1100);
            if (m) { try { m.openTooltip(); } catch (e) {} }
            await sleep(1300);
            if (m) { try { m.closeTooltip(); } catch (e) {} }
          }
          if (allLatLngs.length > 1) map.fitBounds(L.latLngBounds(allLatLngs), { padding: [30, 30] });
          playBtn.disabled = false;
          playBtn.textContent = '▶️ Přehrát trasu';
          isPlaying = false;
        };
      }
    }

    setTimeout(function () { map.invalidateSize(); }, 60);
  }

  function renderArticle(article, allArticles) {
    // Uloženo pro mapový modal (viz níž) — ať se při otevření mapy z
    // miniatury nemusí články stahovat znovu, když je má tahle stránka
    // už jednou natažené.
    window._allArticlesCache = allArticles;
    window._currentArticle = article;

    var container = document.getElementById('articleContainer');
    var title = article.title || 'Bez názvu';
    var content = article.content || '';
    var date = article.date || article.created || '';
    var dateStr = '';
    if (date) { try { dateStr = new Date(date).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' }); } catch(e) {} }
    var sectionName = SECTION_NAMES[article.sectionId] || article.sectionId || '';
    var readingMinutes = estimateReadingTime(content);
    var description = article.excerpt && article.excerpt.trim() ? article.excerpt.trim() : stripHtmlToText(content).slice(0, 160);

    document.title = title + ' — Moje diagnóza, můj vesmír';
    injectArticleJsonLd(article, title, description);

    var html = '';
    if (article.coverUrl) {
      // ★ ZMĚNA: dřív alt="" (dekorativní přístup) — u fotoreportáže je
      // ale hero fotka obsahová informace, ne dekorace. Screenreader
      // uživatel by o ni jinak úplně přišel. Použijeme titulek článku
      // jako smysluplný fallback popisek.
      html += '<img class="article-hero" src="' + escapeHtml(article.coverUrl) + '" alt="' + escapeHtml('Titulní fotografie k článku: ' + title) + '" loading="eager">';
    }
    html += '<div class="article-header">';
    html += '<h1 class="article-title">' + escapeHtml(title) + '</h1>';
    html += '<div class="article-meta">';
    if (sectionName) html += '<span class="meta-badge">' + escapeHtml(sectionName) + '</span>';
    if (dateStr) html += '<span class="meta-item">' + escapeHtml(dateStr) + '</span>';
    html += '<span class="meta-item">📖 ~' + readingMinutes + ' min čtení</span>';
    html += '</div></div>';
    html += '<div class="article-divider"></div>';

    // === MINIATURA MAPY — jen pokud má článek vyplněné souřadnice ===
    var hasLocation = typeof article.lat === 'number' && isFinite(article.lat) &&
      typeof article.lng === 'number' && isFinite(article.lng);
    if (hasLocation) {
      html += '<div class="article-mini-map-wrap">' +
        '<div class="article-mini-map" id="articleMiniMap"></div>' +
        '<div class="article-mini-map-label">' +
        '<span>📍 ' + escapeHtml(article.place || 'Místo na mapě') + '</span>' +
        '<a href="/mapa.html" id="articleMiniMapLink">Zobrazit celou mapu cest →</a>' +
        '</div></div>';
    }

    html += '<div id="tocPlaceholder"></div>';
    html += '<div class="article-body" id="articleBody">' + content + '</div>';

    var shareUrl = window.location.href;
    var shareText = title + ' — Moje diagnóza, můj vesmír';
    html += '<div class="article-footer">';
    html += '<div class="share-bar-inline">';
    html += '<button type="button" id="saveArticleBtn" class="share-btn save-btn">☆ Uložit na později</button>';
    html += '<a class="share-btn wa" href="https://wa.me/?text=' + encodeURIComponent(shareText + ' ' + shareUrl) + '" target="_blank" rel="noopener">WhatsApp</a>';
    html += '<a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl) + '" target="_blank" rel="noopener">Facebook</a>';
    html += '<a class="share-btn" href="https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText) + '&url=' + encodeURIComponent(shareUrl) + '" target="_blank" rel="noopener">X / Twitter</a>';
    html += '<button type="button" class="share-btn" onclick="copyArticleLink(this)">🔗 Kopírovat odkaz</button>';
    html += '</div>';
    html += '</div>';

    var excludeIds = [String(article.id)];
    if (Array.isArray(allArticles) && allArticles.length) {
      var pn = findPrevNext(article, allArticles);
      var navParts = [];
      if (pn.older) {
        excludeIds.push(String(pn.older.id));
        navParts.push('<a class="article-nav-link prev" href="/article?id=' + encodeURIComponent(pn.older.id) + '"><span class="nav-hint">← Starší</span><span class="nav-title-text">' + escapeHtml(pn.older.title || 'Bez názvu') + '</span></a>');
      }
      if (pn.newer) {
        excludeIds.push(String(pn.newer.id));
        navParts.push('<a class="article-nav-link next" href="/article?id=' + encodeURIComponent(pn.newer.id) + '"><span class="nav-hint">Novější →</span><span class="nav-title-text">' + escapeHtml(pn.newer.title || 'Bez názvu') + '</span></a>');
      }
      if (navParts.length) {
        html += '<div class="article-nav-links' + (navParts.length === 1 ? ' single' : '') + '">' + navParts.join('') + '</div>';
      }

      var related = findRelated(article, allArticles, excludeIds);
      if (related.length) {
        html += '<div class="related-section"><h2>Podobné články</h2><div class="related-grid">';
        related.forEach(function (a) {
          var rDate = '';
          try { rDate = new Date(a.date || a.created).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) {}
          // ★ ZMĚNA: alt="" → smysluplný popisek z titulku daného článku
          var cover = a.coverUrl ? '<img src="' + a.coverUrl + '" alt="' + escapeHtml(a.title || 'Náhledová fotografie článku') + '" loading="lazy">' : '';
          html += '<a class="related-card" href="/article?id=' + encodeURIComponent(a.id) + '">' + cover +
            '<div class="related-body"><h3>' + escapeHtml(a.title || 'Bez názvu') + '</h3>' +
            (rDate ? '<div class="related-date">' + escapeHtml(rDate) + '</div>' : '') +
            '</div></a>';
        });
        html += '</div></div>';
      }
    }

    container.innerHTML = html;

    // === Inicializace miniatury mapy (jen pokud má článek souřadnice) ===
    if (hasLocation) {
      var miniMapEl = document.getElementById('articleMiniMap');
      if (miniMapEl && window.L) {
        var miniMap = L.map('articleMiniMap', {
          zoomControl: false, dragging: false, scrollWheelZoom: false,
          doubleClickZoom: false, touchZoom: false, boxZoom: false,
          keyboard: false, attributionControl: false
        }).setView([article.lat, article.lng], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(miniMap);
        var miniIcon = L.divIcon({
          className: '', html: '<div class="star-pin"></div>',
          iconSize: [16, 16], iconAnchor: [8, 8]
        });
        L.marker([article.lat, article.lng], { icon: miniIcon, interactive: false }).addTo(miniMap);
        // Miniatura je jen náhled (bez interakce) — klik kamkoliv v ní
        // otevře plnou mapu cest rovnou tady (modal), ne přechod na jinou
        // stránku. Zavření modalu = zpátky v článku, bez jakékoli navigace.
        miniMapEl.addEventListener('click', function () { openTravelMapModal(); });
        var miniMapLink = document.getElementById('articleMiniMapLink');
        if (miniMapLink) {
          miniMapLink.addEventListener('click', function (e) {
            e.preventDefault();
            openTravelMapModal();
          });
        }
      }
    }

    var tocPlaceholder = document.getElementById('tocPlaceholder');
    var tocHtml = buildTOC(document.getElementById('articleBody'));
    if (tocPlaceholder && tocHtml) tocPlaceholder.outerHTML = tocHtml;
    else if (tocPlaceholder) tocPlaceholder.remove();

    var saveBtn = document.getElementById('saveArticleBtn');
    if (saveBtn) {
      if (isArticleSaved(article.id)) { saveBtn.textContent = '★ Uloženo'; saveBtn.classList.add('saved'); }
      saveBtn.addEventListener('click', function () { toggleSaveArticle(article, saveBtn); });
    }

    container.querySelectorAll('#articleBody img').forEach(function (img) {
      if (!img.hasAttribute('loading')) img.loading = 'lazy';
      // ★ ZMĚNA: obrázky přímo v textu článku (ne cover) často přebírají
      // alt z CMS/editoru beze změny, ale pokud editor alt nevyplnil,
      // aspoň fallback na název článku, ať screenreader nedostane úplné
      // ticho u každé fotky v galerii.
      if (!img.getAttribute('alt')) img.setAttribute('alt', 'Fotografie z článku: ' + title);
    });

    buildGallery();
    initReadingProgress();
  }
  </script>
</body>
