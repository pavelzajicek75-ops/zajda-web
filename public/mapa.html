<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Mapa cest — Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interaktivní mapa míst, o kterých vypráví články ze sekce Cestování — s trasou seřazenou podle data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">

  <!-- Leaflet — lehká open-source mapová knihovna (~40 kB gzip), žádný
       API klíč, žádné napojení na Google Maps. Načítá se z jsdelivr CDN. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Leaflet.markercluster — shlukuje blízké body do jedné "bubliny" s
       počtem, dokud nezoomuješ blíž. Self-hosted (ne CDN), ať nemusíme
       řešit integrity hash cizího souboru. -->
  <link rel="stylesheet" href="/vendor/leaflet.markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="/vendor/leaflet.markercluster/MarkerCluster.Default.css">
  <script src="/vendor/leaflet.markercluster/leaflet.markercluster.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .nav-bar { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--panel-solid); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,122,69,0.35); color: var(--parchment); padding: 10px 22px;
      border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none;
      transition: all 0.3s; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .back-btn:hover { border-color: var(--ember); transform: translateX(-3px); background: rgba(255,122,69,0.18); }
    .nav-title {
      font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.3px;
      background: linear-gradient(90deg, var(--ember), var(--nova));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-decoration: none;
      filter: drop-shadow(0 0 12px rgba(255,122,69,0.25));
    }
    .nav-title:hover { filter: drop-shadow(0 0 18px rgba(47,230,201,0.4)) brightness(1.15); }

    .page-header { position: relative; z-index: 10; text-align: center; padding: 10px 20px 30px; }
    .page-title {
      font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 4vw, 38px); font-weight: 700;
      background: linear-gradient(90deg, var(--parchment) 0%, var(--ember) 45%, var(--nova) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 0 40px rgba(255,122,69,0.3);
    }
    .page-subtitle { color: var(--mist); font-size: 14.5px; margin-top: 8px; font-weight: 300; }

    .map-wrap {
      position: relative; z-index: 10; max-width: 1200px; margin: 0 auto 60px; padding: 0 20px;
    }
    .map-panel {
      position: relative;
      background: var(--panel-solid); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border); border-radius: 20px; overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }
    #travelMap {
      width: 100%; height: 62vh; min-height: 420px; background: #0a0a16;
    }

    /* === DENNÍ / NOČNÍ PŘEPÍNAČ MAPOVÉHO PODKLADU === */
    .map-theme-toggle {
      position: absolute; top: 14px; right: 14px; z-index: 900;
      background: var(--panel-solid); border: 1px solid var(--panel-border);
      color: var(--parchment); width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 18px; box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: border-color 0.2s, background 0.2s;
    }
    .map-theme-toggle:hover, .map-theme-toggle:focus-visible {
      border-color: var(--panel-border-hover); background: rgba(255,122,69,0.18);
    }
    /* Leaflet defaultně počítá s bílým UI — přebarvujeme na tmavé, ať
       zapadne do zbytku webu. */
    .leaflet-control-zoom a {
      background: var(--panel-solid) !important; color: var(--parchment) !important;
      border-color: var(--panel-border) !important;
    }
    .leaflet-control-zoom a:hover { background: rgba(255,122,69,0.25) !important; }
    .leaflet-control-attribution {
      background: rgba(8,8,15,0.75) !important; color: var(--mist-dim) !important;
      backdrop-filter: blur(4px);
    }
    .leaflet-control-attribution a { color: var(--mist) !important; }

    /* === POPISEK U BODU PŘI NAJETÍ (název, místo, datum) ===
       Leaflet defaultně stylizuje .leaflet-tooltip jako bílou bublinu se
       šipkou — to přebijeme tmavou "skleněnou" pilulkou v barvách webu.
       ★ ZMĚNA: pozadí teď plně neprůhledné (ne poloprůhledné jako
       --panel-solid) a text výrazně světlejší — na denním i nočním
       podkladu mapy byl text obtížně čitelný. Šipka (::before) se
       skryje, aby to nevypadalo jako osamocený zbytek výchozího stylu. */
    .map-point-label {
      background: #14152a !important;
      border: 1px solid rgba(255,122,69,0.5) !important;
      border-radius: 8px !important;
      padding: 5px 10px !important;
      box-shadow: 0 6px 20px rgba(0,0,0,0.55);
      font-family: 'Inter', sans-serif;
      line-height: 1.35;
      pointer-events: none;
    }
    .map-point-label::before { display: none !important; }
    .map-label-title {
      display: block; font-size: 13px; font-weight: 700; color: #ffffff;
      white-space: nowrap; margin-bottom: 2px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .map-label-meta {
      display: block; font-size: 11px; color: #d7d9ec; font-weight: 500;
      letter-spacing: 0.2px; white-space: nowrap;
    }

    /* Vlastní "hvězdný" pin — glowing tečka místo výchozí Leaflet
       kapky, ať drží vesmírný motiv webu. Kurzor jako u odkazu — celá
       hvězdička JE odkaz na článek (klik = přímá navigace, hover =
       náhled názvu/místa/data). */
    .star-pin {
      width: 16px; height: 16px; border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, var(--ember) 45%, transparent 75%);
      box-shadow: 0 0 10px var(--ember), 0 0 22px var(--ember-dim);
      border: 2px solid rgba(255,255,255,0.85);
      animation: pin-pulse 2.2s ease-in-out infinite;
      cursor: pointer;
    }
    @keyframes pin-pulse { 0%,100% { transform: scale(0.9); } 50% { transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { .star-pin { animation: none; } }

    .map-empty {
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
      height: 62vh; min-height: 420px; text-align: center; padding: 20px; color: var(--mist);
    }
    .map-empty h2 { font-family: 'Space Grotesk', sans-serif; color: var(--parchment); font-size: 20px; }
    .map-empty p { max-width: 420px; font-size: 14px; line-height: 1.6; color: var(--mist-dim); }

    .map-legend {
      display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap;
      padding: 16px 20px; font-size: 12.5px; color: var(--mist-dim);
      border-top: 1px solid rgba(140,150,255,0.12);
    }
    .map-legend span.legend-item {
      display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
      padding: 3px 8px; border-radius: 20px; transition: background 0.2s, opacity 0.2s;
      user-select: none;
    }
    .map-legend span.legend-item:hover, .map-legend span.legend-item:focus-visible {
      background: rgba(140,150,255,0.1);
    }
    /* Skrytá trasa (po kliku na legendu) — ztlumená, ne úplně schovaná,
       ať je jasné, že je vypnutá a ne že zmizela navždy. */
    .map-legend span.legend-item.legend-off { opacity: 0.4; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 8px var(--ember-dim); display: inline-block; }
    .legend-line { width: 22px; height: 0; border-top: 2px dashed var(--nova); display: inline-block; }

    /* === STATISTIKY (X cest · Y míst · Z km) === */
    .map-stats {
      display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap;
      padding: 12px 20px; font-size: 13px; color: var(--parchment);
      border-bottom: 1px solid rgba(140,150,255,0.12);
    }
    .map-stats strong { color: var(--nova); font-weight: 700; }

    /* === PŘEHRÁT TRASU === */
    .map-play-btn {
      position: absolute; bottom: 14px; left: 14px; z-index: 900;
      background: var(--panel-solid); border: 1px solid var(--panel-border);
      color: var(--parchment); padding: 9px 16px; border-radius: 30px; cursor: pointer;
      font-size: 13px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: border-color 0.2s, background 0.2s; font-family: 'Inter', sans-serif;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .map-play-btn:hover, .map-play-btn:focus-visible {
      border-color: var(--panel-border-hover); background: rgba(255,122,69,0.18);
    }
    .map-play-btn:disabled { opacity: 0.6; cursor: default; }

    /* === VLASTNÍ IKONA SHLUKU (cluster) === */
    .map-cluster-icon {
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; color: #08080f; font-weight: 700; font-family: 'Space Grotesk', sans-serif;
      border: 2px solid rgba(255,255,255,0.85);
    }

    @media (max-width: 700px) {
      .nav-bar { padding: 16px 20px; }
      .map-wrap { padding: 0 12px; }
      #travelMap, .map-empty { height: 56vh; }
      .map-stats { gap: 14px; font-size: 12px; }
      .map-play-btn { font-size: 12px; padding: 7px 12px; bottom: 10px; left: 10px; }
    }
  </style>
</head>
<body>
  <a href="#mapWrap" class="skip-link">Přeskočit na obsah</a>
  <div class="bg"></div>
  <div class="stars" id="stars"></div>

  <div class="nav-bar">
    <a href="/" class="back-btn">← Zpět na vesmír</a>
    <a href="/" class="nav-title">Moje diagnóza, můj vesmír</a>
  </div>

  <div class="page-header">
    <h1 class="page-title">Mapa cest</h1>
    <p class="page-subtitle">Místa, o kterých vyprávím — seřazená podle data jako trasa mezi hvězdami</p>
  </div>

  <div class="map-wrap" id="mapWrap" tabindex="-1">
    <div class="map-panel">
      <div class="map-stats" id="mapStats" hidden></div>
      <button type="button" class="map-theme-toggle" id="mapThemeToggle" title="Přepnout denní/noční mapu" aria-label="Přepnout denní/noční mapu">☀️</button>
      <div id="travelMap"></div>
      <button type="button" class="map-play-btn" id="mapPlayBtn" hidden>▶️ Přehrát trasu</button>
      <div class="map-legend" id="mapLegend" hidden></div>
    </div>
  </div>

  <script src="/shared.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async function() {
    initStarfield(120);
    initStarfieldParallax();

    var wrap = document.getElementById('mapWrap');
    var legend = document.getElementById('mapLegend');

    function formatDateCz(d) {
      if (!d) return '';
      try { return new Date(d).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' }); }
      catch (e) { return ''; }
    }

    function showEmptyState(message) {
      wrap.querySelector('.map-panel').innerHTML =
        '<div class="map-empty"><h2>Zatím tu nejsou žádná místa</h2><p>' + message + '</p></div>';
    }

    var articles;
    try {
      var r = await fetch('/api/articles/list');
      if (!r.ok) throw new Error('API chyba');
      var all = await r.json();
      articles = Array.isArray(all) ? all : [];
    } catch (e) {
      showEmptyState('Nepodařilo se načíst data z API. Zkus stránku načíst znovu později.');
      return;
    }

    // Jen publikované články s platnými souřadnicemi (lat/lng nejsou
    // povinná pole — u starších/ostatních článků chybí a to je v
    // pořádku, prostě se na mapě neobjeví).
    var withCoords = articles.filter(function (a) {
      return a && a.published !== false &&
        typeof a.lat === 'number' && isFinite(a.lat) &&
        typeof a.lng === 'number' && isFinite(a.lng);
    });

    if (!withCoords.length) {
      showEmptyState('Jakmile u některého článku vyplníš souřadnice místa, objeví se tu jako bod na mapě.');
      return;
    }

    // Chronologicky podle data — určuje pořadí bodů v rámci KAŽDÉ
    // skupiny (viz seskupení níž). Filtrování pole zachovává pořadí,
    // takže seskupením podle podsekce zůstane chronologie zachovaná.
    withCoords.sort(function (a, b) {
      var da = a.date || a.created || '', db = b.date || b.created || '';
      return da < db ? -1 : da > db ? 1 : 0;
    });

    // === SESKUPENÍ PODLE SEKCE+PODSEKCE ===
    // ★ ZMĚNA: dřív jedna společná trasa napříč vším cestováním —
    // teď každá podsekce (např. "Cestování → Amerika", "Cestování →
    // Čechy") dostane VLASTNÍ trasu a barvu. Bez podsekce (nebo mimo
    // sekci Cestování) padnou do skupiny podle sectionId samotného.
    var SECTION_NAMES = { travel: 'Cestování', photo: 'Fotografování', projects: 'Projekty', about: 'O Zajdovi' };
    var subsectionNameCache = {};
    async function getSubsectionName(sectionId, subsectionId) {
      if (!subsectionId) return '';
      var cacheKey = sectionId + ':' + subsectionId;
      if (cacheKey in subsectionNameCache) return subsectionNameCache[cacheKey];
      try {
        var res = await fetch('/api/subsections/by-section?sectionId=' + encodeURIComponent(sectionId));
        var subs = res.ok ? await res.json() : [];
        (subs || []).forEach(function (s) { subsectionNameCache[sectionId + ':' + (s.id || '')] = s.name || ''; });
      } catch (e) { /* necháme prázdné, degraduje na ID */ }
      return subsectionNameCache[cacheKey] || '';
    }

    var groupsMap = {};
    var groupOrder = [];
    withCoords.forEach(function (a) {
      var key = (a.sectionId || '?') + ':' + (a.subsectionId || '');
      if (!groupsMap[key]) {
        groupsMap[key] = { key: key, sectionId: a.sectionId, subsectionId: a.subsectionId, points: [] };
        groupOrder.push(key);
      }
      groupsMap[key].points.push(a);
    });

    // Popisky skupin (vyžaduje async fetch názvů podsekcí)
    for (var gi = 0; gi < groupOrder.length; gi++) {
      var g = groupsMap[groupOrder[gi]];
      var secName = SECTION_NAMES[g.sectionId] || g.sectionId || 'Ostatní';
      var subName = await getSubsectionName(g.sectionId, g.subsectionId);
      g.label = subName ? secName + ' — ' + subName : secName;
    }

    // Barevná paleta: nejdřív 3 motivové barvy webu, pak dogenerované
    // odstíny (rotace odstínu), ať i 6.–10. trasa má odlišnou barvu.
    var THEME_COLORS = ['#ff7a45', '#2fe6c9', '#8f6bff'];
    function colorForIndex(i) {
      if (i < THEME_COLORS.length) return THEME_COLORS[i];
      var hue = (i * 47) % 360;
      return 'hsl(' + hue + ', 70%, 62%)';
    }
    groupOrder.forEach(function (key, i) { groupsMap[key].color = colorForIndex(i); });

    // === VZDUŠNÁ VZDÁLENOST (Haversine) ===
    // Pro statistiku "~X km" — počítá se jako součet přímých úseků mezi
    // po sobě jdoucími body v rámci KAŽDÉ trasy (ne skutečná ujetá
    // vzdálenost po silnici/letecky, proto "vzdušnou čarou").
    function haversineKm(lat1, lon1, lat2, lon2) {
      var R = 6371;
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLon = (lon2 - lon1) * Math.PI / 180;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    var map = L.map('travelMap', { scrollWheelZoom: false });

    // === DENNÍ / NOČNÍ MAPOVÝ PODKLAD ===
    // Preference se pamatuje mezi návštěvami (localStorage), výchozí je
    // denní. Přepínací tlačítko (#mapThemeToggle) mění dlaždice za běhu.
    var TILE_THEMES = {
      day: { url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', icon: '☀️' },
      night: { url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', icon: '🌙' }
    };
    var currentTileTheme = localStorage.getItem('mapTileTheme') === 'night' ? 'night' : 'day';
    var tileLayer = L.tileLayer(TILE_THEMES[currentTileTheme].url, {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 19
    }).addTo(map);

    var themeToggleBtn = document.getElementById('mapThemeToggle');
    if (themeToggleBtn) {
      themeToggleBtn.textContent = TILE_THEMES[currentTileTheme].icon;
      themeToggleBtn.addEventListener('click', function () {
        currentTileTheme = currentTileTheme === 'day' ? 'night' : 'day';
        map.removeLayer(tileLayer);
        tileLayer = L.tileLayer(TILE_THEMES[currentTileTheme].url, {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
          maxZoom: 19
        }).addTo(map);
        themeToggleBtn.textContent = TILE_THEMES[currentTileTheme].icon;
        localStorage.setItem('mapTileTheme', currentTileTheme);
      });
    }

    // Kolečko zapne zoom kolečkem myši, až uživatel do mapy klikne —
    // jinak by nechtěně přebíral scroll celé stránky při projíždění.
    map.on('focus', function () { map.scrollWheelZoom.enable(); });
    map.on('blur', function () { map.scrollWheelZoom.disable(); });

    // === DOTYKOVÁ ZAŘÍZENÍ: nejdřív náhled, pak teprve otevření ===
    var isTouchDevice = window.matchMedia && window.matchMedia('(hover: none)').matches;

    function starIconForColor(color) {
      return L.divIcon({
        className: '',
        html: '<div class="star-pin" style="background:radial-gradient(circle,#fff 0%,' + color + ' 45%,transparent 75%);box-shadow:0 0 10px ' + color + ',0 0 22px ' + color + '99;"></div>',
        iconSize: [16, 16],
        iconAnchor: [8, 8],
        popupAnchor: [0, -10]
      });
    }

    // Shluková ikona v barvě dané trasy — s počtem bodů uvnitř. Velikost
    // roste mírně s počtem, ať je vidět rozdíl mezi shlukem 2 a shlukem 20.
    function clusterIconForColor(color) {
      return function (cluster) {
        var count = cluster.getChildCount();
        var size = count < 10 ? 32 : count < 50 ? 38 : 44;
        return L.divIcon({
          html: '<div class="map-cluster-icon" style="width:' + size + 'px;height:' + size + 'px;font-size:' + (count < 10 ? 13 : 14) + 'px;background:' + color + ';box-shadow:0 0 12px ' + color + 'aa;">' + count + '</div>',
          className: '',
          iconSize: [size, size]
        });
      };
    }

    var allLatLngs = [];
    var legendHtml = '';
    var markerById = {};       // pro "Přehrát trasu" — najít marker podle id článku
    var totalDistanceKm = 0;

    groupOrder.forEach(function (key) {
      var g = groupsMap[key];
      var icon = starIconForColor(g.color);
      var groupLatLngs = [];

      // Vlastní shlukovací vrstva PRO KAŽDOU trasu zvlášť (ne jedna
      // společná) — díky tomu shluk nikdy nemíchá body z různých cest a
      // legenda může trasu i s jejím shlukem najednou schovat/zobrazit.
      var clusterGroup = L.markerClusterGroup({
        iconCreateFunction: clusterIconForColor(g.color),
        maxClusterRadius: 45,
        disableClusteringAtZoom: 13,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false
      });

      g.points.forEach(function (a) {
        var ll = [a.lat, a.lng];
        groupLatLngs.push(ll);
        allLatLngs.push(ll);
        var marker = L.marker(ll, { icon: icon });
        markerById[a.id] = marker;
        var title = escapeHtml(a.title || 'Bez názvu');
        var place = escapeHtml(a.place || '');
        var dateStr = escapeHtml(formatDateCz(a.date || a.created));
        var articleUrl = '/article?id=' + encodeURIComponent(a.id);

        // Mapa je alternativní způsob listování mezi články jedné cesty —
        // na počítači hover ukáže název/místo/datum a klik rovnou otevře
        // článek. Na dotykovém zařízení hover neexistuje, takže první
        // ťuknutí jen otevře popisek — teprve druhé naviguje.
        var tooltipHtml =
          '<span class="map-label-title">' + title + '</span>' +
          (place ? '<span class="map-label-meta">' + place + '</span>' : '') +
          (dateStr ? '<span class="map-label-meta">' + dateStr + '</span>' : '');
        marker.bindTooltip(tooltipHtml, {
          direction: 'top', offset: [0, -10], className: 'map-point-label', opacity: 1
        });
        var tooltipOpenedByTap = false;
        marker.on('click', function () {
          if (isTouchDevice && !tooltipOpenedByTap) {
            tooltipOpenedByTap = true;
            this.openTooltip();
            return;
          }
          window.location.href = articleUrl;
        });
        marker.on('add', function () {
          // Klávesnice/čtečky obrazovky — nastavit tabindex až PO přidání
          // do (cluster) skupiny, jinak element ještě neexistuje v DOM.
          var el = marker.getElement();
          if (el) el.setAttribute('tabindex', '0');
        });
        clusterGroup.addLayer(marker);
      });

      // Trasa jen v rámci téhle skupiny (podsekce) — ne napříč všemi.
      var polyline = null;
      if (groupLatLngs.length > 1) {
        polyline = L.polyline(groupLatLngs, { color: g.color, weight: 2.5, opacity: 0.65, dashArray: '5 8' }).addTo(map);
        for (var pi = 1; pi < groupLatLngs.length; pi++) {
          totalDistanceKm += haversineKm(groupLatLngs[pi - 1][0], groupLatLngs[pi - 1][1], groupLatLngs[pi][0], groupLatLngs[pi][1]);
        }
      }
      g.polyline = polyline;
      g.clusterGroup = clusterGroup;
      g.visible = true;
      clusterGroup.addTo(map);

      legendHtml += '<span class="legend-item" tabindex="0" role="button" data-group-key="' + escapeHtml(key) + '"><span class="legend-dot" style="background:' + g.color + ';box-shadow:0 0 8px ' + g.color + '99"></span> ' + escapeHtml(g.label) + (groupLatLngs.length > 1 ? '' : ' (1 místo)') + '</span>';
    });

    if (allLatLngs.length === 1) {
      map.setView(allLatLngs[0], 8);
    } else {
      map.fitBounds(L.latLngBounds(allLatLngs), { padding: [40, 40] });
    }

    legend.innerHTML = legendHtml;
    legend.hidden = false;

    // === FILTROVATELNÁ LEGENDA — klik na trasu ji schová/zobrazí ===
    legend.querySelectorAll('.legend-item').forEach(function (item) {
      function toggle() {
        var key = item.getAttribute('data-group-key');
        var g = groupsMap[key];
        if (!g) return;
        g.visible = !g.visible;
        item.classList.toggle('legend-off', !g.visible);
        if (g.visible) {
          g.clusterGroup.addTo(map);
          if (g.polyline) g.polyline.addTo(map);
        } else {
          map.removeLayer(g.clusterGroup);
          if (g.polyline) map.removeLayer(g.polyline);
        }
      }
      item.addEventListener('click', toggle);
      item.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    });

    // === STATISTIKY ===
    var statsEl = document.getElementById('mapStats');
    if (statsEl) {
      var tripWord = groupOrder.length === 1 ? 'cesta' : (groupOrder.length >= 2 && groupOrder.length <= 4 ? 'cesty' : 'cest');
      var placeWord = withCoords.length === 1 ? 'místo' : (withCoords.length >= 2 && withCoords.length <= 4 ? 'místa' : 'míst');
      var distancePart = totalDistanceKm > 0 ? ' · <strong>~' + Math.round(totalDistanceKm).toLocaleString('cs-CZ') + ' km</strong> vzdušnou čarou' : '';
      statsEl.innerHTML = '<span><strong>' + groupOrder.length + '</strong> ' + tripWord + '</span><span><strong>' + withCoords.length + '</strong> ' + placeWord + '</span>' +
        (distancePart ? '<span>' + distancePart.replace(/^ · /, '') + '</span>' : '');
      statsEl.hidden = false;
    }

    // === PŘEHRÁT TRASU ===
    // "Proletí" mapou postupně všemi body v chronologickém pořadí napříč
    // VŠEMI trasami (ne jen jednou skupinou) — jako mini prolet celou
    // historií cestování. U každého bodu na chvíli ukáže popisek.
    var playBtn = document.getElementById('mapPlayBtn');
    if (playBtn && withCoords.length > 1) {
      playBtn.hidden = false;
      var isPlaying = false;
      function sleep(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
      playBtn.addEventListener('click', async function () {
        if (isPlaying) return;
        isPlaying = true;
        playBtn.disabled = true;
        playBtn.textContent = '⏸ Přehrávám…';
        for (var i = 0; i < withCoords.length; i++) {
          var a = withCoords[i];
          var m = markerById[a.id];
          map.flyTo([a.lat, a.lng], 9, { duration: 1 });
          await sleep(1100);
          if (m) { try { m.openTooltip(); } catch (e) {} }
          await sleep(1300);
          if (m) { try { m.closeTooltip(); } catch (e) {} }
        }
        if (allLatLngs.length > 1) map.fitBounds(L.latLngBounds(allLatLngs), { padding: [40, 40] });
        playBtn.disabled = false;
        playBtn.textContent = '▶️ Přehrát trasu';
        isPlaying = false;
      });
    }
  });
  </script>
</body>
</html>
