<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Témata — Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#08080f">
  <link rel="icon" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="description" content="Články podle štítků a témat.">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css?v=20261030">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .nav-bar { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px; background: var(--panel-solid);
      border: 1px solid rgba(255,122,69,0.35); color: var(--parchment); padding: 10px 22px;
      border-radius: 30px; font-size: 14px; font-weight: 600; text-decoration: none; transition: all .3s;
    }
    .back-btn:hover { border-color: var(--ember); background: rgba(255,122,69,0.18); }
    .nav-title { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: var(--ember); text-decoration: none; }
    .page-header { position: relative; z-index: 10; text-align: center; padding: 0 20px 18px; }
    .page-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 4vw, 38px); font-weight: 700; color: var(--parchment); }
    .page-subtitle { color: var(--mist); font-size: 14.5px; margin-top: 8px; font-weight: 300; }
    .wrap { position: relative; z-index: 10; max-width: 960px; margin: 0 auto; padding: 0 20px 60px; }

    .block { background: var(--panel-solid); border: 1px solid var(--panel-border); border-radius: 16px; padding: 18px 20px; margin-bottom: 20px; }
    .block h2 { font: 700 18px 'Space Grotesk', sans-serif; color: var(--parchment); margin-bottom: 4px; }
    .block .hint { font-size: 13px; color: var(--mist); margin-bottom: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
    .chip { font: 600 14px 'Space Grotesk', sans-serif; color: var(--nova); text-decoration: none; border: 1px solid var(--panel-border); border-radius: 18px; padding: 6px 14px; }
    .chip:hover, .chip[aria-current="true"] { border-color: var(--nova); background: rgba(47,230,201,.1); }
    .chip small { color: var(--mist); font-weight: 400; margin-left: 4px; }
    .tabs { display: flex; gap: 8px; margin: 10px 0 14px; flex-wrap: wrap; }
    .tab { font: 600 14px 'Space Grotesk', sans-serif; color: var(--parchment); background: transparent; border: 1px solid var(--panel-border); border-radius: 20px; padding: 7px 16px; cursor: pointer; }
    .tab[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); color: #08080f; }
    ol.top { list-style: none; display: grid; gap: 8px; counter-reset: n; }
    ol.top li { counter-increment: n; display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--panel-border); }
    ol.top li:first-child { border-top: 0; }
    ol.top li::before { content: counter(n); font: 700 18px 'Space Grotesk', sans-serif; color: var(--ember); min-width: 26px; }
    ol.top a { color: var(--parchment); font-weight: 600; text-decoration: none; }
    ol.top a:hover { color: var(--ember); }
    ol.top .m { margin-left: auto; font-size: 13px; color: var(--mist); white-space: nowrap; }
    .empty { color: var(--mist); font-size: 14px; }
    @media (max-width: 640px) { .nav-bar { padding: 14px 16px; } .wrap { padding: 0 14px 50px; } }
  </style>
<script src="/theme.js?v=1"></script>
  <script src="/motion.js?v=1" defer></script>
  <script src="/error-report.js?v=2"></script>
</head>
<body>
  <a href="#temMain" class="skip-link">Přeskočit na obsah</a>
  <div class="bg"></div>
  <div class="stars" id="stars"></div>
  <div class="nav-bar">
    <a href="/" class="back-btn">← Zpět na vesmír</a>
    <a href="/" class="nav-title">Moje diagnóza, můj vesmír</a>
  </div>
  <div class="page-header">
    <h1 class="page-title">🏷️ Témata</h1>
    <p class="page-subtitle">Články podle témat</p>
  </div>
  <main class="wrap" id="temMain" tabindex="-1">
    <div class="block"><div class="chips" id="chips"></div><p class="empty" id="noTags" hidden>Zatím tu nejsou žádná témata.</p></div>
    <div class="block" id="listBlock" hidden><h2 id="listTitle"></h2><ol class="top" id="list"></ol></div>
  </main>

  <script src="/shared.js?v=20261030"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async function () {
    if (typeof initStarfield === 'function') initStarfield(120);
    var all = [];
    try {
      var r = await fetch('/api/articles/list');
      var d = await r.json();
      all = (Array.isArray(d) ? d : []).filter(function (a) { return a && a.id && a.published !== false && !a.unlisted && Array.isArray(a.tags) && a.tags.length; });
    } catch (e) { console.error(e); }
    var counts = {}, names = {};
    all.forEach(function (a) { a.tags.forEach(function (t) { var k = t.toLocaleLowerCase('cs'); counts[k] = (counts[k] || 0) + 1; names[k] = names[k] || t; }); });
    var keys = Object.keys(counts).sort(function (x, y) { return counts[y] - counts[x] || x.localeCompare(y, 'cs'); });
    var current = (new URLSearchParams(location.search).get('t') || '').toLocaleLowerCase('cs');
    var chips = document.getElementById('chips');
    chips.textContent = '';
    keys.forEach(function (k) {
      var a = document.createElement('a'); a.className = 'chip'; a.href = '/temata?t=' + encodeURIComponent(names[k]);
      a.textContent = '#' + names[k];
      var s = document.createElement('small'); s.textContent = counts[k]; a.appendChild(s);
      if (k === current) a.setAttribute('aria-current', 'true');
      chips.appendChild(a);
    });
    document.getElementById('noTags').hidden = !!keys.length;
    if (current && counts[current]) {
      var items = all.filter(function (a) { return a.tags.some(function (t) { return t.toLocaleLowerCase('cs') === current; }); })
        .sort(function (x, y) { return (y.created || 0) - (x.created || 0); });
      document.getElementById('listTitle').textContent = '#' + names[current];
      var ol = document.getElementById('list'); ol.textContent = '';
      items.forEach(function (a) {
        var li = document.createElement('li'), l = document.createElement('a');
        l.href = '/article?id=' + encodeURIComponent(a.id); l.textContent = a.title || 'Bez názvu';
        li.appendChild(l);
        if (a.date) { var m = document.createElement('span'); m.className = 'm'; m.textContent = a.date; li.appendChild(m); }
        ol.appendChild(li);
      });
      document.getElementById('listBlock').hidden = false;
    }
  });
  </script>
</body>
</html>
