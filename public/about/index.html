<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>O Zajdovi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, #050509, #000000 80%),
        radial-gradient(circle at 70% 80%, rgba(40,0,80,0.25), transparent 70%),
        radial-gradient(circle at 20% 70%, rgba(0,40,120,0.20), transparent 70%),
        radial-gradient(circle at 60% 30%, rgba(120,40,0,0.15), transparent 80%);
      background-blend-mode: screen;
      color: #e2e8f0;
      min-height: 100vh;
      line-height: 1.7;
    }

    /* HERO */
    .hero {
      position: relative; width: 100%; height: 50vh; min-height: 320px; max-height: 500px;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .hero img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.55); }
    .hero::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.85) 100%);
    }
    .hero h1 {
      position: absolute; z-index: 2; font-size: clamp(2rem, 6vw, 3.5rem);
      color: #ff6600; text-shadow: 0 0 30px rgba(255,102,0,0.6), 0 4px 20px rgba(0,0,0,0.8);
      text-align: center; padding: 0 1.5rem;
    }

    /* OBSAH */
    .container { max-width: 800px; margin: 0 auto; padding: 3rem 1.5rem; }
    .content {
      background: rgba(30, 41, 59, 0.6); border: 1px solid #334155;
      border-radius: 16px; padding: 2.5rem; backdrop-filter: blur(10px);
    }
    .content p { color: #cbd5e1; margin-bottom: 1.25rem; font-size: 1.125rem; }
    .content h2 { color: #ffcc66; margin: 1.5rem 0 0.75rem; font-size: 1.5rem; }
    .content h3 { color: #ffb366; margin: 1.25rem 0 0.5rem; font-size: 1.25rem; }
    .content img {
      max-width: 100%; border-radius: 12px; margin: 1.5rem 0;
      box-shadow: 0 0 30px rgba(255, 150, 50, 0.2); display: block;
    }
    .content a { color: #60a5fa; text-decoration: underline; }
    .content ul, .content ol { margin: 0.5rem 0 1.25rem 1.5rem; color: #cbd5e1; }
    .content li { margin-bottom: 0.5rem; }
    .content blockquote {
      border-left: 3px solid #ff6600; margin: 1rem 0; padding: 0.75rem 1.25rem;
      background: rgba(255,102,0,0.08); border-radius: 0 8px 8px 0;
      font-style: italic; color: #cbd5e1;
    }
    .content hr { border: none; border-top: 1px solid #334155; margin: 1.5rem 0; }

    /* PODSEKCE */
    .subsections { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem 2rem; }
    .subsections h2 {
      font-size: 1.75rem; color: #ffcc66; margin-bottom: 1.5rem; text-align: center;
    }
    .sub-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;
    }
    .sub-panel {
      background: rgba(15,23,42,0.7); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,102,0,0.3); border-radius: 14px; overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5); display: flex; flex-direction: column;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .sub-panel:hover {
      border-color: rgba(255,102,0,0.6); box-shadow: 0 8px 40px rgba(255,102,0,0.15);
    }
    .sub-cover {
      width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block;
      border-bottom: 1px solid rgba(255,102,0,0.2);
    }
    .sub-body { padding: 0.8rem 1rem 1rem; }
    .sub-body h3 {
      color: #ffcc66; font-size: 15px; margin-bottom: 0.6rem; padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255,102,0,0.2);
    }
    .article-link {
      display: block; padding: 5px 8px 5px 14px; color: #e2e8f0; text-decoration: none;
      font-size: 12px; border-left: 2px solid #334155; transition: all 0.2s;
      line-height: 1.4; margin: 2px 0; border-radius: 0 4px 4px 0;
    }
    .article-link:hover {
      color: #fff; border-left-color: #ff6600; padding-left: 18px;
      background: rgba(255,102,0,0.1); text-shadow: 0 0 8px rgba(255,102,0,0.6);
    }
    .article-link .art-title { font-weight: 600; }
    .article-link .art-date { font-size: 10px; color: #94a3b8; display: block; margin-top: 1px; }
    .no-articles { color: #64748b; font-size: 12px; padding: 8px 0; font-style: italic; }

    /* AKTUALITY */
    .news-section { max-width: 1000px; margin: 0 auto; padding: 1rem 1.5rem 4rem; }
    .news-section h2 {
      font-size: 1.75rem; color: #ffcc66; margin-bottom: 1.5rem; text-align: center;
    }
    .news-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;
    }
    .news-card {
      background: rgba(30, 41, 59, 0.6); border: 1px solid #334155;
      border-radius: 12px; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      cursor: pointer; text-decoration: none; color: inherit;
      display: flex; flex-direction: column;
    }
    .news-card:hover {
      transform: translateY(-4px); box-shadow: 0 8px 30px rgba(255,102,0,0.15); border-color: #ff6600;
    }
    .news-card img { width: 100%; height: 180px; object-fit: cover; }
    .news-card .card-body { padding: 1rem 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .news-card h3 { color: #ffcc66; font-size: 1.1rem; margin-bottom: 0.5rem; }
    .news-card .card-excerpt { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; flex: 1; }
    .news-card .card-meta { color: #64748b; font-size: 0.8rem; margin-top: 0.75rem; }
    .news-card .card-placeholder {
      width: 100%; height: 180px; background: linear-gradient(135deg, #1e293b, #0f172a);
      display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
    }

    .back {
      display: inline-block; margin-top: 2rem; color: #ffcc66;
      text-decoration: none; font-size: 1rem;
    }
    .back:hover { text-shadow: 0 0 15px #ffcc66; }
    .loading { color: #64748b; text-align: center; padding: 4rem; }

    @media (max-width: 640px) {
      .content { padding: 1.5rem; }
      .news-grid, .sub-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="hero" id="hero">
    <h1 id="heroTitle">O Zajdovi</h1>
  </div>

  <div class="container">
    <div id="content" class="content loading">Načítání...</div>
    <a href="/" class="back">← Zpět na hlavní stránku</a>
  </div>

  <div class="subsections" id="subsections" style="display:none">
    <h2>Podsekce</h2>
    <div class="sub-grid" id="subGrid"></div>
  </div>

  <div class="news-section" id="newsSection" style="display:none">
    <h2>Aktuality</h2>
    <div class="news-grid" id="newsGrid"></div>
  </div>

  <script>
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('cs', { year: 'numeric', month: 'numeric', day: 'numeric' });
      } catch(e) { return ''; }
    }

    async function loadAbout() {
      try {
        var coverRes = await fetch('/api/sections/cover?sectionId=about');
        var aboutRes = await fetch('/api/about/get');

        var coverData = await coverRes.json();
        var data = await aboutRes.json();

        if (coverData.url) {
          var hero = document.getElementById('hero');
          var img = document.createElement('img');
          img.src = coverData.url;
          img.alt = 'Cover';
          hero.insertBefore(img, hero.firstChild);
        }
        document.getElementById('heroTitle').textContent = data.title || 'O Zajdovi';

        var content = document.getElementById('content');
        content.classList.remove('loading');
        if (!data.text) {
          content.innerHTML = '<p>Zatím žádný obsah.</p>';
        } else {
          content.innerHTML = data.text;
        }
      } catch (e) {
        document.getElementById('content').innerHTML =
          '<p style="color:#ef4444;text-align:center;">Chyba při načítání obsahu.</p>';
      }
    }

    async function loadSubsections() {
      try {
        var r = await fetch('/api/subsections/by-section?sectionId=about');
        if (!r.ok) return;
        var subs = await r.json();
        if (!subs.length) return;

        document.getElementById('subsections').style.display = 'block';

        var allArticles = await getAllArticles();
        var html = '';

        for (var i = 0; i < subs.length; i++) {
          var sub = subs[i];
          var subArticles = allArticles.filter(function(a) {
            return String(a.sectionId) === 'about' && String(a.subsectionId) === String(sub.id);
          });

          var coverHtml = sub.coverUrl
            ? '<img class="sub-cover" src="' + sub.coverUrl + '" alt="">'
            : '';

          html += '<div class="sub-panel">' + coverHtml +
            '<div class="sub-body"><h3>' + escapeHtml(sub.name) + '</h3>' +
            renderArticleList(subArticles) +
            '</div></div>';
        }

        document.getElementById('subGrid').innerHTML = html;
      } catch (e) {
        console.error('Podsekce:', e);
      }
    }

    function renderArticleList(articles) {
      if (!articles.length) return '<div class="no-articles">Žádné články</div>';
      var sorted = articles.slice().sort(function(a, b) {
        var da = a.created || a.date || '';
        var db = b.created || b.date || '';
        if (da < db) return 1;
        if (da > db) return -1;
        return 0;
      });
      var html = '';
      for (var i = 0; i < sorted.length; i++) {
        var a = sorted[i];
        var title = a.title || 'Bez názvu';
        var dateStr = formatDate(a.created || a.date);
        html += '<a class="article-link" href="/article.html?id=' + encodeURIComponent(a.id) + '">' +
          '<span class="art-title">' + escapeHtml(title) + '</span>' +
          (dateStr ? '<span class="art-date">' + escapeHtml(dateStr) + '</span>' : '') +
          '</a>';
      }
      return html;
    }

    var cachedArticles = null;
    async function getAllArticles() {
      if (cachedArticles) return cachedArticles;
      try {
        var r = await fetch('/api/articles/list');
        if (!r.ok) return [];
        var data = await r.json();
        cachedArticles = Array.isArray(data) ? data : (data.articles || []);
        return cachedArticles;
      } catch (e) { return []; }
    }

    async function loadNews() {
      try {
        var articles = await getAllArticles();
        var aboutArticles = articles.filter(function(a) {
          return String(a.sectionId) === 'about' && a.published;
        });

        var sorted = aboutArticles.sort(function(a, b) {
          var da = a.created || a.date || '';
          var db = b.created || b.date || '';
          if (da < db) return 1;
          if (da > db) return -1;
          return 0;
        }).slice(0, 4);

        if (!sorted.length) return;

        document.getElementById('newsSection').style.display = 'block';
        document.getElementById('newsGrid').innerHTML = sorted.map(function(a) {
          var excerpt = a.content
            ? a.content.replace(/<[^>]+>/g, '').substring(0, 120) + '...'
            : '';
          var date = formatDate(a.date || a.created);
          var cover = a.coverUrl
            ? '<img src="' + a.coverUrl + '" alt="">'
            : '<div class="card-placeholder">📷</div>';
          return '<a class="news-card" href="/article.html?id=' + encodeURIComponent(a.id) + '">' +
            cover +
            '<div class="card-body">' +
            '<h3>' + escapeHtml(a.title) + '</h3>' +
            '<p class="card-excerpt">' + escapeHtml(excerpt) + '</p>' +
            '<div class="card-meta">' + escapeHtml(a.place || '') + (a.place && date ? ' • ' : '') + date + '</div>' +
            '</div></a>';
        }).join('');
      } catch (e) {
        console.error('Aktuality:', e);
      }
    }

    loadAbout();
    loadSubsections();
    loadNews();
  </script>
</body>
</html>
