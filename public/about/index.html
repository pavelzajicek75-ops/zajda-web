<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>O Zajdovi — Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kdo je Zajda — trochu cvok a občasný zapisovatel vlastního života. O člověku za blogem Moje diagnóza, můj vesmír.">
  <link rel="canonical" href="https://zajda-web.pages.dev/about/">

  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Moje diagnóza, můj vesmír">
  <meta property="og:title" content="O Zajdovi — Moje diagnóza, můj vesmír">
  <meta property="og:description" content="Kdo je Zajda — trochu cvok a občasný zapisovatel vlastního života.">
  <meta property="og:url" content="https://zajda-web.pages.dev/about/">
  <meta property="og:image" content="https://zajda-web.pages.dev/images/og-cover.jpg">
  <meta property="og:locale" content="cs_CZ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="O Zajdovi — Moje diagnóza, můj vesmír">
  <meta name="twitter:description" content="Kdo je Zajda — trochu cvok a občasný zapisovatel vlastního života.">
  <meta name="twitter:image" content="https://zajda-web.pages.dev/images/og-cover.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: #dcdce8;
      line-height: 1.7;
    }

    .back-link {
      position: relative; z-index: 10; pointer-events: none;
      max-width: 1000px; margin: 0 auto; padding: 1.5rem 1.5rem 0;
    }
    .back-link a {
      pointer-events: auto;
      color: var(--mist); font-size: 0.85rem; text-decoration: none;
      transition: color 0.3s, text-shadow 0.3s;
    }
    .back-link a:hover { color: var(--ember); text-shadow: 0 0 10px rgba(255,122,69,0.4); }

    .title-block { position: relative; z-index: 10; text-align: center; padding: 1rem 1.5rem 0; pointer-events: none; }
    .title-block h1 {
      font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--parchment) 0%, var(--ember) 40%, var(--nova) 70%, var(--aurora) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 0 40px rgba(255,122,69,0.3);
      animation: title-shimmer 8s ease-in-out infinite;
    }
    @keyframes title-shimmer { 0%, 100% { background-position: 0% center; } 50% { background-position: 100% center; } }

    .container { max-width: 1000px; margin: 0 auto; padding: 1.5rem; position: relative; z-index: 10; pointer-events: none; }
    .content {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      position: relative;
    }
    .content::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: 16px 16px 0 0;
      background: linear-gradient(90deg, var(--ember), var(--nova), var(--aurora)); opacity: 0.9;
    }
    .content p { color: var(--mist); margin-bottom: 1.25rem; font-size: 1.125rem; font-weight: 300; }
    .content h2 { font-family: 'Space Grotesk', sans-serif; color: var(--parchment); margin: 1.5rem 0 0.75rem; font-size: 1.5rem; font-weight: 600; text-shadow: 0 0 15px rgba(255,122,69,0.25); }
    .content h3 { font-family: 'Space Grotesk', sans-serif; color: var(--nova); margin: 1.25rem 0 0.5rem; font-size: 1.25rem; font-weight: 600; }
    .content img {
      max-width: 100%;
      border-radius: 12px;
      margin: 1.5rem 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      display: block;
      transition: filter 0.3s, box-shadow 0.3s, transform 0.3s;
      cursor: pointer;
    }
    .content img:hover {
      filter: brightness(1.08) saturate(1.15);
      box-shadow: 0 6px 30px rgba(255,122,69,0.3);
      transform: scale(1.02);
    }
    .content a { color: var(--ember); text-decoration: underline; }
    .content a:hover { color: var(--nova); }
    .content ul, .content ol { margin: 0.5rem 0 1.25rem 1.5rem; color: var(--mist); }
    .content li { margin-bottom: 0.5rem; }
    .content blockquote {
      border-left: 3px solid var(--ember);
      margin: 1rem 0;
      padding: 0.75rem 1.25rem;
      background: rgba(255,122,69,0.06);
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: var(--mist);
    }
    .content hr { border: none; border-top: 1px solid rgba(140,150,255,0.14); margin: 1.5rem 0; }

    /* === ČASOVÁ OSA (timeline diagnózy) ===
       Svislá čára se "hvězdnými" body — stejný vizuální jazyk jako
       souhvězdí mezi citáty na homepage. Zobrazí se jen pokud existuje
       aspoň jeden milník (viz loadTimeline()). */
    .timeline-section {
      max-width: 1000px; margin: 0 auto; padding: 0 1.5rem 2rem; position: relative; z-index: 10;
    }
    .timeline-heading {
      font-family: 'Space Grotesk', sans-serif; color: var(--parchment); font-size: 1.5rem; font-weight: 600;
      margin-bottom: 1.75rem; text-align: center; text-shadow: 0 0 15px rgba(255,122,69,0.25);
    }
    .timeline-track { position: relative; padding-left: 44px; }
    .timeline-track::before {
      content: ''; position: absolute; left: 14px; top: 6px; bottom: 6px; width: 2px;
      background: linear-gradient(180deg, var(--ember), var(--nova), var(--aurora));
      opacity: 0.5;
    }
    .timeline-item {
      position: relative; margin-bottom: 1.75rem;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .timeline-item:last-child { margin-bottom: 0; }
    .timeline-item.in-view { opacity: 1; transform: translateY(0); }
    .timeline-dot {
      position: absolute; left: -44px; top: 6px; width: 16px; height: 16px; border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, var(--ember) 45%, transparent 75%);
      box-shadow: 0 0 10px var(--ember), 0 0 22px var(--ember-dim);
      border: 2px solid rgba(255,255,255,0.85);
    }
    .timeline-card {
      background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
      padding: 1.25rem 1.5rem; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 14px 34px rgba(0,0,0,0.35);
    }
    .timeline-date {
      font-family: 'Space Grotesk', sans-serif; color: var(--nova); font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 0.35rem; display: block;
    }
    .timeline-card h3 {
      font-family: 'Space Grotesk', sans-serif; color: var(--parchment); font-size: 1.15rem; font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .timeline-card img {
      max-width: 100%; border-radius: 10px; margin: 0.75rem 0; display: block; cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5); transition: transform 0.3s, box-shadow 0.3s;
    }
    .timeline-card img:hover { transform: scale(1.02); box-shadow: 0 6px 24px rgba(255,122,69,0.25); }
    .timeline-card p { color: var(--mist); font-size: 0.95rem; line-height: 1.65; margin: 0; font-weight: 300; }
    @media (prefers-reduced-motion: reduce) {
      .timeline-item { opacity: 1; transform: none; transition: none; }
    }
    @media (max-width: 640px) {
      .timeline-track { padding-left: 34px; }
      .timeline-track::before { left: 10px; }
      .timeline-dot { left: -34px; }
      .timeline-card { padding: 1rem 1.15rem; }
    }

    .subsections { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem 0; position: relative; z-index: 10; pointer-events: none; }
    .sub-grid { display: flex; gap: 1rem; }
    .sub-panel {
      pointer-events: auto;
      flex: 1 1 0;
      min-width: 0;
      background: var(--panel);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
    }
    .sub-panel:hover {
      border-color: var(--panel-border-hover);
      box-shadow: 0 16px 40px rgba(0,0,0,0.4), 0 0 24px rgba(255,122,69,0.15);
      transform: translateY(-3px);
    }
    .sub-cover {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      filter: saturate(0.95) brightness(0.94);
      transition: filter 0.3s;
    }
    .sub-panel:hover .sub-cover {
      filter: saturate(1.2) brightness(1.06);
    }
    .sub-body { padding: 0.8rem 1.25rem 1rem; }
    .sub-body h3 {
      font-family: 'Space Grotesk', sans-serif;
      color: var(--parchment);
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .article-link {
      display: inline-block;
      padding: 3px 0;
      color: var(--mist);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s, text-shadow 0.2s;
      margin-right: 1rem;
    }
    .article-link:hover {
      color: var(--ember);
      text-shadow: 0 0 10px rgba(255,122,69,0.4);
    }
    .article-link .art-date {
      font-size: 0.75rem;
      color: var(--mist-dim);
      margin-left: 0.4rem;
    }
    .no-articles { color: var(--mist-dim); font-size: 0.85rem; padding: 4px 0; font-style: italic; }

    .news-section { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem 4rem; position: relative; z-index: 10; pointer-events: none; }
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }
    .news-card {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .news-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.4), 0 0 24px rgba(255,122,69,0.15);
      border-color: var(--panel-border-hover);
    }
    .news-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      filter: saturate(0.95) brightness(0.94);
      transition: filter 0.3s;
    }
    .news-card:hover img { filter: saturate(1.2) brightness(1.06); }
    .news-card .card-body { padding: 0.9rem 1.1rem; flex: 1; display: flex; flex-direction: column; }
    .news-card h3 { font-family: 'Space Grotesk', sans-serif; color: var(--parchment); font-size: 1rem; font-weight: 600; margin-bottom: 0.4rem; }
    .news-card .card-excerpt { color: var(--mist); font-size: 0.85rem; line-height: 1.5; flex: 1; }
    .news-card .card-meta { color: var(--mist-dim); font-size: 0.75rem; margin-top: 0.5rem; }
    .news-card .card-placeholder {
      width: 100%; height: 160px;
      background: linear-gradient(135deg, rgba(143,107,255,0.15), rgba(20,21,38,0.6));
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }

    .loading { color: var(--mist-dim); text-align: center; padding: 4rem; }

    @media (prefers-reduced-motion: reduce) {
      .title-block h1 { animation: none !important; }
    }

    @media (max-width: 640px) {
      .content { padding: 1.5rem; }
      .sub-grid { flex-direction: column; }
      .news-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <a href="#content" class="skip-link">Přeskočit na obsah</a>

  <div class="bg"></div>
  <div class="stars" id="stars"></div>
  <svg class="constellation-layer" id="constellationLayer"></svg>
  <div class="lightbox-overlay" id="lightboxOverlay" onclick="this.classList.remove('open')"></div>

  <div class="back-link">
    <a href="/">← Zpět na hlavní stránku</a>
  </div>

  <div class="title-block">
    <h1 id="pageTitle">O Zajdovi</h1>
  </div>

  <div class="container">
    <div id="content" class="content loading" tabindex="-1">Načítání...</div>
  </div>

  <div class="timeline-section" id="timelineSection" style="display:none">
    <h2 class="timeline-heading">📖 Časová osa</h2>
    <div class="timeline-track" id="timelineTrack"></div>
  </div>

  <div class="subsections" id="subsections" style="display:none">
    <div class="sub-grid" id="subGrid"></div>
  </div>

  <div class="news-section" id="newsSection" style="display:none">
    <div class="news-grid" id="newsGrid"></div>
  </div>

  <script src="/shared.js"></script>
  <script>

    function openLightbox(src) {
      var overlay = document.getElementById('lightboxOverlay');
      if (!overlay) return;
      overlay.innerHTML = '<img src="' + src + '" alt="">';
      overlay.classList.add('open');
    }

    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      var overlay = document.getElementById('lightboxOverlay');
      if (overlay && overlay.classList.contains('open')) overlay.classList.remove('open');
    });

    async function loadAbout() {
      try {
        var aboutRes = await fetch('/api/about/get');
        var data = await aboutRes.json();
        document.getElementById('pageTitle').textContent = data.title || 'O Zajdovi';
        document.title = (data.title || 'O Zajdovi') + ' — Moje diagnóza, můj vesmír';
        var content = document.getElementById('content');
        content.classList.remove('loading');
        if (!data.text) {
          content.innerHTML = '<p>Zatím žádný obsah.</p>';
        } else {
          content.innerHTML = data.text;
          content.querySelectorAll('img').forEach(function(img) {
            img.style.cursor = 'pointer';
            if (!img.hasAttribute('loading')) img.loading = 'lazy';
            img.addEventListener('click', function() {
              openLightbox(this.src);
            });
          });
        }
      } catch (e) {
        document.getElementById('content').innerHTML =
          '<p style="color:#ef4444;text-align:center;">Chyba při načítání obsahu.</p>';
      }
    }

    /* === ČASOVÁ OSA (timeline diagnózy) ===
       Data z /api/timeline/list (spravuje se v administraci, záložka
       "📖 Timeline"). Vrací se už seřazené vzestupně podle data. Pokud
       zatím žádné milníky nejsou, sekce zůstane skrytá (display:none). */
    async function loadTimeline() {
      try {
        var r = await fetch('/api/timeline/list');
        if (!r.ok) return;
        var data = await r.json();
        var milestones = Array.isArray(data) ? data : [];
        if (!milestones.length) return;

        document.getElementById('timelineSection').style.display = 'block';
        var track = document.getElementById('timelineTrack');
        track.innerHTML = milestones.map(function (m) {
          var dateStr = '';
          try {
            dateStr = m.date ? new Date(m.date).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
          } catch (e) {}
          var photoHtml = m.photoUrl ? '<img src="' + escapeHtml(m.photoUrl) + '" alt="" loading="lazy">' : '';
          var textHtml = m.text ? '<p>' + escapeHtml(m.text).replace(/\n/g, '<br>') + '</p>' : '';
          return '<div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-card">' +
            (dateStr ? '<span class="timeline-date">' + escapeHtml(dateStr) + '</span>' : '') +
            '<h3>' + escapeHtml(m.title || '') + '</h3>' +
            photoHtml + textHtml +
            '</div></div>';
        }).join('');

        // Fotky v milnících otevřít v lightboxu, stejně jako zbytek stránky.
        track.querySelectorAll('img').forEach(function (img) {
          img.addEventListener('click', function () { openLightbox(this.src); });
        });

        // Postupné odhalení karet při scrollování — v duchu "hvězd", co
        // se objevují na obloze jedna po druhé, ne celá timeline naráz.
        if ('IntersectionObserver' in window) {
          var obs = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) { entry.target.classList.add('in-view'); obs.unobserve(entry.target); }
            });
          }, { threshold: 0.15 });
          track.querySelectorAll('.timeline-item').forEach(function (el) { obs.observe(el); });
        } else {
          track.querySelectorAll('.timeline-item').forEach(function (el) { el.classList.add('in-view'); });
        }
      } catch (e) {
        console.error('Timeline:', e);
      }
    }

    var cachedArticles = null;
    async function getAllArticles() {
      if (cachedArticles) return cachedArticles;
      try {
        var r = await fetch('/api/articles/list');
        if (!r.ok) return [];
        var data = await r.json();
        var arr = Array.isArray(data) ? data : (data.articles || []);
        // Stejná pojistka jako na homepage/article stránce — skrytý
        // koncept (published === false) se na veřejném webu nemá
        // objevit nikde, ani v podsekcích, ani v Aktualitách.
        cachedArticles = arr.filter(function(a) { return a && a.published !== false; });
        return cachedArticles;
      } catch (e) { return []; }
    }

    function renderArticleList(articles) {
      if (!articles.length) return '<div class="no-articles">Žádné články</div>';
      var sorted = articles.slice().sort(function(a, b) {
        var da = a.date || a.created || '';
        var db = b.date || b.created || '';
        if (da < db) return 1;
        if (da > db) return -1;
        return 0;
      });
      var html = '';
      for (var i = 0; i < sorted.length; i++) {
        var a = sorted[i];
        var title = a.title || 'Bez názvu';
        var dateStr = formatDate(a.date || a.created);
        html += '<a class="article-link" href="/article?id=' + encodeURIComponent(a.id) + '">' +
          escapeHtml(title) +
          (dateStr ? '<span class="art-date">' + dateStr + '</span>' : '') +
          '</a>';
      }
      return html;
    }

    async function loadSubsections() {
      try {
        var r = await fetch('/api/subsections/by-section?sectionId=about');
        if (!r.ok) return;
        var subs = await r.json();
        if (!subs.length) return;
        document.getElementById('subsections').style.display = 'block';
        var allArticles = await getAllArticles();
        var html = '';
        for (var i = 0; i < subs.length; i++) {
          var sub = subs[i];
          var subArticles = allArticles.filter(function(a) {
            return String(a.sectionId) === 'about' && String(a.subsectionId) === String(sub.id);
          });
          var coverHtml = sub.coverUrl
            ? '<img class="sub-cover" src="' + sub.coverUrl + '" alt="" loading="lazy">'
            : '';
          html += '<div class="sub-panel">' + coverHtml +
            '<div class="sub-body"><h3>' + escapeHtml(sub.name) + '</h3>' +
            renderArticleList(subArticles) +
            '</div></div>';
        }
        document.getElementById('subGrid').innerHTML = html;
      } catch (e) {
        console.error('Podsekce:', e);
      }
    }

    async function loadNews() {
      try {
        var articles = await getAllArticles();
        var aboutArticles = articles.filter(function(a) {
          return String(a.sectionId) === 'about';
        });
        var sorted = aboutArticles.sort(function(a, b) {
          var da = a.date || a.created || '';
          var db = b.date || b.created || '';
          if (da < db) return 1;
          if (da > db) return -1;
          return 0;
        }).slice(0, 4);
        if (!sorted.length) return;
        document.getElementById('newsSection').style.display = 'block';
        document.getElementById('newsGrid').innerHTML = sorted.map(function(a) {
          var excerpt = a.excerpt
            ? a.excerpt
            : (a.content ? a.content.replace(/<[^>]+>/g, '').substring(0, 120) + '...' : '');
          var date = formatDate(a.date || a.created);
          var cover = a.coverUrl
            ? '<img src="' + a.coverUrl + '" alt="" loading="lazy">'
            : '<div class="card-placeholder">📷</div>';
          return '<a class="news-card" href="/article?id=' + encodeURIComponent(a.id) + '">' +
            cover +
            '<div class="card-body">' +
            '<h3>' + escapeHtml(a.title) + '</h3>' +
            '<p class="card-excerpt">' + escapeHtml(excerpt) + '</p>' +
            '<div class="card-meta">' + escapeHtml(a.place || '') + (a.place && date ? ' • ' : '') + date + '</div>' +
            '</div></a>';
        }).join('');
      } catch (e) {
        console.error('Aktuality:', e);
      }
    }

    initStarfield(200);
    initStarfieldParallax();
    startQuotes();
    loadAbout();
    loadTimeline();
    loadSubsections();
    loadNews();
  </script>
</body>
</html>
