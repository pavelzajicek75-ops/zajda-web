<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>O Zajdovi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, #050509, #000000 80%),
        radial-gradient(circle at 70% 80%, rgba(40,0,80,0.25), transparent 70%),
        radial-gradient(circle at 20% 70%, rgba(0,40,120,0.20), transparent 70%),
        radial-gradient(circle at 60% 30%, rgba(120,40,0,0.15), transparent 80%);
      background-blend-mode: screen;
      color: #e2e8f0;
      min-height: 100vh;
      line-height: 1.7;
      overflow-x: hidden;
    }

    .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0; animation: twinkle var(--dur) ease-in-out infinite; animation-delay: var(--del); }
    @keyframes twinkle { 0%,100% { opacity: 0.1; transform: scale(0.5); } 50% { opacity: 0.9; transform: scale(1); } }

    .lightbox-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; cursor: zoom-out; }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 40px rgba(255,102,0,0.3); }

    .back-link {
      position: relative; z-index: 10;
      max-width: 1000px; margin: 0 auto; padding: 1.5rem 1.5rem 0;
    }
    .back-link a {
      color: #64748b; font-size: 0.85rem; text-decoration: none;
      transition: color 0.3s, text-shadow 0.3s;
    }
    .back-link a:hover { color: #ffcc66; text-shadow: 0 0 10px rgba(255,204,102,0.4); }

    .title-block { position: relative; z-index: 10; text-align: center; padding: 1rem 1.5rem 0; }
    .title-block h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      color: #ff6600;
      text-shadow: 0 0 30px rgba(255,102,0,0.6);
      letter-spacing: 2px;
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 1.5rem; position: relative; z-index: 10; }
    .content {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(8px);
    }
    .content p { color: #cbd5e1; margin-bottom: 1.25rem; font-size: 1.125rem; }
    .content h2 { color: #ffcc66; margin: 1.5rem 0 0.75rem; font-size: 1.5rem; text-shadow: 0 0 15px rgba(255,204,102,0.3); }
    .content h3 { color: #ffb366; margin: 1.25rem 0 0.5rem; font-size: 1.25rem; }
    .content img {
      max-width: 100%;
      border-radius: 12px;
      margin: 1.5rem 0;
      box-shadow: 0 0 30px rgba(255, 150, 50, 0.2);
      display: block;
      transition: filter 0.3s, box-shadow 0.3s, transform 0.3s;
      cursor: pointer;
    }
    .content img:hover {
      filter: brightness(1.15) saturate(1.2);
      box-shadow: 0 0 40px rgba(255, 102, 0, 0.4);
      transform: scale(1.02);
    }
    .content a { color: #60a5fa; text-decoration: underline; }
    .content ul, .content ol { margin: 0.5rem 0 1.25rem 1.5rem; color: #cbd5e1; }
    .content li { margin-bottom: 0.5rem; }
    .content blockquote {
      border-left: 3px solid #ff6600;
      margin: 1rem 0;
      padding: 0.75rem 1.25rem;
      background: rgba(255,102,0,0.08);
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: #cbd5e1;
    }
    .content hr { border: none; border-top: 1px solid #334155; margin: 1.5rem 0; }

    .subsections { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem 0; position: relative; z-index: 10; }
    .sub-grid { display: flex; flex-direction: column; gap: 1.5rem; }
    .sub-panel {
      background: rgba(15,23,42,0.3);
      border: 1px solid rgba(51, 65, 85, 0.4);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .sub-panel:hover {
      border-color: rgba(255,102,0,0.5);
      box-shadow: 0 0 20px rgba(255,102,0,0.08);
    }
    .sub-cover {
      width: 100%;
      max-height: 140px;
      object-fit: cover;
      display: block;
      transition: filter 0.3s;
    }
    .sub-panel:hover .sub-cover {
      filter: brightness(1.1) saturate(1.1);
    }
    .sub-body { padding: 0.8rem 1.25rem 1rem; }
    .sub-body h3 {
      color: #ffcc66;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .article-link {
      display: inline-block;
      padding: 3px 0;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s, text-shadow 0.2s;
      margin-right: 1rem;
    }
    .article-link:hover {
      color: #fff;
      text-shadow: 0 0 10px rgba(255,102,0,0.5);
    }
    .article-link .art-date {
      font-size: 0.75rem;
      color: #64748b;
      margin-left: 0.4rem;
    }
    .no-articles { color: #64748b; font-size: 0.85rem; padding: 4px 0; font-style: italic; }

    .news-section { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem 4rem; position: relative; z-index: 10; }
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }
    .news-card {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(51, 65, 85, 0.4);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .news-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255,102,0,0.12);
      border-color: rgba(255,102,0,0.5);
    }
    .news-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      transition: filter 0.3s;
    }
    .news-card:hover img { filter: brightness(1.1) saturate(1.1); }
    .news-card .card-body { padding: 0.9rem 1.1rem; flex: 1; display: flex; flex-direction: column; }
    .news-card h3 { color: #ffcc66; font-size: 1rem; margin-bottom: 0.4rem; }
    .news-card .card-excerpt { color: #94a3b8; font-size: 0.85rem; line-height: 1.5; flex: 1; }
    .news-card .card-meta { color: #64748b; font-size: 0.75rem; margin-top: 0.5rem; }
    .news-card .card-placeholder {
      width: 100%; height: 160px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }

    .quote-star { position: absolute; max-width: 300px; pointer-events: auto; z-index: 5; animation: drift linear infinite; }
    .quote-inner { color: rgba(255,255,255,0.7); font-weight: 300; font-size: 14px; text-shadow: 0 0 10px rgba(255,255,255,0.3); line-height: 1.45; transition: transform 0.35s ease, opacity 0.3s; }
    .quote-star:hover { animation-play-state: paused !important; }
    .quote-star:hover .quote-inner { transform: scale(1.1); opacity: 1; text-shadow: 0 0 25px #fff, 0 0 40px #ff6600; }
    .quote-author { color: #ffcc66; font-size: 0.65em; opacity: 0.85; display: block; margin-top: 4px; }
    @keyframes drift { from { transform: translate(var(--sx), var(--sy)); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } to { transform: translate(var(--ex), var(--ey)); opacity: 0; } }

    .loading { color: #64748b; text-align: center; padding: 4rem; }

    @media (max-width: 640px) {
      .content { padding: 1.5rem; }
      .sub-cover { max-height: 100px; }
      .news-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>
  <div class="lightbox-overlay" id="lightboxOverlay" onclick="this.classList.remove('open')"></div>

  <div class="back-link">
    <a href="/">← Zpět na hlavní stránku</a>
  </div>

  <div class="title-block">
    <h1 id="pageTitle">O Zajdovi</h1>
  </div>

  <div class="container">
    <div id="content" class="content loading">Načítání...</div>
  </div>

  <div class="subsections" id="subsections" style="display:none">
    <div class="sub-grid" id="subGrid"></div>
  </div>

  <div class="news-section" id="newsSection" style="display:none">
    <div class="news-grid" id="newsGrid"></div>
  </div>

  <script>
    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('cs', { year: 'numeric', month: 'numeric', day: 'numeric' });
      } catch(e) { return ''; }
    }

    (function() {
      var starsBox = document.getElementById('stars');
      if (!starsBox) return;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < 200; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.setProperty('--dur', (3 + Math.random() * 4) + 's');
        s.style.setProperty('--del', (Math.random() * 5) + 's');
        frag.appendChild(s);
      }
      starsBox.appendChild(frag);
    })();

    function openLightbox(src) {
      var overlay = document.getElementById('lightboxOverlay');
      if (!overlay) return;
      overlay.innerHTML = '<img src="' + src + '" alt="">';
      overlay.classList.add('open');
    }

    async function loadQuotes() {
      try { var r = await fetch('/api/quotes/list'); if (!r.ok) return []; return await r.json(); }
      catch(e) { return []; }
    }
    function spawnQuote(q) {
      var el = document.createElement('div');
      el.className = 'quote-star';
      var sz = 13 + Math.floor(Math.random() * 10);
      el.innerHTML = '<div class="quote-inner" style="font-size:' + sz + 'px">"' + escapeHtml(q.text || '') + '"<span class="quote-author">' + escapeHtml(q.author || '') + '</span></div>';
      var sx = Math.random() * (window.innerWidth - 100);
      var sy = Math.random() * (window.innerHeight - 80);
      el.style.left = sx + 'px';
      el.style.top = sy + 'px';
      var ex = (Math.random() - 0.5) * 400;
      var ey = (Math.random() - 0.5) * 400;
      el.style.setProperty('--sx', '0px');
      el.style.setProperty('--sy', '0px');
      el.style.setProperty('--ex', ex + 'px');
      el.style.setProperty('--ey', ey + 'px');
      el.style.animationDuration = (14 + Math.random() * 10) + 's';
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, 25000);
    }
    async function startQuotes() {
      var quotes = await loadQuotes();
      if (!quotes.length) return;
      for (var i = 0; i < Math.min(8, quotes.length); i++) spawnQuote(quotes[Math.floor(Math.random() * quotes.length)]);
      setInterval(function() {
        if (document.querySelectorAll('.quote-star').length > 12) return;
        spawnQuote(quotes[Math.floor(Math.random() * quotes.length)]);
      }, 5000);
    }

    async function loadAbout() {
      try {
        var aboutRes = await fetch('/api/about/get');
        var data = await aboutRes.json();
        document.getElementById('pageTitle').textContent = data.title || 'O Zajdovi';
        var content = document.getElementById('content');
        content.classList.remove('loading');
        if (!data.text) {
          content.innerHTML = '<p>Zatím žádný obsah.</p>';
        } else {
          content.innerHTML = data.text;
          content.querySelectorAll('img').forEach(function(img) {
            img.style.cursor = 'pointer';
            img.addEventListener('click', function() {
              openLightbox(this.src);
            });
          });
        }
      } catch (e) {
        document.getElementById('content').innerHTML =
          '<p style="color:#ef4444;text-align:center;">Chyba při načítání obsahu.</p>';
      }
    }

    var cachedArticles = null;
    async function getAllArticles() {
      if (cachedArticles) return cachedArticles;
      try {
        var r = await fetch('/api/articles/list');
        if (!r.ok) return [];
        var data = await r.json();
        cachedArticles = Array.isArray(data) ? data : (data.articles || []);
        return cachedArticles;
      } catch (e) { return []; }
    }

    function renderArticleList(articles) {
      if (!articles.length) return '<div class="no-articles">Žádné články</div>';
      var sorted = articles.slice().sort(function(a, b) {
        var da = a.created || a.date || '';
        var db = b.created || b.date || '';
        if (da < db) return 1;
        if (da > db) return -1;
        return 0;
      });
      var html = '';
      for (var i = 0; i < sorted.length; i++) {
        var a = sorted[i];
        var title = a.title || 'Bez názvu';
        var dateStr = formatDate(a.created || a.date);
        html += '<a class="article-link" href="/article.html?id=' + encodeURIComponent(a.id) + '">' +
          escapeHtml(title) +
          (dateStr ? '<span class="art-date">' + dateStr + '</span>' : '') +
          '</a>';
      }
      return html;
    }

    async function loadSubsections() {
      try {
        var r = await fetch('/api/subsections/by-section?sectionId=about');
        if (!r.ok) return;
        var subs = await r.json();
        if (!subs.length) return;
        document.getElementById('subsections').style.display = 'block';
        var allArticles = await getAllArticles();
        var html = '';
        for (var i = 0; i < subs.length; i++) {
          var sub = subs[i];
          var subArticles = allArticles.filter(function(a) {
            return String(a.sectionId) === 'about' && String(a.subsectionId) === String(sub.id);
          });
          var coverHtml = sub.coverUrl
            ? '<img class="sub-cover" src="' + sub.coverUrl + '" alt="">'
            : '';
          html += '<div class="sub-panel">' + coverHtml +
            '<div class="sub-body"><h3>' + escapeHtml(sub.name) + '</h3>' +
            renderArticleList(subArticles) +
            '</div></div>';
        }
        document.getElementById('subGrid').innerHTML = html;
      } catch (e) {
        console.error('Podsekce:', e);
      }
    }

    async function loadNews() {
      try {
        var articles = await getAllArticles();
        var aboutArticles = articles.filter(function(a) {
          return String(a.sectionId) === 'about' && a.published;
        });
        var sorted = aboutArticles.sort(function(a, b) {
          var da = a.created || a.date || '';
          var db = b.created || b.date || '';
          if (da < db) return 1;
          if (da > db) return -1;
          return 0;
        }).slice(0, 4);
        if (!sorted.length) return;
        document.getElementById('newsSection').style.display = 'block';
        document.getElementById('newsGrid').innerHTML = sorted.map(function(a) {
          var excerpt = a.content
            ? a.content.replace(/<[^>]+>/g, '').substring(0, 120) + '...'
            : '';
          var date = formatDate(a.date || a.created);
          var cover = a.coverUrl
            ? '<img src="' + a.coverUrl + '" alt="">'
            : '<div class="card-placeholder">📷</div>';
          return '<a class="news-card" href="/article.html?id=' + encodeURIComponent(a.id) + '">' +
            cover +
            '<div class="card-body">' +
            '<h3>' + escapeHtml(a.title) + '</h3>' +
            '<p class="card-excerpt">' + escapeHtml(excerpt) + '</p>' +
            '<div class="card-meta">' + escapeHtml(a.place || '') + (a.place && date ? ' • ' : '') + date + '</div>' +
            '</div></a>';
        }).join('');
      } catch (e) {
        console.error('Aktuality:', e);
      }
    }

    startQuotes();
    loadAbout();
    loadSubsections();
    loadNews();
  </script>
</body>
</html>
