<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>O Zajdovi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, #050509, #000000 80%),
        radial-gradient(circle at 70% 80%, rgba(40,0,80,0.25), transparent 70%),
        radial-gradient(circle at 20% 70%, rgba(0,40,120,0.20), transparent 70%),
        radial-gradient(circle at 60% 30%, rgba(120,40,0,0.15), transparent 80%);
      background-blend-mode: screen;
      color: #e2e8f0;
      min-height: 100vh;
      line-height: 1.7;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 3rem 1.5rem; }
    h1 {
      font-size: 2.5rem;
      color: #ff6600;
      text-shadow: 0 0 25px #ff6600;
      margin-bottom: 2rem;
      text-align: center;
    }
    .content {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(10px);
    }
    .content p {
      color: #cbd5e1;
      margin-bottom: 1.25rem;
      font-size: 1.125rem;
    }
    .content img {
      max-width: 100%;
      border-radius: 12px;
      margin: 1.5rem 0;
      box-shadow: 0 0 30px rgba(255, 150, 50, 0.2);
      display: block;
    }
    .back {
      display: inline-block;
      margin-top: 2rem;
      color: #ffcc66;
      text-decoration: none;
      font-size: 1rem;
    }
    .back:hover { text-shadow: 0 0 15px #ffcc66; }
    .loading { color: #64748b; text-align: center; padding: 4rem; }
  </style>
</head>
<body>
  <div class="container">
    <div id="content" class="loading">Načítání...</div>
    <a href="/" class="back">← Zpět na hlavní stránku</a>
  </div>

  <script>
    async function loadAbout() {
      try {
        const res = await fetch('/api/about/get');
        const data = await res.json();
        
        let html = `<h1>${escapeHtml(data.title || 'O Zajdovi')}</h1><div class="content">`;
        
        if (!data.text) {
          html += '<p>Zatím žádný obsah.</p>';
        } else {
          const parts = data.text.split(/(\[img:[^\]]+\])/);
          parts.forEach(part => {
            if (part.startsWith('[img:')) {
              const url = part.slice(5, -1);
              html += `<img src="${escapeHtml(url)}" alt="Foto">`;
            } else {
              html += `<p>${escapeHtml(part).replace(/\n/g, '<br>')}</p>`;
            }
          });
        }
        
        html += '</div>';
        document.getElementById('content').innerHTML = html;
      } catch {
        document.getElementById('content').innerHTML = '<p style="color:#ef4444;text-align:center;">Chyba při načítání obsahu.</p>';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadAbout();
  </script>
</body>
</html>
