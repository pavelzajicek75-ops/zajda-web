<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Editace citátů</title>
  <script type="module" src="/js/admin-guard.js"></script>
</head>
<body>

  <h1>Editace citátů</h1>

  <textarea id="quotes" style="width:100%;height:300px;"></textarea>
  <button id="saveBtn">Uložit</button>

  <script type="module">
    const res = await fetch("/api/quotes/get");
    document.getElementById("quotes").value = await res.text();

    document.getElementById("saveBtn").onclick = async () => {
      await fetch("/api/quotes/save", {
        method: "POST",
        body: document.getElementById("quotes").value
      });
      alert("Uloženo");
    };
  </script>

</body>
</html>
