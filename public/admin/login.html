<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { background: #16213e; padding: 2rem; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        h1 { color: #e94560; text-align: center; margin-bottom: 1.5rem; font-size: 1.8rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; color: #a8a8b3; margin-bottom: 0.3rem; font-size: 0.9rem; }
        .password-wrapper { position: relative; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.75rem; border: 1px solid #0f3460; border-radius: 8px; background: #1a1a2e; color: #fff; font-size: 1rem; }
        input:focus { outline: none; border-color: #e94560; }
        .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #a8a8b3; cursor: pointer; font-size: 1.2rem; }
        .toggle-password:hover { color: #e94560; }
        button[type="submit"] { width: 100%; padding: 0.75rem; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
        button[type="submit"]:hover { background: #c73650; }
        .error { color: #e94560; text-align: center; margin-top: 1rem; display: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Admin Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Uživatelské jméno</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Heslo</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                </div>
            </div>
            <button type="submit">Přihlásit se</button>
            <div class="error" id="errorMsg">Špatné uživatelské jméno nebo heslo</div>
        </form>
    </div>
    <script src="login.js"></script>
</body>
</html>
