<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/admin/dashboard.css">
  <script src="/admin/admin-guard.js"></script>
</head>
<body>
  <h1>Admin Dashboard</h1>

  <div class="menu">
    <a href="/admin/gallery/">📸 Galerie</a>
    <a href="/admin/citaty/">💬 Citáty</a>
    <a href="/admin/clanky/">📝 Články</a>
    <a href="/admin/sections/">📂 Sekce</a>
    <a href="/admin/subsections/">📁 Podsekce</a>
  </div>

  <div class="content">
    <div class="box">
      <h2>📊 Statistiky</h2>
      <div class="stat">Články: <strong id="articlesCount">0</strong></div>
      <div class="stat">Fotky: <strong id="photosCount">0</strong></div>
      <div class="stat">Citáty: <strong id="quotesCount">0</strong></div>
      <div class="stat">Uživatelé: <strong id="usersCount">0</strong></div>
      <div class="stat">Sekce: <strong id="sectionsCount">0</strong></div>
      <div class="stat">Podsekce: <strong id="subsectionsCount">0</strong></div>
    </div>

    <div class="box">
      <h2>💬 Poslední citáty</h2>
      <div id="quotesPreview"></div>
    </div>

    <div class="box">
      <h2>📸 Galerie – poslední fotky</h2>
      <div id="galleryPreview" class="preview"></div>
    </div>

    <div class="box">
      <h2>📝 Poslední články</h2>
      <div id="articlesPreview"></div>
    </div>
  </div>

  <script src="/admin/dashboard.js"></script>
</body>
</html>
