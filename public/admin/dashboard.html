<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="/admin/style.css">
</head>
<body>
<nav class="sidebar">
  <h2>📊 Admin</h2>
  <a href="#" class="nav-link active" data-section="galleries">🖼️ Fotografie</a>
  <a href="#" class="nav-link" data-section="articles">📝 Články</a>
  <a href="#" class="nav-link" data-section="quotes">💬 Citáty</a>
  <button onclick="logout()" class="btn btn-red" style="margin-top:auto">Odhlásit</button>
</nav>

<main class="content">
  <section id="galleries" class="section active">
    <h2>Fotografie / Galerie</h2>
    <div class="form-card">
      <h3>Nová galerie</h3>
      <input type="text" id="gTitle" placeholder="Název galerie">
      <input type="text" id="gDesc" placeholder="Popis">
      <button onclick="createGallery()" class="btn btn-green">Vytvořit galerii</button>
    </div>
    <div id="galleryList" class="grid"></div>
  </section>

  <section id="articles" class="section">
    <h2>Články</h2>
    <div class="form-card">
      <h3>Nový článek</h3>
      <input type="text" id="aTitle" placeholder="Nadpis článku">
      <input type="text" id="aImage" placeholder="URL obrázku (nepovinné)">
      <textarea id="aContent" placeholder="Obsah článku..." rows="5"></textarea>
      <button onclick="createArticle()" class="btn btn-green">Publikovat</button>
    </div>
    <div id="articleList" class="list"></div>
  </section>

  <section id="quotes" class="section">
    <h2>Citáty</h2>
    <div class="form-card">
      <h3>Přidat nový citát</h3>
      <textarea id="qText" placeholder="Text citátu..." rows="3"></textarea>
      <input type="text" id="qAuthor" placeholder="Autor">
      <button onclick="createQuote()" class="btn btn-green">Přidat citát</button>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width:60%">Citát</th>
            <th style="width:25%">Autor</th>
            <th style="width:15%">Akce</th>
          </tr>
        </thead>
        <tbody id="quoteTableBody">
          <tr><td colspan="3" style="text-align:center;color:#64748b">Načítání...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="/admin/dashboard.js"></script>
</body>
</html>
