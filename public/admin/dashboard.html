<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="admin-guard.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; }
        .header { background: #16213e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #e94560; }
        .logout-btn { background: #e94560; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; }
        .logout-btn:hover { background: #c73650; }
        .content { padding: 2rem; }
        .card { background: #16213e; padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; }
        .card h2 { color: #e94560; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Admin Dashboard</h1>
        <button class="logout-btn" id="logoutBtn">Odhlásit se</button>
    </div>
    <div class="content">
        <div class="card">
            <h2>Vítejte v administraci</h2>
            <p>Jste přihlášeni jako administrátor.</p>
        </div>
    </div>
    <script>
        document.getElementById('logoutBtn').addEventListener('click', function() {
            sessionStorage.removeItem('adminAuth');
            window.location.href = '/admin/login.html';
        });
    </script>
</body>
</html>
