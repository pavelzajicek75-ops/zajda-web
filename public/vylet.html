<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Výlet — Moje diagnóza, můj vesmír</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#08080f">
  <link rel="icon" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="description" content="Celý výlet jako příběh v čase — díl po dílu.">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css?v=20261035">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .nav-bar { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--panel-solid); border: 1px solid rgba(255,122,69,0.35); color: var(--parchment); padding: 10px 22px; border-radius: 30px; font-size: 14px; font-weight: 600; text-decoration: none; transition: all .3s; }
    .back-btn:hover { border-color: var(--ember); background: rgba(255,122,69,0.18); }
    .nav-title { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: var(--ember); text-decoration: none; }
    .page-header { position: relative; z-index: 10; text-align: center; padding: 6px 20px 26px; }
    .page-kicker { font: 600 12px 'Space Grotesk', sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--nova); margin-bottom: 8px; }
    .page-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(26px, 4.5vw, 44px); font-weight: 700; color: var(--parchment); }
    .page-subtitle { color: var(--mist); font-size: 14.5px; margin-top: 10px; }
    .wrap { position: relative; z-index: 10; max-width: 820px; margin: 0 auto; padding: 0 20px 70px; }
    .tl { position: relative; padding-left: 34px; }
    .tl::before { content: ''; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(to bottom, var(--nova), var(--ember), var(--aurora)); opacity: .6; }
    .tl-item { position: relative; margin-bottom: 26px; }
    .tl-dot { position: absolute; left: -34px; top: 6px; width: 24px; height: 24px; border-radius: 50%; background: #0b0b1a; border: 2px solid var(--ember);
      color: var(--ember); font: 700 12px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(255,122,69,.5); }
    .tl-card { display: block; text-decoration: none; color: var(--parchment); background: var(--panel-solid); border: 1px solid var(--panel-border); border-radius: 16px; overflow: hidden; transition: transform .25s, border-color .25s, box-shadow .25s; }
    .tl-card:hover, .tl-card:focus-visible { transform: translateY(-3px); border-color: var(--ember); box-shadow: 0 14px 36px rgba(0,0,0,.4); }
    .tl-card img { display: block; width: 100%; height: 210px; object-fit: cover; filter: saturate(1.05) brightness(.92); }
    .tl-body { padding: 16px 18px 18px; }
    .tl-meta { font-size: 12.5px; color: var(--mist); margin-bottom: 6px; }
    .tl-title { font: 700 21px/1.25 'Space Grotesk', sans-serif; margin-bottom: 8px; }
    .tl-ex { font-size: 15px; line-height: 1.6; color: #d8d6e8; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .tl-take { margin-top: 12px; padding: 10px 14px; border-left: 3px solid var(--nova); background: rgba(47,230,201,.07); border-radius: 0 10px 10px 0; font: 500 15.5px/1.5 'Space Grotesk', sans-serif; color: var(--parchment); }
    .tl-take small { display: block; font: 600 11px 'Space Grotesk', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--nova); margin-bottom: 3px; }
    .tl-cta { display: inline-block; margin-top: 12px; color: var(--ember); font: 700 14px 'Space Grotesk', sans-serif; }
    .empty { text-align: center; color: var(--mist); padding: 40px 0; }
    @media (max-width: 640px) { .nav-bar { padding: 14px 16px; } .wrap { padding: 0 14px 50px; } .tl-card img { height: 170px; } }
  </style>
  <script src="/theme.js?v=1"></script>
  <script src="/motion.js?v=1" defer></script>
  <script src="/error-report.js?v=2"></script>
</head>
<body>
  <a href="#vyMain" class="skip-link">Přeskočit na obsah</a>
  <div class="bg"></div>
  <div class="stars" id="stars"></div>
  <div class="nav-bar">
    <a href="/" class="back-btn">← Zpět na vesmír</a>
    <a href="/" class="nav-title">Moje diagnóza, můj vesmír</a>
  </div>
  <div class="page-header">
    <div class="page-kicker">🧭 Celý výlet</div>
    <h1 class="page-title" id="vyTitle">Výlet</h1>
    <p class="page-subtitle" id="vySub"></p>
  </div>
  <main class="wrap" id="vyMain" tabindex="-1"><div class="tl" id="tl"><div class="empty">Načítám…</div></div></main>

  <script src="/shared.js?v=20261040"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async function () {
    if (typeof initStarfield === 'function') initStarfield(120);
    var q = new URLSearchParams(location.search);
    var sec = q.get('s') || '', sub = q.get('sub') || '';
    var tl = document.getElementById('tl');
    function ts(a) { if (a.date) { var t = new Date(a.date).getTime(); if (!isNaN(t)) return t; } return typeof a.created === 'number' ? a.created : 0; }
    function plain(a) { return (a.excerpt && a.excerpt.trim()) ? a.excerpt.trim() : String(a.content || '').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 220); }
    function fmt(d) { try { return new Date(d).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } }
    var arts = [];
    try { var r = await fetch('/api/articles/list'); arts = r.ok ? await r.json() : []; } catch (e) {}
    arts = (Array.isArray(arts) ? arts : []).filter(function (a) { return a && a.published !== false && !a.unlisted && String(a.subsectionId || '') === sub && (!sec || String(a.sectionId || '') === sec); })
      .sort(function (a, b) { return (ts(a) - ts(b)) || ((a.created || 0) - (b.created || 0)); });
    if (!sub || !arts.length) { tl.innerHTML = '<div class="empty">Tenhle výlet jsem nenašel.</div>'; return; }
    var name = 'Výlet';
    try { var rs = await fetch('/api/subsections/by-section?sectionId=' + encodeURIComponent(sec || arts[0].sectionId || '')); var subs = rs.ok ? await rs.json() : [];
      var s = (Array.isArray(subs) ? subs : []).filter(function (x) { return String(x.id) === String(sub); })[0]; if (s && s.name) name = s.name; } catch (e) {}
    document.getElementById('vyTitle').textContent = name;
    document.title = name + ' — Moje diagnóza, můj vesmír';
    var places = {}; arts.forEach(function (a) { if (a.place) places[a.place] = 1; });
    var np = Object.keys(places).length;
    var d1 = fmt(arts[0].date || arts[0].created), d2 = fmt(arts[arts.length - 1].date || arts[arts.length - 1].created);
    document.getElementById('vySub').textContent = arts.length + ' ' + (arts.length === 1 ? 'díl' : (arts.length < 5 ? 'díly' : 'dílů')) + (np ? ' • ' + np + ' ' + (np === 1 ? 'místo' : (np < 5 ? 'místa' : 'míst')) : '') + (d1 ? ' • ' + d1 + (d2 && d2 !== d1 ? ' – ' + d2 : '') : '');
    tl.textContent = '';
    arts.forEach(function (a, i) {
      var it = document.createElement('div'); it.className = 'tl-item';
      var dot = document.createElement('div'); dot.className = 'tl-dot'; dot.textContent = i + 1;
      var c = document.createElement('a'); c.className = 'tl-card'; c.href = '/article?id=' + encodeURIComponent(a.id);
      if (a.coverUrl) { var im = document.createElement('img'); im.src = a.coverUrl; im.alt = ''; im.loading = i < 2 ? 'eager' : 'lazy'; im.decoding = 'async'; c.appendChild(im); }
      var b = document.createElement('div'); b.className = 'tl-body';
      var m = document.createElement('div'); m.className = 'tl-meta'; m.textContent = [fmt(a.date || a.created), a.place ? '📍 ' + a.place : ''].filter(Boolean).join(' • ');
      var h = document.createElement('div'); h.className = 'tl-title'; h.textContent = a.title || 'Bez názvu';
      b.appendChild(m); b.appendChild(h);
      var ex = plain(a); if (ex) { var p = document.createElement('p'); p.className = 'tl-ex'; p.textContent = ex; b.appendChild(p); }
      if (a.takeaway && String(a.takeaway).trim()) { var t = document.createElement('div'); t.className = 'tl-take'; var sm = document.createElement('small'); sm.textContent = '💭 Co se mnou ta cesta udělala'; t.appendChild(sm); t.appendChild(document.createTextNode(String(a.takeaway).trim())); b.appendChild(t); }
      var cta = document.createElement('span'); cta.className = 'tl-cta'; cta.textContent = 'Číst díl →'; b.appendChild(cta);
      c.appendChild(b); it.appendChild(dot); it.appendChild(c); tl.appendChild(it);
    });
  });
  </script>
</body>
</html>
