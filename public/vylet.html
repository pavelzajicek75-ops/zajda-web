  <script>
  document.addEventListener('DOMContentLoaded', async function () {
    if (typeof initStarfield === 'function') initStarfield(120);
    var q = new URLSearchParams(location.search);
    var sec = q.get('s') || '', sub = q.get('sub') || '';
    var tl = document.getElementById('tl');
    function ts(a) { if (a.date) { var t = new Date(a.date).getTime(); if (!isNaN(t)) return t; } return typeof a.created === 'number' ? a.created : 0; }
    function plain(a) { return (a.excerpt && a.excerpt.trim()) ? a.excerpt.trim() : String(a.content || '').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 220); }
    function fmt(d) { try { return new Date(d).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } }

    function validPt(s) { return s && typeof s.lat === 'number' && isFinite(s.lat) && typeof s.lng === 'number' && isFinite(s.lng); }
    function km(a, b) { var R = 6371, r = Math.PI / 180, dl = (b[0] - a[0]) * r, dn = (b[1] - a[1]) * r, h = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dn / 2) * Math.sin(dn / 2); return 2 * R * Math.asin(Math.sqrt(h)); }
    var PAL = ['#ff7a45', '#2fe6c9', '#8f6bff', '#ffd36b', '#ff7a9c', '#7fd6ff', '#9be15d'];
    function col(i) { return PAL[i % PAL.length]; }
    function bearing(a, b) { var r = Math.PI / 180, y = Math.sin((b[1] - a[1]) * r) * Math.cos(b[0] * r), x = Math.cos(a[0] * r) * Math.sin(b[0] * r) - Math.sin(a[0] * r) * Math.cos(b[0] * r) * Math.cos((b[1] - a[1]) * r); return Math.atan2(y, x) / r; }
    function legsOf(list) {
      return list.map(function (a) {
        var st = (Array.isArray(a.stops) && a.stops.length >= 2) ? a.stops : [{ lat: a.lat, lng: a.lng, place: a.place }];
        return st.filter(validPt).map(function (p) { return { ll: [p.lat, p.lng], place: p.place || '' }; });
      });
    }
    /* Spojnice mezi díly do seznamu: „🛣️ 120 km dál → České Budějovice“ — ať je vidět, jak na sebe díly navazují. */
    function addLinks(list, legs) {
      var prevI = -1;
      legs.forEach(function (g, i) {
        var el = document.getElementById('vy-' + i); if (!el) return;
        if (!g.length) { var nm = document.createElement('div'); nm.className = 'vy-link vy-link-no'; nm.textContent = 'Tenhle díl nemá zadanou zastávku, na mapě chybí.'; el.insertBefore(nm, el.firstChild); return; }
        if (prevI >= 0) {
          var from = legs[prevI][legs[prevI].length - 1], to = g[0], d = km(from.ll, to.ll);
          var l = document.createElement('div'); l.className = 'vy-link'; l.style.setProperty('--c', col(i));
          l.textContent = d < 0.5 ? '📍 Navazuje přímo: ' + (to.place || list[i].title) : '🛣️ ' + (from.place || 'předchozí zastávka') + ' → ' + (to.place || list[i].title) + ' · ' + Math.round(d) + ' km';
          el.insertBefore(l, el.firstChild);
        }
        prevI = i;
      });
    }
    function drawMap(list) {
      if (typeof L === 'undefined') return;
      var legs = legsOf(list);
      var all = []; legs.forEach(function (g) { g.forEach(function (p) { all.push(p.ll); }); });
      addLinks(list, legs);
      legs.forEach(function (g, i) { var d = document.querySelector('#vy-' + i + ' .tl-dot'); if (d) { d.style.borderColor = col(i); d.style.color = col(i); d.style.boxShadow = '0 0 12px ' + col(i) + '88'; } });
      if (!all.length) return;
      var wrap = document.getElementById('vyMapWrap'); wrap.hidden = false;
      var map = L.map('vyMap', { scrollWheelZoom: false, zoomControl: true, tap: true });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 19, subdomains: 'abc' }).addTo(map);
      var lines = [], segs = [], prev = null, total = 0, firstIdx = -1, lastIdx = -1, kmLeg = [];
      legs.forEach(function (g, i) { if (g.length) { if (firstIdx < 0) firstIdx = i; lastIdx = i; } });
      function go(i) {
        var el = document.getElementById('vy-' + i); if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 2200);
        focus(i);
      }
      function focus(i) {
        var pts = []; if (legs[i]) legs[i].forEach(function (p) { pts.push(p.ll); });
        if (i > 0 && legs[i].length) { for (var q = i - 1; q >= 0; q--) if (legs[q].length) { pts.push(legs[q][legs[q].length - 1].ll); break; } }
        if (pts.length > 1) map.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 12 }); else if (pts.length) map.setView(pts[0], 11);
        document.querySelectorAll('#vyLegend .vy-chip').forEach(function (c) { c.classList.toggle('on', +c.getAttribute('data-i') === i); });
      }
      legs.forEach(function (g, i) {
        if (!g.length) return;
        var c = col(i), pts = g.map(function (p) { return p.ll; }), dist = 0;
        if (prev && km(prev, pts[0]) > 0.05) {
          L.polyline([prev, pts[0]], { color: c, weight: 3, opacity: .7, dashArray: '6 8' }).addTo(map);
          segs.push([prev, pts[0], c]); dist += km(prev, pts[0]);
        }
        if (pts.length > 1) {
          L.polyline(pts, { color: c, weight: 4.5, opacity: .95 }).addTo(map);
          for (var k = 1; k < pts.length; k++) { dist += km(pts[k - 1], pts[k]); segs.push([pts[k - 1], pts[k], c]); }
        }
        total += dist; kmLeg[i] = dist;
        g.forEach(function (p, k) {
          if (k > 0) L.marker(p.ll, { icon: L.divIcon({ className: '', html: '<div class="vy-sub" style="background:' + c + '"></div>', iconSize: [9, 9], iconAnchor: [5, 5] }), keyboard: false })
            .bindTooltip(p.place || (list[i].title || ''), { className: 'vy-tip', direction: 'top', offset: [0, -6] }).addTo(map).on('click', function () { go(i); });
        });
        var isEnd = (i === lastIdx && lastIdx !== firstIdx);
        var m = L.marker(g[0].ll, { icon: L.divIcon({ className: '', html: '<div class="vy-pin" style="border-color:' + c + ';color:' + c + ';box-shadow:0 0 14px ' + c + '99">' + (i + 1) + '</div>', iconSize: [28, 28], iconAnchor: [14, 14] }), title: list[i].title || '', zIndexOffset: 100 })
          .bindTooltip((i + 1) + ' · ' + (list[i].title || 'Bez názvu') + (g[0].place ? ' — ' + g[0].place : ''), { className: 'vy-tip', direction: 'top', offset: [0, -14] }).addTo(map);
        m.on('click', function () { go(i); });
        prev = pts[pts.length - 1];
      });
      /* START a CÍL — celá cesta má jasný začátek a konec. */
      var A = all[0], Z = all[all.length - 1];
      if (all.length > 1) {
        L.marker(A, { icon: L.divIcon({ className: '', html: '<div class="vy-flag vy-start">START</div>', iconSize: [52, 20], iconAnchor: [26, 36] }), interactive: false, zIndexOffset: 300 }).addTo(map);
        L.marker(Z, { icon: L.divIcon({ className: '', html: '<div class="vy-flag vy-goal">CÍL</div>', iconSize: [40, 20], iconAnchor: [20, 36] }), interactive: false, zIndexOffset: 300 }).addTo(map);
      }
      /* Šipky ve směru jízdy. */
      var arrows = L.layerGroup().addTo(map);
      function drawArrows() {
        arrows.clearLayers();
        segs.forEach(function (sg) {
          var p1 = map.latLngToLayerPoint(sg[0]), p2 = map.latLngToLayerPoint(sg[1]);
          if (p1.distanceTo(p2) < 70) return;
          var mid = L.latLng((sg[0][0] + sg[1][0]) / 2, (sg[0][1] + sg[1][1]) / 2);
          var ang = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
          L.marker(mid, { icon: L.divIcon({ className: '', html: '<div class="vy-arr" style="color:' + sg[2] + ';transform:rotate(' + ang + 'deg)">➤</div>', iconSize: [16, 16], iconAnchor: [8, 8] }), interactive: false, keyboard: false }).addTo(arrows);
        });
      }
      map.on('zoomend', drawArrows);
      function fit() { if (all.length === 1) map.setView(all[0], 9); else map.fitBounds(L.latLngBounds(all), { padding: [44, 44] }); }
      fit(); drawArrows();
      setTimeout(function () { map.invalidateSize(); fit(); drawArrows(); }, 250);
      /* Legenda: jedna „etapa“ na díl — Díl 1: Praha → Tábor · 62 km. Klepnutí přiblíží daný úsek. */
      var lg = document.getElementById('vyLegend'); lg.textContent = '';
      legs.forEach(function (g, i) {
        if (!g.length) return;
        var chip = document.createElement('button'); chip.type = 'button'; chip.className = 'vy-chip'; chip.setAttribute('data-i', i); chip.style.setProperty('--c', col(i));
        var a = g[0].place, b = g[g.length - 1].place;
        chip.innerHTML = '<i>' + (i + 1) + '</i><span></span>';
        chip.lastChild.textContent = (a && b && a !== b ? a + ' → ' + b : (a || list[i].title || 'Díl ' + (i + 1))) + (kmLeg[i] > 1 ? ' · ' + Math.round(kmLeg[i]) + ' km' : '');
        chip.onclick = function () { focus(i); };
        lg.appendChild(chip);
      });
      var all_ = document.createElement('button'); all_.type = 'button'; all_.className = 'vy-chip vy-all'; all_.textContent = '⤢ Celá cesta'; all_.onclick = function () { fit(); document.querySelectorAll('#vyLegend .vy-chip').forEach(function (c) { c.classList.remove('on'); }); }; lg.appendChild(all_);
      var n = legs.filter(function (g) { return g.length; }).length;
      document.getElementById('vyMapNote').textContent = n + ' ' + (n === 1 ? 'zastávka' : n < 5 ? 'zastávky' : 'zastávek') + (total > 1 ? ' • přibližně ' + Math.round(total) + ' km celkem' : '') + ' • čísla na mapě odpovídají dílům pod ní';
    }
    var arts = [];
    try { var r = await fetch('/api/articles/list'); arts = r.ok ? await r.json() : []; } catch (e) {}
    arts = (Array.isArray(arts) ? arts : []).filter(function (a) { return a && a.published !== false && !a.unlisted && String(a.subsectionId || '') === sub && (!sec || String(a.sectionId || '') === sec); })
      .sort(function (a, b) { return (ts(a) - ts(b)) || ((a.created || 0) - (b.created || 0)); });
    if (!sub || !arts.length) { tl.innerHTML = '<div class="empty">Tenhle výlet jsem nenašel.</div>'; return; }
    var name = 'Výlet';
    try { var rs = await fetch('/api/subsections/by-section?sectionId=' + encodeURIComponent(sec || arts[0].sectionId || '')); var subs = rs.ok ? await rs.json() : [];
      var s = (Array.isArray(subs) ? subs : []).filter(function (x) { return String(x.id) === String(sub); })[0]; if (s && s.name) name = s.name; } catch (e) {}
    document.getElementById('vyTitle').textContent = name;
    document.title = name + ' — Moje diagnóza, můj vesmír';
    var places = {}; arts.forEach(function (a) { if (a.place) places[a.place] = 1; });
    var np = Object.keys(places).length;
    var d1 = fmt(arts[0].date || arts[0].created), d2 = fmt(arts[arts.length - 1].date || arts[arts.length - 1].created);
    document.getElementById('vySub').textContent = arts.length + ' ' + (arts.length === 1 ? 'díl' : (arts.length < 5 ? 'díly' : 'dílů')) + (np ? ' • ' + np + ' ' + (np === 1 ? 'místo' : (np < 5 ? 'místa' : 'míst')) : '') + (d1 ? ' • ' + d1 + (d2 && d2 !== d1 ? ' – ' + d2 : '') : '');
    tl.textContent = '';
    arts.forEach(function (a, i) {
      var it = document.createElement('div'); it.className = 'tl-item';
      var dot = document.createElement('div'); dot.className = 'tl-dot'; dot.textContent = i + 1;
      var c = document.createElement('a'); c.className = 'tl-card'; c.href = '/article?id=' + encodeURIComponent(a.id);
      if (a.coverUrl) { var im = document.createElement('img'); im.src = a.coverUrl; im.alt = ''; im.loading = i < 2 ? 'eager' : 'lazy'; im.decoding = 'async'; c.appendChild(im); }
      var b = document.createElement('div'); b.className = 'tl-body';
      var m = document.createElement('div'); m.className = 'tl-meta'; m.textContent = [fmt(a.date || a.created), a.place ? '📍 ' + a.place : ''].filter(Boolean).join(' • ');
      var h = document.createElement('div'); h.className = 'tl-title'; h.textContent = a.title || 'Bez názvu';
