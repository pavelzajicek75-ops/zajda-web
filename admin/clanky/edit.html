<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Editor článku – Admin</title>
  <link rel="stylesheet" href="/admin/style.css?v=4">

  <style>
    .editor-wrapper {
      display: flex;
      gap: 20px;
      height: calc(100vh - 80px);
    }

    .editor-left, .editor-right {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #222;
      border-bottom: 1px solid #444;
    }

    #toolbar button {
      background: #333;
      color: white;
      border: none;
      padding: 6px 10px;
      cursor: pointer;
    }

    #editor {
      flex: 1;
      width: 100%;
      padding: 15px;
      background: #111;
      color: #eee;
      border: none;
      outline: none;
      resize: none;
      font-size: 16px;
      font-family: monospace;
    }

    #preview {
      flex: 1;
      padding: 15px;
      background: #181818;
      color: #ddd;
      overflow-y: auto;
      border-left: 1px solid #333;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>Admin</h2>
  <ul>
    <li><a href="/admin/dashboard.html">Dashboard</a></li>
    <li><a href="/admin/clanky/index.html" class="active">Články</a></li>
    <li><a href="/admin/gallery/">Fotky</a></li>
    <li><a href="/admin/citaty/index.html">Citáty</a></li>
    <li><a href="/admin/nastaveni.html">Nastavení</a></li>
    <li><a href="#" onclick="logout()">Odhlásit se</a></li>
  </ul>
</div>

<div class="main">
  <h1>Editor článku</h1>

  <div class="editor-wrapper">

    <div class="editor-left">
      <div id="toolbar">
        <button onclick="wrap('**','**')">B</button>
        <button onclick="wrap('*','*')">I</button>
        <button onclick="wrap('# ','')">H1</button>
        <button onclick="wrap('## ','')">H2</button>
        <button onclick="wrap('- ','')">•</button>
        <button onclick="insertImage()">🖼 Obrázek</button>
        <button onclick="saveArticle()">💾 Uložit</button>
      </div>

      <textarea id="editor" placeholder="Začni psát článek..."></textarea>
    </div>

    <div class="editor-right">
      <h3>Náhled</h3>
      <div id="preview"></div>
    </div>

  </div>
</div>

<script src="/admin/auth.js?v=4"></script>
<script src="/admin/clanky/edit.js?v=4"></script>

</body>
</html>
