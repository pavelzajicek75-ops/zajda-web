<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Editor článku – Admin</title>
  <link rel="stylesheet" href="/admin/style.css?v=6">

  <style>
    .form-block { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }

    input, select {
      width: 100%;
      padding: 10px;
      background: #111;
      color: #eee;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 16px;
    }

    #toolbar {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #222;
      border: 1px solid #333;
      margin-bottom: 10px;
    }

    #toolbar button {
      background: #333;
      color: white;
      border: none;
      padding: 6px 10px;
      cursor: pointer;
    }

    #editor {
      width: 100%;
      min-height: 500px;
      background: #111;
      color: #eee;
      border: 1px solid #333;
      padding: 15px;
      border-radius: 4px;
      outline: none;
      font-size: 18px;
      line-height: 1.6;
    }

    #editor img {
      max-width: 100%;
      margin: 10px 0;
      border-radius: 6px;
    }

    #editor h1, #editor h2, #editor h3 {
      margin-top: 20px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>Admin</h2>
  <ul>
    <li><a href="/admin/dashboard.html">Dashboard</a></li>
    <li><a href="/admin/clanky/index.html" class="active">Články</a></li>
    <li><a href="/admin/gallery/">Fotky</a></li>
    <li><a href="/admin/citaty/index.html">Citáty</a></li>
    <li><a href="/admin/nastaveni.html">Nastavení</a></li>
    <li><a href="#" onclick="logout()">Odhlásit se</a></li>
  </ul>
</div>

<div class="main">
  <h1>Editor článku</h1>

  <div class="form-block">
    <label>Název článku</label>
    <input type="text" id="title">
  </div>

  <div class="form-block">
    <label>Sekce</label>
    <select id="section"></select>
  </div>

  <div class="form-block">
    <label>Podsekce</label>
    <select id="subsection"></select>
  </div>

  <div class="form-block">
    <label>Obsah článku</label>

    <div id="toolbar">
      <button onclick="format('bold')">B</button>
      <button onclick="format('italic')">I</button>
      <button onclick="formatBlock('h1')">H1</button>
      <button onclick="formatBlock('h2')">H2</button>
      <button onclick="formatBlock('h3')">H3</button>
      <button onclick="format('insertUnorderedList')">•</button>
      <button onclick="insertImage()">🖼 Obrázek</button>
      <button onclick="saveArticle()">💾 Uložit</button>
    </div>

    <div id="editor" contenteditable="true"></div>
  </div>

</div>

<script src="/admin/auth.js?v=6"></script>
<script src="/admin/clanky/edit.js?v=6"></script>

</body>
</html>
