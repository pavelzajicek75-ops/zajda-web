<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Editor článků</title>
  <link rel="stylesheet" href="/admin/clanky/style.css?v=4">
</head>
<body>

<div class="topbar">
  <button onclick="openGallery()">📸 Fotky</button>
  <button onclick="saveArticle()">💾 Uložit</button>
  <button onclick="previewArticle()">👁️ Náhled</button>
  <button onclick="goBack()">↩️ Zpět</button>
</div>

<div class="editor-form">

  <label>Název článku</label>
  <input id="title" type="text" class="input">

  <label>Sekce</label>
  <select id="section" class="input"></select>

  <label>Podsekce</label>
  <div class="row">
    <select id="subsection" class="input"></select>
    <button onclick="addSubsection()" class="mini-btn">+ podsekce</button>
  </div>

  <label>Místo</label>
  <input id="place" type="text" class="input">

  <label>Datum</label>
  <input id="date" type="date" class="input">

  <label>Obsah článku</label>
  <div id="editor" class="editor-area" contenteditable="true"></div>

</div>

<!-- MODAL GALERIE -->
<div id="galleryModal" class="modal hidden">
  <div class="modal-content">
    <span class="close" onclick="closeGallery()">&times;</span>
    <iframe id="galleryFrame" src="/admin/gallery/" class="photo-frame"></iframe>
  </div>
</div>

<script src="/admin/clanky/app.js?v=4"></script>
</body>
</html>
