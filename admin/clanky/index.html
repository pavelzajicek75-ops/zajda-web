<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Editor článků</title>
  <link rel="stylesheet" href="/admin/clanky/editor.css">
</head>
<body>

<div class="editor-container">

  <div class="editor-left">
    <h2>Editor článku</h2>

    <label for="title"><strong>Název článku</strong></label>
    <input id="title" type="text" class="input">

    <label for="category"><strong>Kategorie</strong></label>
    <select id="category" class="input"></select>

    <label for="perex"><strong>Perex</strong></label>
    <textarea id="perex" class="input"></textarea>

    <label for="editor"><strong>Obsah článku</strong></label>
    <div id="editor" class="editor-area" contenteditable="true"></div>

    <div class="toolbar">
      <button type="button" onclick="openPhotoModal()">📸 Vložit fotku</button>
      <button type="button" onclick="saveArticle()">💾 Uložit článek</button>
    </div>
  </div>

  <div class="editor-right">
    <h3>Náhled článku</h3>
    <div id="preview"></div>
  </div>

</div>

<!-- MODAL S GALERIÍ -->
<div id="photoModal" class="modal hidden">
  <div class="modal-content">
    <span class="close" onclick="closePhotoModal()">&times;</span>
    <iframe src="/admin/galerie" class="photo-frame"></iframe>
  </div>
</div>

<script src="/admin/clanky/editor.js"></script>
</body>
</html>
