<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Editor článků</title>
  <link rel="stylesheet" href="/admin/clanky/style.css">
</head>
<body>

<!-- 🔥 MODERNÍ TOPBAR -->
<div class="topbar">
  <div class="toolbar-left">
    <button onclick="openGallery()">📸</button>
    <button onclick="saveArticle()">💾</button>
  </div>

  <div class="toolbar-center">
    <button onclick="format('bold')"><b>B</b></button>
    <button onclick="format('italic')"><i>I</i></button>
    <button onclick="format('underline')"><u>U</u></button>

    <button onclick="format('insertUnorderedList')">•</button>
    <button onclick="format('insertOrderedList')">1.</button>

    <button onclick="format('justifyLeft')">⬅️</button>
    <button onclick="format('justifyCenter')">↔️</button>
    <button onclick="format('justifyRight')">➡️</button>

    <button onclick="insertLink()">🔗</button>
    <button onclick="insertQuote()">❝</button>
    <button onclick="insertHR()">─</button>
  </div>
</div>

<div class="editor-container">
  <div class="editor-form">

    <label><strong>Název článku</strong></label>
    <input id="title" type="text" class="input">

    <label><strong>Sekce</strong></label>
    <select id="section" class="input"></select>

    <label><strong>Podsekce</strong></label>
    <select id="subsection" class="input"></select>

    <label><strong>Místo</strong></label>
    <input id="place" type="text" class="input">

    <label><strong>Obsah článku</strong></label>
    <div id="editor" class="editor-area" contenteditable="true"></div>

  </div>
</div>

<!-- MODAL S GALERIÍ -->
<div id="galleryModal" class="modal hidden">
  <div class="modal-content">
    <span class="close" onclick="closeGallery()">&times;</span>
    <iframe src="/admin/gallery" class="photo-frame"></iframe>
  </div>
</div>

<script src="/admin/clanky/app.js"></script>
</body>
</html>
