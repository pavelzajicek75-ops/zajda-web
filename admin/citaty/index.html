<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Citáty – Administrace</title>
  <script type="module" src="/admin/admin-guard.js"></script>
  <link rel="stylesheet" href="/admin/citaty/quotes.css">
</head>
<body>

  <h1>Citáty</h1>

  <button id="btn-add">➕ Nový citát</button>
  <button id="btn-delete-selected">🗑️ Smazat vybrané</button>

  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="select-all"></th>
        <th>Text</th>
        <th>Autor</th>
        <th>Vytvořeno</th>
        <th>Upraveno</th>
        <th>Akce</th>
      </tr>
    </thead>
    <tbody id="quotes-tbody"></tbody>
  </table>

  <div id="form-section" class="hidden">
    <h2 id="form-title">Nový citát</h2>
    <form id="quote-form">
      <input type="hidden" id="quote-id">
      <label>Text:</label><br>
      <textarea id="quote-text" rows="4" style="width:100%;"></textarea><br><br>
      <label>Autor:</label><br>
      <input type="text" id="quote-author" style="width:100%;"><br><br>
      <button type="submit">💾 Uložit</button>
      <button type="button" id="btn-cancel">Zpět</button>
    </form>
  </div>

  <!-- 🔥 SPRÁVNÁ CESTA -->
  <script src="/admin/citaty/quotes.js"></script>

</body>
</html>
