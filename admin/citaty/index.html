<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Citáty – Admin</title>
  <link rel="stylesheet" href="/admin/style.css?v=13">

  <style>
    body { background:#0b0b1a; color:#eee; font-family:Arial; }

    table { width:100%; border-collapse:collapse; margin-top:20px; }
    th, td { padding:12px; border-bottom:1px solid #333; }

    button {
      background:#ff6600;
      border:none;
      padding:12px 20px;
      color:#fff;
      cursor:pointer;
      font-size:18px;
      border-radius:6px;
    }

    @media (max-width: 768px) {
      button { font-size:22px; padding:16px 26px; }
    }

    #editModal {
      display:none;
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.7);
      justify-content:center;
      align-items:center;
      z-index:9999;
    }

    #editBox {
      background:#111;
      padding:20px;
      border-radius:8px;
      width:90%;
      max-width:450px;
    }

    textarea, input {
      width:100%;
      padding:10px;
      margin-top:10px;
      background:#222;
      color:#eee;
      border:1px solid #444;
      border-radius:6px;
      font-size:16px;
    }
  </style>
</head>

<body>

<h1>Citáty</h1>

<button onclick="openNew()">+ Nový citát</button>

<table id="quotesTable">
  <thead>
    <tr><th>Text</th><th>Autor</th><th>Akce</th></tr>
  </thead>
  <tbody></tbody>
</table>

<div id="editModal">
  <div id="editBox">
    <h3 id="modalTitle">Citát</h3>

    <input type="hidden" id="quoteId">

    <textarea id="quoteText" rows="4"></textarea>
    <input type="text" id="quoteAuthor" placeholder="Autor">

    <div style="margin-top:15px;">
      <button onclick="saveQuote()">💾 Uložit</button>
      <button onclick="closeModal()">Zavřít</button>
    </div>
  </div>
</div>

<script src="/admin/auth.js?v=13"></script>
<script src="/admin/citaty/index.js?v=13"></script>

</body>
</html>
