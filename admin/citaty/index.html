<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quotes Management</title>
  <link rel="stylesheet" href="quotes.css?v=2" />
</head>
<body>
  <header class="top-bar">
    <h1>Quotes Management</h1>
    <button id="btn-add">Add Quote</button>
    <button id="btn-delete-selected">Delete Selected</button>
  </header>

  <main>
    <section id="form-section" class="hidden">
      <h2 id="form-title">New Quote</h2>
      <form id="quote-form">
        <input type="hidden" id="quote-id" />
        <div class="field">
          <label for="quote-text">Quote text (EN)</label>
          <textarea id="quote-text" required></textarea>
        </div>
        <div class="field">
          <label for="quote-author">Author</label>
          <input id="quote-author" type="text" />
        </div>
        <div class="actions">
          <button type="submit">Save</button>
          <button type="button" id="btn-cancel">Cancel</button>
        </div>
      </form>
    </section>

    <section id="list-section">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="select-all" /></th>
            <th>Quote</th>
            <th>Author</th>
            <th>Created</th>
            <th>Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="quotes-tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="quotes.js?v=2"></script>
</body>
</html>
