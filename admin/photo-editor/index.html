<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foto Editor — Zajda Web</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="starfield"></div>

  <nav>
    <a href="/" class="logo">ZAJDA</a>
    <ul class="nav-links">
      <li><a href="/admin/gallery/">← Galerie</a></li>
    </ul>
  </nav>

  <main class="editor-main">
    <div class="editor-toolbar">
      <div class="tool-group">
        <label>Ořez</label>
        <select id="crop-ratio" onchange="setCropRatio(this.value)">
          <option value="free">Volný</option>
          <option value="1:1">1:1</option>
          <option value="4:3">4:3</option>
          <option value="3:4">3:4</option>
          <option value="16:9">16:9</option>
        </select>
      </div>
      <div class="tool-group">
        <label>Rotace</label>
        <button onclick="rotate(90)">↻ 90°</button>
        <button onclick="rotate(180)">↻ 180°</button>
        <button onclick="rotate(270)">↻ 270°</button>
      </div>
      <div class="tool-group">
        <label>Převrácení</label>
        <button onclick="flip('h')">↔ Vodorovně</button>
        <button onclick="flip('v')">↕ Svisle</button>
      </div>
      <div class="tool-group">
        <label>Zobrazení</label>
        <button onclick="toggleGrid()">⊞ Mřížka</button>
        <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
      </div>
      <div class="tool-group">
        <label>Akce</label>
        <button class="btn btn-primary" onclick="saveImage()">💾 Uložit</button>
        <button class="btn btn-secondary" onclick="resetEdits()">↺ Reset</button>
      </div>
    </div>

    <div class="editor-workspace">
      <div class="canvas-container" id="canvas-container">
        <canvas id="editor-canvas"></canvas>
        <div id="grid-overlay" class="grid-overlay hidden">
          <div class="grid-line grid-h1"></div>
          <div class="grid-line grid-h2"></div>
          <div class="grid-line grid-v1"></div>
          <div class="grid-line grid-v2"></div>
        </div>
      </div>

      <div class="editor-sidebar">
        <h3>Úpravy obrazu</h3>

        <div class="slider-group">
          <label>Jas <span id="val-brightness">100</span>%</label>
          <input type="range" id="brightness" min="0" max="200" value="100" oninput="updateFilter()">
        </div>

        <div class="slider-group">
          <label>Kontrast <span id="val-contrast">100</span>%</label>
          <input type="range" id="contrast" min="0" max="200" value="100" oninput="updateFilter()">
        </div>

        <div class="slider-group">
          <label>Saturace <span id="val-saturate">100</span>%</label>
          <input type="range" id="saturate" min="0" max="200" value="100" oninput="updateFilter()">
        </div>

        <div class="slider-group">
          <label>Vibrance <span id="val-vibrance">100</span>%</label>
          <input type="range" id="vibrance" min="0" max="200" value="100" oninput="updateFilter()">
        </div>

        <div class="slider-group">
          <label>Teplota <span id="val-temperature">0</span></label>
          <input type="range" id="temperature" min="-100" max="100" value="0" oninput="updateFilter()">
        </div>

        <div class="slider-group">
          <label>Stíny <span id="val-shadows">0</span></label>
          <input type="range" id="shadows" min="-100" max="100" value="0" oninput="updateFilter()">
        </div>

        <div class="slider-group">
          <label>Světla <span id="val-highlights">0</span></label>
          <input type="range" id="highlights" min="-100" max="100" value="0" oninput="updateFilter()">
        </div>

        <div class="slider-group">
          <label>Clarity <span id="val-clarity">0</span></label>
          <input type="range" id="clarity" min="-100" max="100" value="0" oninput="updateFilter()">
        </div>

        <div class="slider-group">
          <label>Dehaze <span id="val-dehaze">0</span></label>
          <input type="range" id="dehaze" min="-100" max="100" value="0" oninput="updateFilter()">
        </div>

        <div class="slider-group">
          <label>Ostrost <span id="val-sharpen">0</span></label>
          <input type="range" id="sharpen" min="0" max="100" value="0" oninput="updateFilter()">
        </div>

        <div class="slider-group">
          <label>Horizont <span id="val-horizon">0</span>°</label>
          <input type="range" id="horizon" min="-45" max="45" value="0" oninput="updateFilter()">
        </div>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
  <script src="editor.js"></script>
</body>
</html>
