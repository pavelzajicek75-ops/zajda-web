<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Přihlášení - Admin Panel</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: url('/assets/bg-stars.jpg') center/cover fixed;
      background-color: #0a0e27;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-container {
      background: rgba(20, 20, 20, 0.95);
      border: 2px solid #ff6600;
      border-radius: 8px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 30px rgba(255, 102, 0, 0.3);
    }

    .login-container h1 {
      color: #ff6600;
      text-align: center;
      margin: 0 0 30px 0;
      font-size: 28px;
      text-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #ff6600;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
      transition: 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #ff6600;
      box-shadow: 0 0 10px rgba(255, 102, 0, 0.3);
    }

    .login-button {
      width: 100%;
      padding: 12px;
      background: #ff6600;
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
      margin-top: 10px;
    }

    .login-button:hover {
      background: #ffa500;
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
    }

    .login-button:disabled {
      background: #666;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 4px;
      text-align: center;
      display: none;
    }

    #message.error {
      background: rgba(255, 102, 0, 0.2);
      color: #ff6600;
    }

    #message.success {
      background: rgba(0, 255, 0, 0.2);
      color: #0f0;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h1>🔐 ADMIN PANEL</h1>
  
  <form id="loginForm">
    <div class="form-group">
      <label for="username">Uživatelské jméno:</label>
      <input type="text" id="username" required autofocus>
    </div>

    <div class="form-group">
      <label for="password">Heslo:</label>
      <input type="password" id="password" required>
    </div>

    <button type="submit" class="login-button">Přihlásit se</button>

    <div id="message"></div>
  </form>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const messageDiv = document.getElementById("message");
  const button = e.target.querySelector("button");

  button.disabled = true;
  messageDiv.textContent = "Přihlašuji...";
  messageDiv.className = "";
  messageDiv.style.display = "block";

  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Přihlášení selhalo");
    }

    // Ulož token
    localStorage.setItem("adminToken", data.token);
    
    messageDiv.className = "success";
    messageDiv.textContent = "✅ Přihlášení úspěšné...";
    
    setTimeout(() => {
      window.location.href = "/admin/dashboard.html";
    }, 1000);
  } catch (err) {
    messageDiv.className = "error";
    messageDiv.textContent = "❌ " + err.message;
    button.disabled = false;
  }
});

// Zkontroluj, jestli je již přihlášen
window.addEventListener("DOMContentLoaded", () => {
  const token = localStorage.getItem("adminToken");
  if (token) {
    window.location.href = "/admin/dashboard.html";
  }
});
</script>

</body>
</html>
