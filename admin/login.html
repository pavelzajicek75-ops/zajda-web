<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: #222;
      padding: 30px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 0 20px #000;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4caf50;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .show-pass {
      cursor: pointer;
      color: #aaa;
      font-size: 14px;
      margin-top: -5px;
      display: block;
      text-align: right;
      user-select: none;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2>Přihlášení</h2>

  <input id="login" type="text" placeholder="Login">

  <input id="password" type="password" placeholder="Heslo">
  <span id="togglePass" class="show-pass">👁️ zobrazit heslo</span>

  <button id="loginBtn">Přihlásit</button>
</div>

<!-- 🔥 ABSOLUTNÍ CESTA – TADY BYLA CHYBA -->
<script src="/admin/login.js"></script>

</body>
</html>
