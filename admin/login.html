<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Přihlášení – Admin</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body class="login-body">

<div class="login-box">
  <h1>Admin přihlášení</h1>

  <input id="username" type="text" placeholder="Uživatel">

  <div class="password-row">
    <input id="password" type="password" placeholder="Heslo">
    <button class="show-btn" onclick="togglePassword()">👁️</button>
  </div>

  <button class="login-btn" onclick="login()">Přihlásit se</button>

  <div class="change-pass">
    <a href="/admin/password.html">Změnit heslo</a>
  </div>
</div>

<script src="/admin/login.js"></script>
</body>
</html>
