<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Výběr obrázku</title>
  <link rel="stylesheet" href="/admin/style.css?v=7">
  <style>
    body { padding: 20px; }
    .img-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }
    .img-grid img {
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .img-grid img:hover {
      border-color: #4caf50;
    }
  </style>
</head>

<body>

<h2>Vyber obrázek</h2>

<div class="img-grid" id="gallery"></div>

<script src="/admin/auth.js?v=7"></script>
<script src="/admin/gallery/picker.js?v=7"></script>

</body>
</html>
