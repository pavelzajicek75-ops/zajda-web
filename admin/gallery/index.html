<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Dark Profi Galerie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <header>
    <h1>📸 Galerie</h1>

    <div class="toolbar">
      <button id="uploadBtn">Nahrát</button>
      <button id="deleteSelectedBtn">Smazat vybrané</button>
      <button id="refreshBtn">Obnovit</button>

      <div class="modes">
        <button id="modeGrid">Grid</button>
        <button id="modeLarge">Large</button>
        <button id="modeList">List</button>
      </div>

      <button id="selectAllBtn">Vybrat vše</button>
    </div>
  </header>

  <section id="stats">
    <span id="photoCount">0 fotek</span>
    <span id="photoSize">0 MB</span>
    <span id="selectedCount">Vybráno: 0</span>
  </section>

  <main id="gallery" class="grid"></main>

  <input type="file" id="fileInput" multiple hidden>

  <!-- MODAL -->
  <div id="modal" class="hidden">
    <div id="modalContent">
      <img id="modalImg" src="">
      <h2 id="modalName"></h2>

      <div class="info">
        <p><strong>Rozlišení:</strong> <span id="modalResolution"></span></p>
        <p><strong>EXIF:</strong> <span id="modalExif"></span></p>
        <p><strong>Tagy:</strong> <span id="modalTags"></span></p>
      </div>

      <button id="closeModal">Zavřít</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
