<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Galerie — Zajda Web</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <div class="starfield"></div>

  <nav>
    <a href="/" class="logo">ZAJDA</a>
    <ul class="nav-links">
      <li><a href="/">Domů</a></li>
      <li><a href="/clanky/">Články</a></li>
      <li><a href="/admin/articles/editor.html">Editor</a></li>
      <li><a href="/admin/gallery/">Galerie</a></li>
    </ul>
  </nav>

  <main>
    <div class="gallery-sticky-panel">
      <div class="panel-left">
        <button class="btn btn-primary" onclick="document.getElementById('upload-input').click()">
          📤 Nahrát fotky
        </button>
        <input type="file" id="upload-input" multiple accept="image/*" style="display:none;" onchange="uploadFiles(this.files)">
        <button class="btn btn-danger" onclick="deleteSelected()" id="btn-delete" disabled>
          🗑️ Smazat (<span id="selected-count">0</span>)
        </button>
        <button class="btn btn-secondary" onclick="selectAll()">☑️ Vše</button>
        <button class="btn btn-secondary" onclick="deselectAll()">☐ Nic</button>
      </div>
      <div class="panel-center">
        <button class="view-btn active" onclick="setView('list')" title="Seznam">☰</button>
        <button class="view-btn" onclick="setView('small')" title="Malé náhledy">▦</button>
        <button class="view-btn" onclick="setView('large')" title="Velké náhledy">▪</button>
      </div>
      <div class="panel-right">
        <select id="sort-by" onchange="loadGallery()">
          <option value="date-desc">Nejnovější</option>
          <option value="date-asc">Nejstarší</option>
          <option value="name-asc">Název A-Z</option>
          <option value="name-desc">Název Z-A</option>
          <option value="size-desc">Největší</option>
          <option value="size-asc">Nejmenší</option>
        </select>
        <button class="btn btn-secondary" onclick="loadGallery()">🔄</button>
      </div>
      <div class="panel-info">
        <span id="file-count">0 fotek</span> ·
        <span id="storage-used">0 MB</span>
      </div>
    </div>

    <div id="gallery-container" class="gallery-view list-view">
      <div class="loading">Načítám galerii...</div>
    </div>
  </main>

  <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-info" id="lightbox-info"></div>
      <button class="lightbox-close" onclick="closeLightbox()">×</button>
      <button class="lightbox-edit" onclick="openEditor()">✏️ Upravit</button>
    </div>
  </div>

  <div id="upload-modal" class="modal">
    <div class="modal-content">
      <h3>Nahrávání fotek</h3>
      <div id="upload-progress"></div>
      <button class="btn btn-secondary" onclick="closeUploadModal()">Zavřít</button>
    </div>
  </div>

  <script src="/app.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
