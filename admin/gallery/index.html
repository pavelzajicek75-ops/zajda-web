<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Galerie</title>
  <link rel="stylesheet" href="/admin/gallery/style.css">
</head>
<body class="light">

<header id="topbar">
  <h1>Galerie</h1>

  <div class="controls">
    <button id="modeGrid">🟦 Mřížka</button>
    <button id="modeLarge">🟩 Velké</button>
    <button id="modeList">📄 Seznam</button>

    <button id="selectAllBtn">✅ Vybrat vše</button>

    <button id="uploadBtn">📤 Upload</button>
    <button id="deleteSelectedBtn">🗑️ Smazat vybrané</button>
    <button id="refreshBtn">🔄 Obnovit</button>

    <button id="themeToggle">🌙 Dark / Light</button>

    <input type="file" id="fileInput" multiple style="display:none">
  </div>

  <div class="stats">
    <div><span id="photoCount">0 fotek</span> • <span id="photoSize">0 MB</span></div>
    <div><span id="selectedCount">Vybráno: 0</span></div>
  </div>
</header>

<div id="gallery"></div>

<div id="modal" class="hidden">
  <div id="modalContent">
    <img id="modalImg">
    <div id="modalInfo">
      <div id="modalName"></div>
      <div id="modalResolution"></div>
      <div id="modalExif"></div>
      <div id="modalTags"></div>
    </div>
    <button id="closeModal">Zavřít</button>
  </div>
</div>

<script src="/admin/gallery/app.js"></script>
</body>
</html>
