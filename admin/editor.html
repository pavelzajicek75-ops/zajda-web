<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor článků - Moje diagnóza, můj vesmír</title>
  <link rel="stylesheet" href="/admin/style.css?v=2.0">
  <style>
    .editor-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .editor-section {
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid #ff6600;
      border-radius: 8px;
      padding: 20px;
    }

    .preview-section {
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid #ff6600;
      border-radius: 8px;
      padding: 20px;
      max-height: 800px;
      overflow-y: auto;
    }

    #articlePreview {
      color: #ddd;
      line-height: 1.6;
    }

    #articlePreview h2 {
      color: #ff6600;
      margin-top: 0;
    }

    #articlePreview .preview-meta {
      color: #999;
      font-size: 12px;
      margin-bottom: 15px;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
    }

    .upload-section {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      border: 1px dashed #ff6600;
    }

    .upload-section h4 {
      color: #ff6600;
      margin: 0 0 10px 0;
    }

    .photo-preview {
      margin-top: 10px;
      max-width: 100%;
      max-height: 200px;
      border-radius: 4px;
    }

    .inserted-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .photo-item {
      position: relative;
      cursor: pointer;
    }

    .photo-item img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      border: 2px solid #333;
      transition: 0.2s;
    }

    .photo-item img:hover {
      border-color: #ff6600;
    }

    .photo-item-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      background: #ff6600;
      color: #fff;
      border: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 12px;
      display: none;
    }

    .photo-item:hover .photo-item-remove {
      display: block;
    }

    .articles-list {
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
    }

    .article-item {
      background: rgba(30, 30, 30, 0.8);
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 4px;
      border-left: 3px solid #ff6600;
      cursor: pointer;
      transition: 0.2s;
    }

    .article-item:hover {
      background: rgba(40, 40, 40, 0.9);
    }

    .article-item-title {
      color: #ff6600;
      font-weight: bold;
      font-size: 14px;
    }

    .article-item-date {
      color: #999;
      font-size: 12px;
    }

    @media (max-width: 1024px) {
      .editor-wrapper {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<aside class="sidebar">
  <h2>ADMIN</h2>
  <ul>
    <li><a href="/admin/index.html">Dashboard</a></li>
    <li><a href="/admin/editor.html" class="active">Editor článků</a></li>
    <li><a href="/admin/upload.html">Fotogalerie</a></li>
    <li><a href="/">Domů</a></li>
  </ul>
</aside>

<main class="main">
  <h1>Editor Článků</h1>

  <div class="editor-wrapper">
    <!-- LEVÁ STRANA - EDITOR -->
    <div class="editor-section">
      <h3>Psaní článku</h3>
      
      <form id="articleForm">
        <div class="form-group">
          <label>ID článku:</label>
          <input type="text" id="articleId" readonly>
        </div>

        <div class="form-group">
          <label>Název:</label>
          <input type="text" id="articleTitle" required>
        </div>

        <div class="form-group">
          <label>Slug (URL):</label>
          <input type="text" id="articleSlug" required>
        </div>

        <div class="form-group">
          <label>Shrnutí:</label>
          <input type="text" id="articleExcerpt">
        </div>

        <div class="form-group">
          <label>Obsah (markdown):</label>
          <textarea id="articleContent" rows="15" required></textarea>
        </div>

        <div class="form-group">
          <label>Tagy (oddělené čárkou):</label>
          <input type="text" id="articleTags">
        </div>

        <!-- UPLOAD FOTEK -->
        <div class="upload-section">
          <h4>📸 Vložit fotku do obsahu</h4>
          <input type="file" id="photoUpload" accept="image/*">
          <div id="uploadStatus" style="margin-top: 10px; color: #ff6600; font-size: 12px;"></div>
          <div class="inserted-photos" id="insertedPhotos"></div>
        </div>

        <div class="button-group" style="margin-top: 20px;">
          <button type="submit" class="btn-primary">💾 Uložit článek</button>
          <button type="button" class="btn-secondary" onclick="resetEditor()">🔄 Nový</button>
          <button type="button" class="btn-secondary" onclick="deleteArticle()" id="deleteBtn" style="display:none;">🗑️ Smazat</button>
        </div>

        <div id="message" style="margin-top: 15px; padding: 10px; border-radius: 4px; display: none; text-align: center;"></div>
      </form>
    </div>

    <!-- PRAVÁ STRANA - NÁHLED + SEZNAM -->
    <div>
      <!-- NÁHLED -->
      <div class="preview-section">
        <h3>Náhled</h3>
        <div id="articlePreview">
          <p style="color: #999; text-align: center;">Náhled se bude aktualizovat při psaní...</p>
        </div>
      </div>

      <!-- SEZNAM ČLÁNKŮ -->
      <div class="articles-list">
        <h3>Existující články</h3>
        <div id="articlesList" style="color: #999;">Načítám články...</div>
      </div>
    </div>
  </div>
</main>

<style>
  .form-group {
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
  }

  .form-group label {
    color: #ff6600;
    font-weight: bold;
    margin-bottom: 5px;
    font-size: 14px;
  }

  .form-group input,
  .form-group textarea {
    padding: 10px;
    background: #1a1a1a;
    border: 1px solid #444;
    color: #fff;
    border-radius: 4px;
    font-family: monospace;
    resize: vertical;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: #ff6600;
    box-shadow: 0 0 10px rgba(255, 102, 0, 0.3);
  }

  .button-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn-primary {
    flex: 1;
    min-width: 120px;
    padding: 12px;
    background: #ff6600;
    border: none;
    color: #fff;
    cursor: pointer;
    border-radius: 4px;
    font-weight: bold;
    transition: 0.2s;
  }

  .btn-primary:hover {
    background: #ffa500;
    box-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
  }

  .btn-secondary {
    flex: 1;
    min-width: 100px;
    padding: 10px;
    background: #333;
    border: 1px solid #ff6600;
    color: #ff6600;
    cursor: pointer;
    border-radius: 4px;
    font-weight: bold;
    transition: 0.2s;
  }

  .btn-secondary:hover {
    background: #ff6600;
    color: #fff;
  }
</style>

<script>
let currentArticleId = null;
let uploadedPhotos = [];

// Generuj ID
function generateId() {
  return "article-" + Date.now() + "-" + Math.random().toString(36).substr(2, 9);
}

// Reset editoru
function resetEditor() {
  currentArticleId = null;
  document.getElementById("articleForm").reset();
  document.getElementById("articleId").value = generateId();
  document.getElementById("deleteBtn").style.display = "none";
  document.getElementById("insertedPhotos").innerHTML = "";
  uploadedPhotos = [];
  updatePreview();
}

// Načti článek
async function loadArticle(id) {
  try {
    const res = await fetch(`/api/articles/${id}`);
    if (!res.ok) return;

    const article = await res.json();
    currentArticleId = article.id;

    document.getElementById("articleId").value = article.id;
    document.getElementById("articleTitle").value = article.title;
    document.getElementById("articleSlug").value = article.slug;
    document.getElementById("articleExcerpt").value = article.excerpt || "";
    document.getElementById("articleContent").value = article.content;
    document.getElementById("articleTags").value = (article.tags || []).join(", ");

    document.getElementById("deleteBtn").style.display = "block";
    updatePreview();
  } catch (err) {
    console.error("Error loading article:", err);
  }
}

// Smaž článek
async function deleteArticle() {
  if (!currentArticleId || !confirm("Opravdu smazat tento článek?")) return;

  try {
    const res = await fetch(`/api/articles/${currentArticleId}`, {
      method: "DELETE"
    });

    if (res.ok) {
      showMessage("Článek smazán!", false);
      setTimeout(() => resetEditor(), 1500);
      loadArticlesList();
    }
  } catch (err) {
    showMessage("Chyba při mazání: " + err.message, true);
  }
}

// Aktualizuj náhled
function updatePreview() {
  const title = document.getElementById("articleTitle").value || "Bez názvu";
  const excerpt = document.getElementById("articleExcerpt").value;
  const content = document.getElementById("articleContent").value;

  const preview = `
    <h2>${title}</h2>
    <div class="preview-meta">
      ${excerpt ? `<p><strong>Shrnutí:</strong> ${excerpt}</p>` : ""}
      <p><strong>ID:</strong> ${document.getElementById("articleId").value}</p>
    </div>
    <div>${content.split("\n").join("<br>")}</div>
  `;

  document.getElementById("articlePreview").innerHTML = preview;
}

// Upload foto
document.getElementById("photoUpload").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append("file", file);
  formData.append("name", "article-photo");
  formData.append("version", Date.now().toString());

  try {
    document.getElementById("uploadStatus").textContent = "Nahrávám...";
    
    const res = await fetch("/api/photo/save-version", {
      method: "POST",
      body: formData
    });

    if (!res.ok) throw new Error("Upload selhalo");

    const result = await res.json();
    const photoUrl = `/api/photo/${result.saved}`;
    
    uploadedPhotos.push(photoUrl);
    displayPhotos();
    document.getElementById("uploadStatus").textContent = "✅ Fotka nahrána!";
    
    setTimeout(() => {
      document.getElementById("uploadStatus").textContent = "";
    }, 3000);
  } catch (err) {
    document.getElementById("uploadStatus").textContent = "❌ Chyba: " + err.message;
  }
});

// Zobraz fotky
function displayPhotos() {
  const container = document.getElementById("insertedPhotos");
  container.innerHTML = uploadedPhotos.map((url, idx) => `
    <div class="photo-item">
      <img src="${url}" alt="photo">
      <button class="photo-item-remove" onclick="removePhoto(${idx})">×</button>
    </div>
  `).join("");
}

// Odeber fotku
function removePhoto(idx) {
  uploadedPhotos.splice(idx, 1);
  displayPhotos();
}

// Zobraz zprávu
function showMessage(text, isError = false) {
  const div = document.getElementById("message");
  div.textContent = text;
  div.style.backgroundColor = isError ? "rgba(255, 102, 0, 0.2)" : "rgba(0, 255, 0, 0.2)";
  div.style.color = isError ? "#ff6600" : "#0f0";
  div.style.display = "block";

  setTimeout(() => div.style.display = "none", 4000);
}

// Ulož článek
document.getElementById("articleForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const article = {
    id: document.getElementById("articleId").value,
    title: document.getElementById("articleTitle").value,
    slug: document.getElementById("articleSlug").value,
    excerpt: document.getElementById("articleExcerpt").value,
    content: document.getElementById("articleContent").value + (uploadedPhotos.length ? "\n\n--- Fotky ---\n" + uploadedPhotos.map(url => `![](${url})`).join("\n") : ""),
    tags: document.getElementById("articleTags").value.split(",").map(t => t.trim()).filter(t => t)
  };

  try {
    const res = await fetch("/api/articles/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(article)
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error);
    }

    showMessage("✅ Článek uložen!", false);
    uploadedPhotos = [];
    document.getElementById("insertedPhotos").innerHTML = "";
    
    setTimeout(() => {
      resetEditor();
      loadArticlesList();
    }, 1500);
  } catch (err) {
    showMessage("❌ Chyba: " + err.message, true);
  }
});

// Načti seznam
async function loadArticlesList() {
  try {
    const res = await fetch("/api/articles/list");
    if (!res.ok) return;

    const data = await res.json();
    const articles = data.articles || [];

    const container = document.getElementById("articlesList");
    if (articles.length === 0) {
      container.innerHTML = "<p style='color: #999;'>Zatím žádné články</p>";
      return;
    }

    container.innerHTML = articles.map(a => `
      <div class="article-item" onclick="loadArticle('${a.id}')">
        <div class="article-item-title">${a.title}</div>
        <div class="article-item-date">${new Date(a.created).toLocaleDateString('cs-CZ')}</div>
      </div>
    `).join("");
  } catch (err) {
    console.error("Error loading articles:", err);
  }
}

// Inicializace
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("articleId").value = generateId();
  
  document.getElementById("articleTitle").addEventListener("input", updatePreview);
  document.getElementById("articleExcerpt").addEventListener("input", updatePreview);
  document.getElementById("articleContent").addEventListener("input", updatePreview);

  loadArticlesList();
});
</script>

</body>
</html>
