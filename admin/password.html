<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Změna hesla</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body class="login-body">

<div class="login-box">
  <h1>Změna hesla</h1>

  <input id="oldPass" type="password" placeholder="Staré heslo">
  <input id="newPass" type="password" placeholder="Nové heslo">
  <input id="newPass2" type="password" placeholder="Nové heslo znovu">

  <button class="login-btn" onclick="changePassword()">Uložit nové heslo</button>
</div>

<script>
function changePassword() {
  const oldPass = document.getElementById("oldPass").value.trim();
  const newPass = document.getElementById("newPass").value.trim();
  const newPass2 = document.getElementById("newPass2").value.trim();

  const savedPass = localStorage.getItem("adminPassword") || "vesmir2026";

  if (oldPass !== savedPass) {
    alert("❌ Staré heslo není správné.");
    return;
  }

  if (newPass !== newPass2) {
    alert("❌ Nová hesla se neshodují.");
    return;
  }

  localStorage.setItem("adminPassword", newPass);
  alert("✔️ Heslo změněno.");
  window.location.href = "/admin/login.html";
}
</script>

</body>
</html>
