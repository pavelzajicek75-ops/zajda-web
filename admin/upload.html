<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Nahrát fotku</title>
  <style>
    body { background:#111; color:#eee; font-family:Arial; padding:40px; }
    input, button { padding:10px; margin:10px 0; }
    button { background:#ff6600; border:none; color:#fff; cursor:pointer; }
  </style>
</head>
<body>

<h1>Nahrát fotku</h1>

<input type="file" id="fileInput">
<br>
<input type="text" id="nameInput" placeholder="název souboru (např. foto.jpg)">
<br>
<button onclick="upload()">Nahrát</button>

<pre id="output"></pre>

<script>
async function upload() {
  const fileInput = document.getElementById("fileInput");
  const nameInput = document.getElementById("nameInput");
  const output = document.getElementById("output");

  if (!fileInput.files.length) {
    output.textContent = "Vyber soubor!";
    return;
  }

  const file = fileInput.files[0];
  const name = nameInput.value.trim() || file.name;

  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = reader.result.split(",")[1];

    const res = await fetch("/api/photo/save-version", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name,
        file: base64
      })
    });

    const text = await res.text();
    output.textContent = text;
  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
