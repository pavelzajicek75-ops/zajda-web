<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Admin dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #050509;
      color: #fff;
    }
    header {
      padding: 16px 24px;
      background: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    header h1 {
      margin: 0;
      font-size: 20px;
    }
    header button {
      background: #ff6600;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    main {
      padding: 20px 24px;
    }
    .section-title {
      font-size: 18px;
      margin-bottom: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .photo-card {
      background: #151515;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
    }
    .photo-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }
    .photo-meta {
      padding: 8px 10px;
      font-size: 12px;
      color: #ccc;
    }
    .photo-actions {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
    }
    .photo-actions button {
      border: none;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-delete {
      background: #b00020;
      color: #fff;
    }
    .btn-info {
      background: #333;
      color: #ffcc66;
    }
    #upload-form {
      margin-bottom: 20px;
      padding: 12px;
      background: #111;
      border-radius: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #upload-form input[type="file"] {
      color: #fff;
    }
    #upload-form button {
      background: #ff6600;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #ffcc66;
    }
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #modal-content {
      background: #111;
      padding: 20px;
      border-radius: 8px;
      max-width: 480px;
      color: #fff;
      font-size: 13px;
    }
    #modal-content h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }
    #modal-close {
      margin-top: 12px;
      background: #333;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Admin dashboard – Galerie</h1>
    <button id="logout-btn">Odhlásit</button>
  </header>

  <main>
    <section>
      <div class="section-title">Nahrát novou fotku</div>
      <form id="upload-form">
        <input type="file" id="file-input" accept="image/*" />
        <button type="submit">Nahrát</button>
      </form>
      <div id="status"></div>
    </section>

    <section>
      <div class="section-title">Fotky v galerii</div>
      <div id="photo-grid" class="grid"></div>
    </section>
  </main>

  <div id="modal">
    <div id="modal-content">
      <h2>Informace o fotce</h2>
      <pre id="modal-body"></pre>
      <button id="modal-close">Zavřít</button>
    </div>
  </div>

  <script src="/admin/dashboard.js"></script>
</body>
</html>
