<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Editor fotek</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="editor">
    <div id="left">
      <canvas id="canvas"></canvas>
    </div>
    <div id="right">
      <h2>Úpravy</h2>
      <div class="controls">
        <label>Jas</label><input type="range" id="brightness" min="0" max="200" value="100">
        <label>Kontrast</label><input type="range" id="contrast" min="0" max="200" value="100">
        <label>Saturace</label><input type="range" id="saturation" min="0" max="200" value="100">
        <label>Živost</label><input type="range" id="vibrance" min="-100" max="100" value="0">
        <label>Ostrost</label><input type="range" id="sharpness" min="0" max="10" value="0">
        <label>Šum</label><input type="range" id="denoise" min="0" max="10" value="0">
      </div>

      <h2>AI funkce</h2>
      <div class="buttons">
        <button id="aiEnhance">AI Vylepšit</button>
        <button id="hdr">HDR</button>
        <button id="portrait">Portrét</button>
        <button id="upscale">Zvětšit 2×</button>
      </div>

      <h2>Otočení / Ořez</h2>
      <div class="buttons">
        <button id="rotateLeft">↺</button>
        <button id="rotateRight">↻</button>
        <button id="cropMode">Ořez</button>
        <button id="applyCrop">Použít ořez</button>
      </div>

      <h2>Uložení</h2>
      <div class="buttons">
        <button id="save">💾 Uložit</button>
        <button id="back">← Zpět</button>
      </div>
    </div>
  </div>
  <script src="editor.js"></script>
</body>
</html>
