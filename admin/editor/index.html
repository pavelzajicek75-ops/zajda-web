<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Editor fotky</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <button id="backBtn" class="btn">← Zpět</button>
  <h1 id="filename"></h1>
  <button id="saveBtn" class="btn primary">💾 Uložit vybrané</button>
</header>

<main id="layout">
  <section id="canvasWrap">
    <canvas id="canvas"></canvas>
  </section>

  <aside id="sidePanel">
    <div id="tabs">
      <button class="tab active" data-tab="basic">🌞 Základní</button>
      <button class="tab" data-tab="color">🎨 Barva</button>
      <button class="tab" data-tab="effects">✨ Efekty</button>
    </div>

    <div id="tabContent">
      <!-- ZÁKLADNÍ -->
      <div class="tabPane active" data-tab="basic">
        <div class="sliderRow">
          <label>Jas</label>
          <input type="range" id="sl_brightness" min="-50" max="50" value="0">
          <span id="val_brightness">0</span>
        </div>
        <div class="sliderRow">
          <label>Kontrast</label>
          <input type="range" id="sl_contrast" min="-50" max="50" value="0">
          <span id="val_contrast">0</span>
        </div>
        <div class="sliderRow">
          <label>Expozice</label>
          <input type="range" id="sl_exposure" min="-2" max="2" step="0.1" value="0">
          <span id="val_exposure">0</span>
        </div>
      </div>

      <!-- BARVA -->
      <div class="tabPane" data-tab="color">
        <div class="sliderRow">
          <label>Živost</label>
          <input type="range" id="sl_vibrance" min="-50" max="50" value="0">
          <span id="val_vibrance">0</span>
        </div>
        <div class="sliderRow">
          <label>Sytost</label>
          <input type="range" id="sl_saturation" min="-50" max="50" value="0">
          <span id="val_saturation">0</span>
        </div>
        <div class="sliderRow">
          <label>Teplota</label>
          <input type="range" id="sl_temperature" min="-50" max="50" value="0">
          <span id="val_temperature">0</span>
        </div>
      </div>

      <!-- EFEKTY -->
      <div class="tabPane" data-tab="effects">
        <div class="sliderRow">
          <label>Clarity</label>
          <input type="range" id="sl_clarity" min="-50" max="50" value="0">
          <span id="val_clarity">0</span>
        </div>
        <div class="sliderRow">
          <label>Vinětace</label>
          <input type="range" id="sl_vignette" min="-50" max="50" value="0">
          <span id="val_vignette">0</span>
        </div>
      </div>
    </div>

    <hr>

    <div id="cropSection">
      <h2>Ořez</h2>
      <div id="cropButtons">
        <button class="btnCrop" data-ratio="free">Volný</button>
        <button class="btnCrop" data-ratio="4:3">4:3</button>
        <button class="btnCrop" data-ratio="3:4">3:4</button>
        <button class="btnCrop" data-ratio="16:9">16:9</button>
        <button class="btnCrop" data-ratio="9:16">9:16</button>
      </div>
    </div>

    <hr>

    <div id="versions">
      <h2>Verze k uložení</h2>

      <div class="version">
        <label><input type="checkbox" id="chk_orig"> Originál</label>
        <div id="info_orig" class="info"></div>
      </div>

      <div class="version">
        <label><input type="checkbox" id="chk_v2000"> 2000 px</label>
        <div id="info_v2000" class="info"></div>
      </div>

      <div class="version">
        <label><input type="checkbox" id="chk_fullhd"> FullHD</label>
        <div id="info_fullhd" class="info"></div>
      </div>

      <div class="version">
        <label><input type="checkbox" id="chk_small"> Malá verze</label>
        <div id="info_small" class="info"></div>
      </div>
    </div>
  </aside>
</main>

<!-- fullscreen originál -->
<div id="fullscreen" class="hidden">
  <img id="fullImg">
</div>

<script src="app.js"></script>
</body>
</html>
