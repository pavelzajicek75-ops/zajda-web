<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotoedittor - Admin Panel</title>
  <link rel="stylesheet" href="/admin/style.css?v=2.0">
  <style>
    .editor-main {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
      height: calc(100vh - 200px);
    }

    .editor-canvas-section {
      background: #0a0a0a;
      border: 1px solid #ff6600;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: auto;
      position: relative;
    }

    .canvas-container {
      position: relative;
      display: inline-block;
      background: #111;
      padding: 10px;
      border-radius: 4px;
    }

    #mainCanvas {
      max-width: 100%;
      max-height: 100%;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: crosshair;
    }

    .editor-panel {
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #ff6600;
      border-radius: 8px;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .editor-section {
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    .editor-section:last-child {
      border-bottom: none;
    }

    .editor-section h3 {
      color: #ff6600;
      font-size: 14px;
      margin: 0 0 10px 0;
      text-transform: uppercase;
    }

    .slider-group {
      margin-bottom: 12px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      font-size: 12px;
      color: #ccc;
    }

    .slider-value {
      background: #333;
      padding: 2px 6px;
      border-radius: 3px;
      color: #ff6600;
      font-weight: bold;
      font-size: 11px;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #333;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff6600;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff6600;
      cursor: pointer;
      border: none;
    }

    .button-group-editor {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #333;
    }

    .btn-editor {
      padding: 8px 12px;
      background: #ff6600;
      border: none;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-editor:hover {
      background: #ffa500;
    }

    .btn-editor.secondary {
      background: #333;
      color: #ff6600;
      border: 1px solid #ff6600;
    }

    .btn-editor.secondary:hover {
      background: #ff6600;
      color: #fff;
    }

    .btn-editor.danger {
      background: #cc3333;
    }

    .btn-editor.danger:hover {
      background: #ff5555;
    }

    .crop-presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .crop-presets button {
      padding: 6px;
      background: #333;
      border: 1px solid #555;
      color: #ccc;
      cursor: pointer;
      border-radius: 3px;
      font-size: 11px;
      transition: 0.2s;
    }

    .crop-presets button:hover {
      background: #ff6600;
      color: #fff;
    }

    .version-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .version-btn {
      padding: 8px;
      background: #333;
      border: 1px solid #555;
      color: #ccc;
      cursor: pointer;
      border-radius: 4px;
      font-size: 11px;
      transition: 0.2s;
    }

    .version-btn.active {
      background: #ff6600;
      color: #fff;
      border-color: #ff6600;
    }

    @media (max-width: 1024px) {
      .editor-main {
        grid-template-columns: 1fr;
        height: auto;
      }

      .editor-panel {
        max-height: 300px;
      }
    }
  </style>
</head>
<body>

<aside class="sidebar">
  <h2>FOTOEDITTOR</h2>
  <ul>
    <li><a href="/admin/dashboard.html">← Zpět</a></li>
  </ul>
</aside>

<main class="main">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1>📸 Fotoedittor</h1>
    <span id="filename" style="color: #999; font-size: 12px;"></span>
  </div>

  <div class="editor-main">
    <!-- CANVAS -->
    <div class="editor-canvas-section">
      <div class="canvas-container">
        <canvas id="mainCanvas"></canvas>
      </div>
    </div>

    <!-- PANEL -->
    <div class="editor-panel">
      <!-- JASOVÉ ÚPRAVY -->
      <div class="editor-section">
        <h3>Jasové Úpravy</h3>
        
        <div class="slider-group">
          <div class="slider-label">
            <span>Jas</span>
            <span class="slider-value" id="brightnessValue">0</span>
          </div>
          <input type="range" id="brightness" min="-100" max="100" value="0" step="1">
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>Kontrast</span>
            <span class="slider-value" id="contrastValue">0</span>
          </div>
          <input type="range" id="contrast" min="-100" max="100" value="0" step="1">
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>Expozice</span>
            <span class="slider-value" id="exposureValue">0</span>
          </div>
          <input type="range" id="exposure" min="-100" max="100" value="0" step="1">
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>Stíny</span>
            <span class="slider-value" id="shadowsValue">0</span>
          </div>
          <input type="range" id="shadows" min="-100" max="100" value="0" step="1">
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>Světlo</span>
            <span class="slider-value" id="highlightsValue">0</span>
          </div>
          <input type="range" id="highlights" min="-100" max="100" value="0" step="1">
        </div>
      </div>

      <!-- BAREVNÉ ÚPRAVY -->
      <div class="editor-section">
        <h3>Barevné Úpravy</h3>
        
        <div class="slider-group">
          <div class="slider-label">
            <span>Sytost</span>
            <span class="slider-value" id="saturationValue">0</span>
          </div>
          <input type="range" id="saturation" min="-100" max="100" value="0" step="1">
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>Vibrance</span>
            <span class="slider-value" id="vibranceValue">0</span>
          </div>
          <input type="range" id="vibrance" min="-100" max="100" value="0" step="1">
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>Teplota</span>
            <span class="slider-value" id="temperatureValue">0</span>
          </div>
          <input type="range" id="temperature" min="-100" max="100" value="0" step="1">
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>Ostrość</span>
            <span class="slider-value" id="sharpnessValue">0</span>
          </div>
          <input type="range" id="sharpness" min="-100" max="100" value="0" step="1">
        </div>
      </div>

      <!-- TRANSFORMACE -->
      <div class="editor-section">
        <h3>Transformace</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <button class="btn-editor secondary" onclick="rotateImage(-90)">↺ -90°</button>
          <button class="btn-editor secondary" onclick="rotateImage(90)">↻ +90°</button>
          <button class="btn-editor secondary" onclick="flipImageH()">↔ Flip H</button>
          <button class="btn-editor secondary" onclick="flipImageV()">⇅ Flip V</button>
        </div>
      </div>

      <!-- OŘEZ -->
      <div class="editor-section">
        <h3>Ořez</h3>
        <button class="btn-editor secondary" onclick="toggleCrop()" id="cropToggle">✂️ Aktivovat ořez</button>
        <div class="crop-presets" id="cropPresets" style="display: none;">
          <button onclick="setCropRatio('free')">Volný</button>
          <button onclick="setCropRatio('1:1')">1:1</button>
          <button onclick="setCropRatio('4:3')">4:3</button>
          <button onclick="setCropRatio('16:9')">16:9</button>
        </div>
        <div id="cropInfo" style="font-size: 11px; color: #999; margin-top: 10px; display: none;">
          Táhni a kreslí obdélník pro ořez. Klikni "Ořezat" pro potvrzení.
        </div>
        <button class="btn-editor secondary" id="cropApplyBtn" onclick="applyCrop()" style="display: none; margin-top: 8px;">✓ Ořezat</button>
      </div>

      <!-- VERZE K ULOŽENÍ -->
      <div class="editor-section">
        <h3>Verze K Uložení</h3>
        <div class="version-selector">
          <button class="version-btn active" onclick="selectVersion('original')">Originál</button>
          <button class="version-btn" onclick="selectVersion('2000')">2000 px</button>
          <button class="version-btn" onclick="selectVersion('fullhd')">FullHD</button>
          <button class="version-btn" onclick="selectVersion('small')">Malá</button>
        </div>
      </div>

      <!-- AKCE -->
      <div class="button-group-editor">
        <button class="btn-editor" onclick="saveEdits()">💾 Uložit změny</button>
        <button class="btn-editor secondary" onclick="resetEdits()">🔄 Reset</button>
        <button class="btn-editor secondary" onclick="undoEdit()">↶ Vrátit</button>
        <button class="btn-editor danger" onclick="closeEditor()">✕ Zavřít</button>
      </div>
    </div>
  </div>
</main>

<script src="/admin/auth.js"></script>
<script>
let originalImage = null;
let currentFilename = null;
let selectedVersion = 'original';
let history = [];
let cropMode = false;
let cropRatio = 'free';
let cropData = null;
let isDrawingCrop = false;
let startX = 0, startY = 0;

let currentFilters = {
  brightness: 0,
  contrast: 0,
  exposure: 0,
  shadows: 0,
  highlights: 0,
  saturation: 0,
  vibrance: 0,
  temperature: 0,
  sharpness: 0,
  rotation: 0,
  flipH: false,
  flipV: false
};

const params = new URLSearchParams(window.location.search);
const filename = params.get('file');

if (filename) {
  loadImage(filename);
} else {
  alert("Žádný soubor nebyl vybrán");
  window.location.href = "/admin/dashboard.html";
}

async function loadImage(fname) {
  try {
    currentFilename = fname;
    document.getElementById("filename").textContent = fname;
    
    const res = await fetch(`/api/photo/${encodeURIComponent(fname)}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    
    const img = new Image();
    img.onload = () => {
      originalImage = img;
      renderCanvas();
      setupCropListeners();
    };
    img.src = url;
  } catch (err) {
    alert("Chyba při načítání: " + err.message);
  }
}

function renderCanvas() {
  const canvas = document.getElementById("mainCanvas");
  const ctx = canvas.getContext("2d");
  
  canvas.width = originalImage.width;
  canvas.height = originalImage.height;
  
  ctx.save();
  
  // Transformace
  ctx.translate(canvas.width / 2, canvas.height / 2);
  if (currentFilters.rotation) ctx.rotate((currentFilters.rotation * Math.PI) / 180);
  if (currentFilters.flipH) ctx.scale(-1, 1);
  if (currentFilters.flipV) ctx.scale(1, -1);
  ctx.translate(-canvas.width / 2, -canvas.height / 2);
  
  // Filtry
  const brightness = Math.max(-100, Math.min(100, currentFilters.brightness));
  const contrast = Math.max(-100, Math.min(100, currentFilters.contrast));
  const saturation = Math.max(-100, Math.min(100, currentFilters.saturation));
  const exposure = Math.max(-100, Math.min(100, currentFilters.exposure));
  
  ctx.filter = `brightness(${100 + brightness}%) contrast(${100 + contrast}%) saturate(${100 + saturation}%)`;
  
  ctx.drawImage(originalImage, 0, 0);
  ctx.restore();
  
  // Mřížka pro ořez
  if (cropMode && cropData) {
    drawCropGrid();
  }
}

function drawCropGrid() {
  const canvas = document.getElementById("mainCanvas");
  const ctx = canvas.getContext("2d");
  
  if (!cropData) return;
  
  const { x, y, w, h } = cropData;
  
  // Tmavé oblasti mimo ořez
  ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
  ctx.fillRect(0, 0, canvas.width, y);
  ctx.fillRect(0, y + h, canvas.width, canvas.height - (y + h));
  ctx.fillRect(0, y, x, h);
  ctx.fillRect(x + w, y, canvas.width - (x + w), h);
  
  // Mřížka
  ctx.strokeStyle = "rgba(255, 102, 0, 0.5)";
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  
  // Mřížka 3x3
  const cellW = w / 3;
  const cellH = h / 3;
  ctx.strokeStyle = "rgba(255, 102, 0, 0.3)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(x + cellW * i, y);
    ctx.lineTo(x + cellW * i, y + h);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(x, y + cellH * i);
    ctx.lineTo(x + w, y + cellH * i);
    ctx.stroke();
  }
}

function setupCropListeners() {
  const canvas = document.getElementById("mainCanvas");
  
  canvas.addEventListener("mousedown", (e) => {
    if (!cropMode) return;
    const rect = canvas.getBoundingClientRect();
    startX = e.clientX - rect.left;
    startY = e.clientY - rect.top;
    isDrawingCrop = true;
  });
  
  canvas.addEventListener("mousemove", (e) => {
    if (!cropMode || !isDrawingCrop) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    const w = Math.abs(x - startX);
    const h = Math.abs(y - startY);
    
    cropData = {
      x: Math.min(startX, x),
      y: Math.min(startY, y),
      w: w,
      h: h
    };
    
    renderCanvas();
  });
  
  canvas.addEventListener("mouseup", () => {
    isDrawingCrop = false;
  });
}

// Slider listeners
["brightness", "contrast", "exposure", "shadows", "highlights", "saturation", "vibrance", "temperature", "sharpness"].forEach(filterId => {
  document.getElementById(filterId)?.addEventListener("input", (e) => {
    currentFilters[filterId] = parseInt(e.target.value);
    document.getElementById(filterId + "Value").textContent = e.target.value;
    renderCanvas();
  });
});

function rotateImage(angle) {
  currentFilters.rotation = (currentFilters.rotation + angle) % 360;
  renderCanvas();
}

function flipImageH() {
  currentFilters.flipH = !currentFilters.flipH;
  renderCanvas();
}

function flipImageV() {
  currentFilters.flipV = !currentFilters.flipV;
  renderCanvas();
}

function toggleCrop() {
  cropMode = !cropMode;
  const toggle = document.getElementById("cropToggle");
  const presets = document.getElementById("cropPresets");
  const info = document.getElementById("cropInfo");
  const applyBtn = document.getElementById("cropApplyBtn");
  const canvas = document.getElementById("mainCanvas");
  
  if (cropMode) {
    toggle.textContent = "✓ Ořez aktivní";
    toggle.style.background = "#ff6600";
    presets.style.display = "grid";
    info.style.display = "block";
    applyBtn.style.display = "block";
    canvas.style.cursor = "crosshair";
  } else {
    toggle.textContent = "✂️ Aktivovat ořez";
    toggle.style.background = "";
    presets.style.display = "none";
    info.style.display = "none";
    applyBtn.style.display = "none";
    cropData = null;
    canvas.style.cursor = "default";
  }
  
  renderCanvas();
}

function setCropRatio(ratio) {
  cropRatio = ratio;
  alert("TODO: Implementovat ořez v poměru " + ratio);
}

function applyCrop() {
  if (!cropData || cropData.w === 0 || cropData.h === 0) {
    alert("Vyber ořez pomocí myši na obrázku!");
    return;
  }
  
  const canvas = document.getElementById("mainCanvas");
  const ctx = canvas.getContext("2d");
  const imageData = ctx.getImageData(cropData.x, cropData.y, cropData.w, cropData.h);
  
  canvas.width = cropData.w;
  canvas.height = cropData.h;
  ctx.putImageData(imageData, 0, 0);
  
  // Update original image dimensions
  originalImage.width = cropData.w;
  originalImage.height = cropData.h;
  
  cropData = null;
  cropMode = false;
  document.getElementById("cropToggle").textContent = "✂️ Aktivovat ořez";
  document.getElementById("cropPresets").style.display = "none";
  document.getElementById("cropInfo").style.display = "none";
  document.getElementById("cropApplyBtn").style.display = "none";
  
  alert("✅ Fotka byla ořezána! Nyní ji můžeš uložit.");
}

function selectVersion(version) {
  selectedVersion = version;
  document.querySelectorAll(".version-btn").forEach(btn => btn.classList.remove("active"));
  event.target.classList.add("active");
}

function resetEdits() {
  currentFilters = {
    brightness: 0,
    contrast: 0,
    exposure: 0,
    shadows: 0,
    highlights: 0,
    saturation: 0,
    vibrance: 0,
    temperature: 0,
    sharpness: 0,
    rotation: 0,
    flipH: false,
    flipV: false
  };
  document.querySelectorAll("input[type='range']").forEach(input => {
    input.value = 0;
    input.dispatchEvent(new Event("input"));
  });
  renderCanvas();
}

function undoEdit() {
  if (history.length > 0) {
    currentFilters = history.pop();
    updateSliders();
    renderCanvas();
  }
}

function updateSliders() {
  document.getElementById("brightness").value = currentFilters.brightness;
  document.getElementById("contrast").value = currentFilters.contrast;
  document.getElementById("exposure").value = currentFilters.exposure;
  document.getElementById("saturation").value = currentFilters.saturation;
}

async function saveEdits() {
  history.push({...currentFilters});
  
  const canvas = document.getElementById("mainCanvas");
  const quality = selectedVersion === 'original' ? 0.95 : 0.8;
  
  canvas.toBlob(async (blob) => {
    try {
      const res = await fetch(`/api/photo/${encodeURIComponent(currentFilename)}`, {
        method: "PUT",
        body: blob
      });

      if (res.ok) {
        alert("✅ Fotka uložena v " + selectedVersion + "!");
        setTimeout(() => window.location.href = "/admin/dashboard.html", 1500);
      } else {
        alert("❌ Chyba při ukládání!");
      }
    } catch (err) {
      alert("❌ Chyba: " + err.message);
    }
  }, "image/jpeg", quality);
}

function closeEditor() {
  if (confirm("Zavřít editor? Neuložené změny budou ztraceny.")) {
    window.location.href = "/admin/dashboard.html";
  }
}
</script>

</body>
</html>
