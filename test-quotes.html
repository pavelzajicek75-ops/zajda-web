<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>TEST QUOTES</title>
</head>
<body>
  <h1>TEST /api/quotes</h1>

  <div id="quotes"></div>

  <script>
    async function run() {
      const box = document.getElementById("quotes");
      box.innerHTML = "<p>Načítám…</p>";

      try {
        const res = await fetch("/api/quotes");
        const data = await res.json();

        box.innerHTML = "<h2>Citáty:</h2>";

        data.forEach(q => {
          const div = document.createElement("div");
          div.innerHTML = `<p>"${q.text}" — <b>${q.author}</b></p>`;
          box.appendChild(div);
        });

      } catch (err) {
        box.innerHTML = "<p>Chyba: " + err.message + "</p>";
      }
    }

    run();
  </script>
</body>
</html>
